// a job for the worker; null when there is none (the caller does it on the page). kind "print": a newer one
// replaces the one still running
function onHelper(fn, args, transfer, kind){
  if (kind && [...helper.kinds.values()].includes(kind)) helperStop(false, "replaced");
  const w = helperWorker(); if (!w) return null;
  return new Promise((resolve, reject) => {
    const id = ++helper.seq; helper.jobs.set(id, { resolve, reject }); if (kind) helper.kinds.set(id, kind);
    try { w.postMessage({ id, fn, args }, transfer || []); } catch (err){ helper.jobs.delete(id); helper.kinds.delete(id); reject(err); }
  });
}
// the mesh check of a part, once: parts do not change after they are built, and the checks run after every change
const meshCheckCache = new WeakMap();

   meets the model on every move. three.js tests every triangle (13 ms on the painted vase, far more on a

   built on the helper thread; until they arrive, picking works the plain way. */

  if (k == 1) return step(0.7, fract(q.x + q.y));
  if (k == 2) return step(0.7, fract(q.x - q.y));

function splitSections(root){

  const pages = [], byTitle = {};

  let current = "Basics";
  [...root.childNodes].forEach(el => {
    if (el.nodeType !== 1){ if (el.textContent.trim()) page(current).nodes.push(el); return; }
    if (el.matches("h2")){ current = el.textContent.trim(); page(current); return; }
    if (el.matches("details.group")){
      const body = el.querySelector(".body");
      page(el.querySelector("summary").textContent.trim()).nodes.push(...body.childNodes);

    if (el.matches(".card.step")){
      const head = el.querySelector(".stephead b");
      page(head ? head.textContent.trim() : "Step").nodes.push(el);

    }

  });

/* Rulers along the bed's three axes in millimetres, 0 at the front-left corner like the printer's own
   coordinates, and the model's width, depth and height drawn along its edges. */
function rulerLabel(text, h, color){
  const fs = 44, pad = 8, font = `700 ${fs}px Manrope, system-ui, sans-serif`, cv = document.createElement("canvas");
  const m = cv.getContext("2d"); m.font = font;
  const tw = Math.ceil(m.measureText(text).width) + pad*2;
  cv.width = tw; cv.height = fs + pad*2;
  const x = cv.getContext("2d"); x.font = font; x.fillStyle = color; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(text, tw/2, cv.height/2);
  const tex = new THREE.CanvasTexture(cv); tex.minFilter = THREE.LinearFilter;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true, depthTest:false }));
  sp.scale.set(h*tw/cv.height, h, 1); sp.renderOrder = 5;
  return sp;
}
function makeRulers(bed, dark){
  const g = new THREE.Group(), txt = dark ? "#9fb0bf" : "#44515c", acc = dark ? "#ffb454" : "#b85600", seg = [], dimSeg = [];
  const add = (list, a, b) => list.push(a[0], a[1], a[2], b[0], b[1], b[2]);
  const X = bed[0], Y = bed[1], big = Math.max(X, Y), off = Math.max(3, big*0.014), lab = Math.max(3.4, big*0.021);
  // millimetres: a tick every 5, labels every 10/20/50; inches: a tick every quarter, labels every inch (2 on big beds)
  const inch = state.view.units === "in", minor = inch ? 25.4/4 : 5;
  const every = inch ? (big > 300 ? 8 : 4) : (big > 300 ? 50 : big > 120 ? 20 : 10)/5;          // in minor steps
  const everyZ = inch ? 4 : (every > 2 ? 4 : 2);
  const tick = n => inch ? (n % 4 === 0 ? off*1.7 : n % 2 === 0 ? off : off*0.5) : (n % 10 === 0 ? off*1.7 : n % 2 === 0 ? off : off*0.5);
  const text = n => String(inch ? n/4 : n*5);
  for (let n=0;n*minor<=X+1e-6;n++){
    const x = -X/2 + n*minor; add(seg, [x, 0, Y/2 + off*0.4], [x, 0, Y/2 + off*0.4 + tick(n)]);
    if (n % every === 0){ const s = rulerLabel(text(n), lab, txt); s.position.set(x, 0, Y/2 + off*2.4 + lab*0.6); g.add(s); }
  }
  add(seg, [-X/2, 0, Y/2 + off*0.4], [X/2, 0, Y/2 + off*0.4]);
  for (let n=0;n*minor<=Y+1e-6;n++){
    const z = Y/2 - n*minor; add(seg, [-X/2 - off*0.4, 0, z], [-X/2 - off*0.4 - tick(n), 0, z]);
    if (n % every === 0 && n > 0){ const s = rulerLabel(text(n), lab, txt); s.position.set(-X/2 - off*2.4 - lab*0.9, 0, z); g.add(s); }
  }
  add(seg, [-X/2 - off*0.4, 0, Y/2], [-X/2 - off*0.4, 0, -Y/2]);
  const top = Math.min(bed[2] || 256, Math.max(20, Math.ceil(((lastSize && lastSize.y) || 10)*1.15/10)*10));
  for (let n=0;n*minor<=top+1e-6;n++){
    const y = n*minor, t = tick(n)*0.7; add(seg, [-X/2, y, -Y/2], [-X/2 - t, y, -Y/2 - t]);
    if (n % everyZ === 0 && n > 0){ const s = rulerLabel(text(n), lab*0.9, txt); s.position.set(-X/2 - off*2.2 - lab, y, -Y/2 - off*2.2); g.add(s); }
  }
  add(seg, [-X/2, 0, -Y/2], [-X/2, top, -Y/2]);
  const unit = rulerLabel(inch ? "in" : "mm", lab*0.9, txt); unit.position.set(X/2 + off*2 + lab, 0, Y/2 + off*2.4 + lab*0.6); g.add(unit);
  g.add(new THREE.LineSegments(new THREE.BufferGeometry().setAttribute("position", new THREE.Float32BufferAttribute(seg, 3)),
    new THREE.LineBasicMaterial({ color: dark ? 0x7f8c99 : 0x5b6873 })));
  // the model's own size along its edges
  const box = new THREE.Box3().setFromObject(modelGroup);
  if (!box.isEmpty()){
    const a = box.min, b = box.max, sz = box.getSize(new THREE.Vector3()), big2 = Math.max(sz.x, sz.y, sz.z);
    const d = Math.max(2.5, big2*0.07), lh = Math.min(12, Math.max(2.6, big2*0.055)), y0 = 0.05, e = d*0.35;
    add(dimSeg, [a.x, y0, b.z + d], [b.x, y0, b.z + d]); add(dimSeg, [a.x, y0, b.z + d - e], [a.x, y0, b.z + d + e]); add(dimSeg, [b.x, y0, b.z + d - e], [b.x, y0, b.z + d + e]);
    add(dimSeg, [b.x + d, y0, a.z], [b.x + d, y0, b.z]); add(dimSeg, [b.x + d - e, y0, a.z], [b.x + d + e, y0, a.z]); add(dimSeg, [b.x + d - e, y0, b.z], [b.x + d + e, y0, b.z]);
    add(dimSeg, [b.x + d, 0, b.z + d], [b.x + d, b.y, b.z + d]); add(dimSeg, [b.x + d - e, b.y, b.z + d], [b.x + d + e, b.y, b.z + d]);
    const put = (text, x, y, z) => { const s = rulerLabel(text, lh, acc); s.position.set(x, y, z); g.add(s); };
    put(mm(sz.x), (a.x + b.x)/2, y0, b.z + d + lh*0.9);
    put(mm(sz.z), b.x + d + lh*2.2, y0, (a.z + b.z)/2);
    put(mm(sz.y), b.x + d + lh*2.2, b.y/2, b.z + d);
    g.add(new THREE.LineSegments(new THREE.BufferGeometry().setAttribute("position", new THREE.Float32BufferAttribute(dimSeg, 3)),
      new THREE.LineBasicMaterial({ color: dark ? 0xffb454 : 0xb85600, depthTest:false })));
  }
  return g;
}

function tracerFields(p){

    c.innerHTML = `<div class="stephead"><span class="stepnum">${n}</span><b>${title}</b></div>`;
    p.appendChild(c); body(c); return c;
  };
  if (!d){
    step(1, "Take the photo", c => {
      note(c, `Lay the part flat on plain white paper, shoot from <b>straight above</b> in even light, and fill most of the frame.

      buttonRow(c, [["Add the photo on the Art tab", ()=>{ tab = "art"; renderTab(); }]]);

  step(1, "Photo", c => {
    note(c, `Tracing <b>${esc(d.name)}</b>. Shot from straight above, on a plain contrasting background, gives the cleanest outline.`);

      ? "This picture has a transparent background, so everything that is not transparent is traced."
      : "This picture has a transparent background. Remove background uses it directly and is usually the better choice here.");

    numField(c,{ label:"Thicken lines thinner than (mm)", min:0,max:3,step:0.05, get:()=>T.minLine || 0, set:v=>T.minLine=v, onChange:baseChanged,

function drawTracerPreview(cv){
  const info = tracerInfo; if (!info || !cv) return;
  const W = info.w, H = info.h, sc = Math.min(1, 640/Math.max(W,H));
  cv.width = Math.round(W*sc); cv.height = Math.round(H*sc);
  const x = cv.getContext("2d");
  if (tracerView === "mask"){
    const im = x.createImageData(W, H);
    for (let i=0;i<info.mask.length;i++){ const o=i*4, on = info.mask[i];
      im.data[o] = on?31:236; im.data[o+1] = on?111:240; im.data[o+2] = on?139:244; im.data[o+3] = 255; }
    const tmp = document.createElement("canvas"); tmp.width = W; tmp.height = H; tmp.getContext("2d").putImageData(im,0,0);
    x.drawImage(tmp, 0, 0, cv.width, cv.height);
  } else {
    const tmp = document.createElement("canvas"); tmp.width = W; tmp.height = H;
    const t2 = tmp.getContext("2d"), id3 = t2.createImageData(W, H);
    id3.data.set(info.img.data); t2.putImageData(id3, 0, 0);
    x.drawImage(tmp, 0, 0, cv.width, cv.height);
  }

  const T = state.base.tracer;
  cv.style.cursor = T.brushMode === "off" ? "default" : "crosshair";
  let stroke = null;
  const at = ev => { const r = cv.getBoundingClientRect(); return [ (ev.clientX-r.left)/r.width, (ev.clientY-r.top)/r.height ]; };
  const dab = (u,v) => {
    x.fillStyle = T.brushMode === "add" ? "rgba(31,111,139,.55)" : "rgba(255,61,127,.55)";
    x.beginPath(); x.arc(u*cv.width, v*cv.height, Math.max(2, stroke.r*cv.width), 0, Math.PI*2); x.fill();
  };
  cv.onpointerdown = ev => {
    if (T.brushMode === "off") return;
    const rNorm = (T.brushSize/2) / (info.mmPerPx*W);         // brush radius as a fraction of image width
    stroke = { m:T.brushMode, r:rNorm, pts:[at(ev)] };
    dab(...stroke.pts[0]);
    if (cv.setPointerCapture) try { cv.setPointerCapture(ev.pointerId); } catch(e){}
  };

    if (!stroke) return;
    const p = at(ev), q = stroke.pts[stroke.pts.length-1];

    T.strokes = (T.strokes||[]).concat([stroke]); stroke = null;

// what it looks like against a light: transmission falls off exponentially with thickness
function drawLithoPreview(cv){
  cv = cv || document.getElementById("lithoPreview");
  const L = lithoInfo; if (!cv) return;
  const ctx = cv.getContext("2d");
  if (!L){ cv.width = 320; cv.height = 60; ctx.clearRect(0,0,cv.width,cv.height); return; }
  if (L.shape === "strip"){                          // each step as it should look against the light
    const n = L.steps.length, sw = Math.max(16, Math.floor(640/n)), k = 1.3, top = Math.exp(-k*L.steps[0]);
    cv.width = n*sw; cv.height = 120; ctx.fillStyle = "#2a2622"; ctx.fillRect(0,0,cv.width,cv.height);
    L.steps.forEach((t,i) => {
      const g = Math.pow(clamp(Math.exp(-k*t)/top, 0, 1), 1/2.2);
      ctx.fillStyle = `rgb(${Math.round(40+215*g)},${Math.round(30+200*g)},${Math.round(20+160*g)})`; ctx.fillRect(i*sw, 0, sw, 84);
      ctx.fillStyle = "#e9e4dc"; ctx.font = `600 ${Math.min(16, sw*0.45)}px sans-serif`; ctx.textAlign = "center";
      ctx.fillText(L.label(t), i*sw + sw/2, 108);
    });
    return;
  }
  const scale = Math.max(1, Math.ceil(Math.max(L.gx, L.gy)/420)), w = Math.ceil(L.gx/scale), h = Math.ceil(L.gy/scale);
  cv.width = w; cv.height = h;
  const img = ctx.createImageData(w, h), k = 1.3, lo = Math.exp(-k*L.maxT), hi = Math.exp(-k*L.minT);
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){
    const i = Math.min(L.gx-1, x*scale), j = Math.min(L.gy-1, (h-1-y)*scale), n = j*L.gx+i, o = (y*w+x)*4;
    if (L.sdf && L.sdf[n] > 0){ img.data[o+3] = 0; continue; }
    const g = Math.pow(clamp((Math.exp(-k*L.thick[n]) - lo)/(hi - lo), 0, 1), 1/2.2);
    img.data[o] = 40 + 215*g; img.data[o+1] = 30 + 200*g; img.data[o+2] = 20 + 160*g; img.data[o+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}

// the picture with the cut over it; the same drawing becomes the box picture
function paintJigsaw(x, w, h, opts){
  const J = jigsawInfo; if (!J) return;
  const sc = w / J.W, tx = pt => (pt[0] + J.W/2)*sc, ty = pt => (J.H/2 - pt[1])*sc;
  x.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--panel2").trim() || "#eef1f5";
  x.fillRect(0, 0, w, h);
  if (J.src){
    x.save();
    if (J.mirror){ x.translate(w, 0); x.scale(-1, 1); }
    x.drawImage(J.src, 0, 0, w, h);
    x.restore();
  }
  const path = L => { L.forEach((pt,i)=>{ i ? x.lineTo(tx(pt), ty(pt)) : x.moveTo(tx(pt), ty(pt)); }); };
  if (J.outline){                                   // everything outside a shaped puzzle is cut away
    x.beginPath(); x.rect(0, 0, w, h); path(J.outline); x.closePath();
    x.fillStyle = opts.box ? "#ffffff" : "rgba(20,27,36,.62)"; x.fill("evenodd");
  }
  const strokeAll = (width, colour) => {
    x.lineWidth = width; x.strokeStyle = colour; x.lineJoin = "round"; x.lineCap = "round";
    J.lines.forEach(L => { x.beginPath(); path(L); x.stroke(); });
    if (J.outline){ x.beginPath(); path(J.outline); x.closePath(); x.stroke(); }
  };
  if (opts.box) strokeAll(Math.max(1, w/700), "rgba(0,0,0,.18)");
  else { strokeAll(3.2, "rgba(20,27,36,.55)"); strokeAll(1.4, "#ffffff"); }
}
function drawJigsawPreview(cv){
  cv = cv || document.getElementById("jigsawPreview");
  const J = jigsawInfo; if (!cv || !J) return;
  const sc = Math.min(640/J.W, 460/J.H);
  cv.width = Math.max(8, Math.round(J.W*sc)); cv.height = Math.max(8, Math.round(J.H*sc));
  paintJigsaw(cv.getContext("2d"), cv.width, cv.height, { box:false });
}
async function exportJigsawSVG(){

async function exportJigsawPNG(){
  const J = jigsawInfo; if (!J){ notify("Make a jigsaw puzzle first."); return; }
  const c = document.createElement("canvas"), sc = Math.min(1800/J.W, 1800/J.H);
  c.width = Math.round(J.W*sc); c.height = Math.round(J.H*sc);

}

function toggleSkip(d,i){ d.skip = d.skip.includes(i)?d.skip.filter(x=>x!==i):[...d.skip,i]; d.solids = null; schedule(); pushHistory(); }
function dropBackground(d){
  const src = sourceCanvas(d); if (!src) return;
  const x = src.getContext("2d", { willReadFrequently:true });
  const pick = (px,py)=>{ const p = x.getImageData(px,py,1,1).data; return [p[0],p[1],p[2],p[3]]; };
  const corners = [pick(0,0), pick(src.width-1,0), pick(0,src.height-1), pick(src.width-1,src.height-1)].filter(c=>c[3]>128);
  if (!corners.length){ notify("The background is already transparent."); return; }
  const avg = [0,1,2].map(k=>corners.reduce((a,c)=>a+c[k],0)/corners.length);
  let best = 0, bd = Infinity;
  state.slots.forEach((s2,i)=>{ const dd = C.colorDist(avg, C.hexToRgb(s2.hex)); if (dd < bd){ bd = dd; best = i; } });
  if (!d.skip.includes(best)) d.skip.push(best);
  notify(`Dropped filament ${best+1} (${state.slots[best].name}) from this artwork.`);
  d.solids = null; schedule(); pushHistory(); renderTab();
}

function drawPreview(){
  const cv = $("#preview"), d = state.items[state.active];
  if (!cv || !d || !d._cm) return;
  const { gx, gy, idx } = d._cm, zoom = d.zoom||1;
  const w = Math.min(680, Math.round(330*zoom));
  cv.width = gx; cv.height = gy; cv.style.width = w+"px"; cv.style.height = Math.round(w/d.aspect)+"px";
  const x = cv.getContext("2d");
  if (d.previewMode === "original" || d.previewMode === "split"){
    const src = sourceCanvas(d);
    if (src) x.drawImage(src, 0, 0, gx, gy);
  }
  if (d.previewMode !== "original"){
    const im = x.createImageData(gx,gy), rgb = state.slots.map(s2=>C.hexToRgb(s2.hex));
    const from = d.previewMode === "split" ? Math.floor(gx/2) : 0;
    const base = d.previewMode === "split" ? x.getImageData(0,0,gx,gy) : null;
    for (let j=0;j<gy;j++) for (let i=0;i<gx;i++){
      const k = j*gx+i, o = k*4;
      if (d.previewMode === "split" && i < from){ for (let q=0;q<4;q++) im.data[o+q] = base.data[o+q]; continue; }
      const s2 = idx[k];
      if (s2 < 0 || !rgb[s2]) continue;
      im.data[o] = rgb[s2][0]; im.data[o+1] = rgb[s2][1]; im.data[o+2] = rgb[s2][2]; im.data[o+3] = 255;
    }
    x.putImageData(im,0,0);
  }

    if (d.forceSlot != null || !d._raw || d.previewMode === "original") return;
    const r = cv.getBoundingClientRect();
    const i = clamp(Math.floor((ev.clientX-r.left)/r.width*gx),0,gx-1), j = clamp(Math.floor((ev.clientY-r.top)/r.height*gy),0,gy-1);

  };
}
function wireDrop(){

async function addFiles(files){
  const imgs = [...files].filter(f=>f.type.startsWith("image/"));
  if (!imgs.length){ notify("Those files are not images."); return; }
  const drop = $("#drop"); if (drop) drop.classList.add("loading");
  if (dropExamples()) notify("The example picture made way for yours.");
  setBusy(true, `Loading ${imgs.length} picture${imgs.length===1?"":"s"}…`);
  for (const file of imgs){
    try {
      const svg = /svg/i.test(file.type) || /\.svg$/i.test(file.name) ? await loadSvgFile(file) : null;
      const canvas = svg ? svg.canvas : toCanvas(await loadImageFile(file));
      const id = "a"+(uid++);
      assets[id] = { canvas, dataURL:canvas.toDataURL("image/png") };
      // switch earlier pictures off so the new one does not land on top of them
      const wereOn = state.items.filter(x=>!x.text && x.enabled !== false);
      wereOn.forEach(x=>{ x.enabled = false; x.solids = null; });
      if (wereOn.length) notify("Earlier pictures were switched off so they don't overlap. Click a thumbnail to switch one back on.");
      const it = newItem(file.name.replace(/\.[^.]+$/,""), canvas, { asset:id, enabled:true });
      if (svg && svg.mm) it.mm = svg.mm.map(v => +v.toFixed(3));        // the drawing's real size, for the tracer
      it.src = canvas; it.thumb = assets[id].dataURL;
      state.items.push(it); state.active = state.items.length-1;
    } catch (err){ notify(err.message); }
  }
  setBusy(false); logLine(`Added ${imgs.length} picture${imgs.length===1?"":"s"}`);
  renderTab(); schedule(); pushHistory();
}

function removeSlot(i){
  state.slots.splice(i,1);
  const fix = v => v >= state.slots.length ? 0 : (v > i ? v-1 : v);
  const b = state.base;
  b.slot = fix(b.slot);
  const np = b.nameplate; np.nameSlot = fix(np.nameSlot); np.accentSlot = fix(np.accentSlot); np.backSlot = fix(np.backSlot);
  const bo = b.bobble; bo.headSlot = fix(bo.headSlot); bo.bodySlot = fix(bo.bodySlot); bo.postSlot = fix(bo.postSlot);
  const lb = b.lightbox; lb.diffSlot = fix(lb.diffSlot); lb.frameSlot = fix(lb.frameSlot);
  const pb = b.pcb; pb.traceSlot = fix(pb.traceSlot); pb.textSlot = fix(pb.textSlot);
  state.items.forEach(d=>{
    d.skip = d.skip.filter(x=>x!==i).map(x=>x>i?x-1:x);
    if (d.forceSlot != null) d.forceSlot = d.forceSlot === i ? 0 : fix(d.forceSlot);
    if (d.outline) d.outline.slot = fix(d.outline.slot);
    d.solids = null;
  });
  // paint that used the removed filament goes back to the part's own colour; later numbers move down
  const pk = v => v === PAINT_LEAVE ? v : v === i ? PAINT_LEAVE : v > i ? v - 1 : v, p0 = v => Math.min(pk(v) === PAINT_LEAVE ? 0 : pk(v), state.slots.length - 1);
  (state.paint && state.paint.ops || []).forEach(o => {
    for (const k of ["slot","gap","up","side","down","edges","hollows","flat"]) if (typeof o[k] === "number") o[k] = pk(o[k]);
    for (const k of ["a","b","from","to"]) if (typeof o[k] === "number" && (o.k === "gradient" || o.k === "swap")) o[k] = p0(o[k]);
    if (Array.isArray(o.slots)) o.slots = o.k === "height" || o.k === "photo" ? o.slots.map(pk) : o.slots.map(pk).filter(v => v !== PAINT_LEAVE);
  });
  if (paintUI.slot >= state.slots.length) paintUI.slot = state.slots.length - 1;
  renderTab(); schedule(); pushHistory();
}

function layoutMode(){
  const ui = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--ui")) || 1, w = innerWidth, h = innerHeight;
  // a phone on its side is too short to stack the model over the settings: side by side, as on a tablet
  return w >= 1100 * ui ? "wide" : w < 760 * ui && !(w > h && h < 520) ? "phone" : "narrow";
}
function fitLayout(){

async function buildZip(parts, title){

  }

    `Maker Forge export: ${title}`,

    `Estimated material: ${lastChecks.totals.grams ? lastChecks.totals.grams.toFixed(1)+" g" : "n/a"}`,
    `Printer profile: ${state.printer.model}, ${state.printer.nozzle} mm nozzle, ${state.printer.layer} mm layers`, "",
    "Filaments:",
    ...P.map(p=>`  Slot ${p.slot+1}: ${state.slots[p.slot].name} (${state.slots[p.slot].hex}, ${state.slots[p.slot].mat})`), "",
    "PrusaSlicer / OrcaSlicer: open model-prusa-orca.3mf. Parts and extruders are already assigned.",
    "Bambu Studio: open model-bambu.3mf. It uses Bambu's own layout: one part per filament with the",
    "  extruder numbers set and the spool colours in project_settings. If your version refuses it,",

    "One colour at a time: print stl/all-parts-merged.stl, or use the swap heights from the Check tab.",

}
async function exportZip(e){

async function exportBatch(text){

  if (state.base.type !== "nameplate"){ notify("Switch the object to Name plate first."); return; }
  notify(`Building ${names.length} keychains…`);

  state.base.nameplate.batch = false;

    for (const n of names){

      parts.forEach(p=>{ if (!bySlot.has(p.slot)) bySlot.set(p.slot, []); bySlot.get(p.slot).push(p.solid); });
      const list = [...bySlot.entries()].sort((a,b)=>a[0]-b[0]).map(([slot,items])=>{
        const m = C.mergeSolids(items); return { name:state.slots[slot].name, slot, pos:m.pos, idx:m.idx };
      });
      const { parts:P } = C.prepareParts(list);
      const mf = new JSZip();

      const safe = n.replace(/[^\w -]+/g,"").trim().replace(/\s+/g,"-") || "name";
      zip.file(`${safe}.3mf`, await mf.generateAsync({ type:"uint8array", compression:"DEFLATE", compressionOptions:{level:6} }));

/* ---------- presets, theme, keyboard, start ---------- */
/* Built-in examples (Session 19, the table is in src/examples.js): a quick start or an object opens with
   a finished example while there are no pictures of the person's own. The example's pictures are marked
   `example`, and give way to the first picture or text added. Its filaments are only set while nobody has
   changed them (or on a quick start, which sets things up anyway); its settings only where they are
   still as they started. */
const EXAMPLE_NOTE = "This is an example: add your own picture on the Art tab and it takes its place.";
function exampleNote(key){
  const ex = key && encHas(EXAMPLES, key) ? EXAMPLES[key] : {};
  if (ex.paint && !ex.art) return "This is an example: its colours are painted on the Paint tab, where you can change them or start again.";
  if (ex.note) return ex.note + " " + EXAMPLE_NOTE;
  if (ex.view === "flip") return EXAMPLE_NOTE + " It is shown turned over so you can see the picture: the ⟳ button above the model turns it back.";
  return EXAMPLE_NOTE;
}
const exampleCanvases = new Map();        // art key → { canvas, url }, drawn once per visit
const exampleSized = new WeakSet();       // example pictures with a width of their own
let exampleBusy = 0, exampleToken = 0, examplePaintSig = "", exampleSlotSig = "";
const slotSig = () => state.slots.map(s => s.hex + "/" + s.name).join("|");
const DEFAULT_SLOT_SIG = DEFAULTS().slots.map(s => s.hex + "/" + s.name).join("|");
const canon = v => JSON.stringify(v, (k, x) => x && typeof x === "object" && !Array.isArray(x) ? Object.fromEntries(Object.keys(x).sort().map(q => [q, x[q]])) : x);
async function exampleCanvas(key){
  if (exampleCanvases.has(key)) return exampleCanvases.get(key);
  const art = encHas(EXAMPLE_ART, key) ? EXAMPLE_ART[key] : null; if (!art) return null;
  const canvas = document.createElement("canvas"); canvas.width = art.w; canvas.height = art.h;
  await art.draw(canvas.getContext("2d"), art.w, art.h);
  const out = { canvas, url:canvas.toDataURL("image/png") };
  exampleCanvases.set(key, out); return out;
}
// takes the example pictures away (and an example's paint, while it is untouched); true when there were some
function dropExamples(){
  const act = state.items[state.active], n = state.items.length;
  state.items = state.items.filter(it => !it.example);
  state.active = state.items.indexOf(act); if (state.active < 0) state.active = state.items.length - 1;
  if (examplePaintSig && state.paint && JSON.stringify(state.paint.ops) === examplePaintSig){ state.paint.ops = []; paintPrepared = false; }
  return state.items.length !== n;
}
// the settings an example changes are still as they started (or as an example left them)
function exampleBaseFree(base){
  const def = DEFAULTS().base;
  return Object.entries(base).every(([k, over]) => Object.keys(over).every(f => {
    const cur = canon((state.base[k] || {})[f]), was = (def[k] || {})[f];
    const set = over[f] && typeof over[f] === "object" ? Object.assign(JSON.parse(JSON.stringify(was || {})), over[f]) : over[f];
    return cur === canon(was) || cur === canon(set);
  }));
}
async function loadExample(key, preset){
  const token = ++exampleToken, ex = key && encHas(EXAMPLES, key) ? EXAMPLES[key] : null;
  dropExamples(); setViewFlags({ flip:false, layout:false });
  if (!ex || state.items.some(it => !it.example)) return false;
  const art = ex.art ? await exampleCanvas(ex.art) : null;
  if (token !== exampleToken) return false;            // another start was picked meanwhile
  dropExamples();
  if (state.items.some(it => !it.example) || (ex.art && !art)) return false;
  if (ex.slots && (preset || slotSig() === DEFAULT_SLOT_SIG || slotSig() === exampleSlotSig))
    ex.slots.forEach(([hex, name], i) => { if (state.slots[i]) Object.assign(state.slots[i], { hex, name }); });
  if (ex.base && (preset || exampleBaseFree(ex.base)))
    for (const [k, over] of Object.entries(ex.base)) for (const [f, v] of Object.entries(over)){
      if (!state.base[k]) continue;
      state.base[k][f] = v && typeof v === "object" ? Object.assign(JSON.parse(JSON.stringify(state.base[k][f] || {})), v) : v;
    }
  if (ex.paint){ state.paint.ops = JSON.parse(JSON.stringify(ex.paint)); state.paint.on = true; paintPrepared = false; examplePaintSig = JSON.stringify(state.paint.ops); }
  if (art){
    const id = "a" + (uid++); assets[id] = { canvas:art.canvas, dataURL:art.url };
    const it = newItem("Example: " + EXAMPLE_ART[ex.art].name, art.canvas, Object.assign({ asset:id, enabled:true, example:true }, JSON.parse(JSON.stringify(ex.item || {}))));
    if (ex.width){ it.width = ex.width; exampleSized.add(it); }
    if (ex.place === "top" && state.base.type === "hex") it.place = { c:[0, state.base.hex.h, 0], n:[0,1,0] };
    it.src = art.canvas; it.thumb = art.url;
    state.items.push(it); state.active = state.items.length - 1;
  }
  if (ex.view) setViewFlags({ [ex.view]:true });
  exampleSlotSig = slotSig();
  return true;
}
function applyPreset(key){
  const pr = PRESETS[key], b = state.base;
  clearPaintForNewModel();
  b.type = pr.base.type;
  for (const k of ["board","frame","shell","nameplate","canvas","bobble","cutter","turned","jigsaw","lithophane"]) if (pr.base[k]) Object.assign(b[k], pr.base[k]);
  if (pr.base.type === "jigsaw") Object.assign(b.jigsaw, DEFAULTS().base.jigsaw, pr.base.jigsaw || {});
  if (pr.base.type === "lithophane") Object.assign(b.lithophane, DEFAULTS().base.lithophane, pr.base.lithophane || {});
  if (pr.base.type === "phonecase" && !b.phonecase) b.phonecase = DEFAULTS().base.phonecase;
  if (pr.base.type === "enclosure"){
    const e = Object.assign(DEFAULTS().base.enclosure, JSON.parse(JSON.stringify(pr.base.enclosure || {})));
    e.cut = e.cut.map(c => Object.assign(newOpening(c.kind, c.face), c));
    b.enclosure = e;
  }
  if (pr.slots) pr.slots.forEach((sl,i)=>{ if (state.slots[i]) Object.assign(state.slots[i], sl); });
  if (pr.item) state.items.forEach(d=>{ Object.assign(d, pr.item); d._imgKey = ""; d.solids = null; });
  state.items.forEach(d=>d.place = defaultPlace());
  userMoved = false;
  renderTab(); renderStarts();
  notify(pr.tip);
  exampleBusy++;
  (async ()=>{
    // with no pictures of their own, the quick start opens with its example
    let added = false;
    try { added = await loadExample(key, true); } catch (err){ console.error(err); }
    if (added){ renderTab(); notify(pr.tip + " " + exampleNote(key)); }
    // still busy until the last rebuild is under way (a test waiting for "not busy" would otherwise act
    // between the two rebuilds, and a measurement it started would be cleared by the second)
    try { await rebuildAll(false); await new Promise(r=>setTimeout(r,60));
      state.items.forEach(d=>{ if (!exampleSized.has(d)) d.width = defaultWidth(d.aspect); d.solids = null; }); schedule(); }
    finally { exampleBusy--; }
    exampleSlotSig = slotSig(); pushHistory();
  })();
  pushHistory();
}

/* ---- easy reading: kept in this browser for every project, not in project files ---- */
const PREFS_DEFAULT = { ui:1, contrast:"normal", font:"normal", motion:"auto", notice:1, speak:false, patterns:false };
let prefs = Object.assign({}, PREFS_DEFAULT);
try { const raw = JSON.parse(localStorage.getItem("makerforge.prefs") || "null");
  if (raw && typeof raw === "object"){
    prefs.ui = [1, 1.15, 1.3, 1.5, 1.75].includes(raw.ui) ? raw.ui : 1;
    prefs.contrast = raw.contrast === "high" ? "high" : "normal";
    prefs.font = raw.font === "clear" ? "clear" : "normal";
    prefs.motion = raw.motion === "reduce" ? "reduce" : "auto";
    prefs.notice = [1, 2, 4].includes(raw.notice) ? raw.notice : 1;
    prefs.speak = raw.speak === true;
    prefs.patterns = raw.patterns === true;
  } } catch(e){}
function savePrefs(){ try { localStorage.setItem("makerforge.prefs", JSON.stringify(prefs)); } catch(e){} }
function applyPrefs(){
  const r = document.documentElement;
  r.style.setProperty("--ui", String(prefs.ui));
  if (prefs.contrast === "high") r.setAttribute("data-contrast", "high"); else r.removeAttribute("data-contrast");
  if (prefs.font === "clear"){
    r.setAttribute("data-font", "clear");           // Atkinson Hyperlegible, built in (see fontFaceCSS)
  } else r.removeAttribute("data-font");
  if (prefs.motion === "reduce") r.setAttribute("data-motion", "reduce"); else r.removeAttribute("data-motion");
  patUniforms.uPat.value = prefs.patterns ? 1 : 0;
  patUniforms.uPatScale.value = 10 * (window.devicePixelRatio || 1) * prefs.ui;
  // big text needs the room: on narrower screens Start from becomes a drawer and the app bar folds up
  if (typeof fitLayout === "function") fitLayout();
}
function speak(text){
  try {
    if (!("speechSynthesis" in window)) { notify("This browser cannot read aloud."); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).replace(/\s+/g, " ").slice(0, 3000)); u.rate = 0.95;

}
// read the open page aloud: its title, the help box, then every label, value and note in order
function speakPage(){
  const sec = [...document.querySelectorAll("#panel > .section")].find(d => !d.hidden); if (!sec) return;
  const bits = [$("#sheetTitle").textContent + "."];
  const help = $("#sechelp"); if (help && !help.hidden) bits.push(help.textContent.replace(/^🔊/, ""));
  sec.querySelectorAll(".field, .hint, .check, .card.empty, .method, .result").forEach(el => {
    if (el.closest(".field") && el !== el.closest(".field")) return;
    if (el.matches(".field")){
      const lab = el.querySelector("label"), num = el.querySelector("input[type=number]"), sel = el.querySelector("select"), txt = el.querySelector("input.txt");
      bits.push((lab ? lab.textContent : "") + ": " + (num ? num.value : sel ? (sel.selectedOptions[0] || {}).textContent || "" : txt ? txt.value : "") + ".");
      const sub = el.querySelector(".sub"); if (sub && sub.textContent) bits.push(sub.textContent);
    } else if (el.matches(".check")) bits.push(el.textContent.trim() + (el.querySelector("input").checked ? ": on." : ": off."));
    else bits.push(el.textContent.trim());
  });
  speak(bits.join(" "));
}

document.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
  const k = e.key.toLowerCase();
  // Delete and the arrow keys act on the artwork only on the Art tab, and only when no button, tab or
  // field has the focus (arrow keys move between tabs and pages, and a control may have used the key)
  const onArt = tab === "art" && !typing && !e.defaultPrevented && !e.ctrlKey && !e.metaKey && !e.altKey &&
    (e.target === document.body || e.target === document.documentElement || !!e.target.closest("#view"));
  if ((e.ctrlKey||e.metaKey) && k === "z"){ if (typing) return; e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if ((e.ctrlKey||e.metaKey) && k === "y"){ if (typing) return; e.preventDefault(); redo(); }
  else if ((e.ctrlKey||e.metaKey) && k === "s"){ e.preventDefault(); saveProjectFile(); }
  else if (onArt && (k === "delete" || k === "backspace")){ if (state.items[state.active]){ e.preventDefault(); removeItem(); } }
  else if (onArt && ["arrowleft","arrowright","arrowup","arrowdown"].includes(k)){
    const d = state.items[state.active]; if (!d) return;
    e.preventDefault();
    const step = e.shiftKey ? 2 : 0.5;
    if (k === "arrowleft") d.offU -= step; else if (k === "arrowright") d.offU += step;
    else if (k === "arrowup") d.offV += step; else d.offV -= step;
    d.solids = null; schedule(); pushHistory();
    if (tab === "art") renderTab();
  }
});

  get overlay(){ return overlay.children.length; },
  rebuild: rebuildAll,
  get camera(){ return camera; }, get controls(){ return controls; }, shareLink: makeShareLink, projectPayload,
  get draws(){ return drawCount; }, requestRender,
  helper: { get ready(){ return !!helper.w; }, get failed(){ return helper.failed; }, get done(){ return helper.done; }, run: onHelper, stop: helperStop },
  bvhFor: geomBVH, get scene(){ return scene; }, printParts: printedParts,
  get measure(){ return measurePts.map(q => q.toArray().map(v => +v.toFixed(3))); },
  get defaults(){ return DEFAULTS().base; },
  render: renderTab,
  notify,
  core: C
};

(async function init(){
  applyTheme(); renderTab(); renderStarts(); makeBed();
  logLine(`Maker Forge ${APP_VERSION} ready`);
  let restored = false;
  try {
    const raw = localStorage.getItem("makerforge.project");
    if (raw) restored = await loadProject(JSON.parse(raw));
  } catch(e){}
  if (!restored){ applyPrinterPref(state); makeBed(); await rebuildAll(true); }
  history.past.push(serialize()); updateHistoryButtons();
  // a share link opens on top of what was there, which Undo brings back
  const shared = await readShareLink();
  if (shared && await loadProject(shared)){
    history.past.push(serialize()); updateHistoryButtons(); saveLocal();
    try { window.history.replaceState(null, "", location.pathname + location.search); } catch(e){}
    notify("Opened a shared project. Undo takes you back to what you had before.");
  }
})();
})();
</script>
</body>
</html>
