  if (viewOpts.explode) return [0, i*viewOpts.explode*0.35, 0];
  return [0,0,0];
}
function refreshScene(){
  while (modelGroup.children.length) modelGroup.children.pop();
  const box = new THREE.Box3();
  modelParts.forEach((p,i)=>{
    const mesh = new THREE.Mesh(p.geom, p.paint ? paintMat() : slotMat(p.slot));
    mesh.userData.part = i;
    const off = partOffset(p,i);
    mesh.position.set(off[0],off[1],off[2]);
    p.geom.computeBoundingBox();
    box.union(p.geom.boundingBox.clone().translate(new THREE.Vector3(off[0],off[1],off[2])));
    modelGroup.add(mesh);
  });
  const sc = (state.model.scale||100)/100;
  modelGroup.scale.set(state.model.mirror ? -sc : sc, sc, sc);
  // turned for printing: rotate, then set back down on the bed where it stood
  const R = state.model.orient, t = printShift();
  if (R) modelGroup.quaternion.setFromRotationMatrix(new THREE.Matrix4().set(R[0],R[1],R[2],0, R[3],R[4],R[5],0, R[6],R[7],R[8],0, 0,0,0,1));
  else modelGroup.quaternion.identity();
  modelGroup.position.set(t[0], t[1], t[2]);
  modelGroup.updateMatrixWorld(true);
  if (baseMesh) baseMesh.matrixWorld.copy(modelGroup.matrixWorld);   // clicks land where the model is drawn
  refreshOverlay();
  updateCrumb();
  const pb = R ? printBounds() : null;
  const empty = box.isEmpty();
  const size = empty ? new THREE.Vector3(10,1,10) : pb ? new THREE.Vector3(pb.size[0], pb.size[1], pb.size[2]) : box.getSize(new THREE.Vector3()).multiplyScalar(sc);
  lastSize = size;
  $("#stSize").textContent = empty ? "–" : `${mm(size.x)} × ${mm(size.z)} × ${mm(size.y)}`;
  if (measurePts.length) clearMeasure();
  if (viewOpts.section) updateSection();
  if (!userMoved) frameCamera(size,"angle");
  makeBed();
}

/* ---------- 7. checks ---------- */
let lastChecks = { list:[], rows:[], totals:{}, swaps:[] };
/* The print frame: the model scaled, mirrored and (after Optimize) turned, standing on the bed.
   Without a turn this is exactly the old export: scale, then mirror, nothing else moves. */
function modelMatrix(){
  const sc = (state.model.scale||100)/100, S = [state.model.mirror ? -sc : sc,0,0, 0,sc,0, 0,0,sc];
  return state.model.orient ? C.mat3Mul(state.model.orient, S) : S;
}
const cacheOf = { shift:{ key:"" }, printed:{ key:"" }, brim:{ key:"" } };
const frameKey = () => partsVer + "|" + JSON.stringify(state.model);
function printShift(){
  if (!state.model.orient || !modelParts.length) return [0,0,0];
  const c = cacheOf.shift, key = frameKey();
  if (c.key === key) return c.t;
  const M = modelMatrix(), S = [state.model.mirror ? -1 : 1, 1, 1].map(v => v*(state.model.scale||100)/100);
  const mn = [Infinity,Infinity,Infinity], mx = [-Infinity,-Infinity,-Infinity], mn0 = [Infinity,Infinity,Infinity], mx0 = [-Infinity,-Infinity,-Infinity];
  modelParts.forEach(p => {
    const P = p.solid.pos, off = p.layout || [0,0,0];
    for (let i=0;i<P.length;i+=3){
      const x = P[i]+off[0], y = P[i+1]+off[1], z = P[i+2]+off[2];
      const q = [M[0]*x+M[1]*y+M[2]*z, M[3]*x+M[4]*y+M[5]*z, M[6]*x+M[7]*y+M[8]*z], q0 = [S[0]*x, S[1]*y, S[2]*z];
      for (let k=0;k<3;k++){ if (q[k]<mn[k]) mn[k]=q[k]; if (q[k]>mx[k]) mx[k]=q[k]; if (q0[k]<mn0[k]) mn0[k]=q0[k]; if (q0[k]>mx0[k]) mx0[k]=q0[k]; }
    }
  });
  c.key = key; c.t = [(mn0[0]+mx0[0])/2 - (mn[0]+mx[0])/2, -mn[1], (mn0[2]+mx0[2])/2 - (mn[2]+mx[2])/2];
  return c.t;
}
// every part in the print frame, one solid each (colours not merged yet)
function printedParts(){
  const c = cacheOf.printed, key = frameKey();
  if (c.key === key) return c.list;
  const sc = (state.model.scale||100)/100, R = state.model.orient, M = modelMatrix(), t = printShift();
  c.list = modelParts.map(p => {
    const off = p.layout || [0,0,0];
    let s;
    if (!R){ s = C.transformSolid(p.solid, sc, off[0]*sc, off[1]*sc, off[2]*sc); if (state.model.mirror) s = C.mirrorSolid(s); }
    else s = C.affineSolid(p.solid, M, [M[0]*off[0]+M[1]*off[1]+M[2]*off[2]+t[0], M[3]*off[0]+M[4]*off[1]+M[5]*off[2]+t[1], M[6]*off[0]+M[7]*off[1]+M[8]*off[2]+t[2]]);
    return { name:p.name, slot:p.slot, pos:s.pos, idx:s.idx, paint:p.paint || null };
  });
  c.key = key;
  return c.list;
}
function printBounds(){
  const list = printedParts(); if (!list.length) return null;
  const mn = [Infinity,Infinity,Infinity], mx = [-Infinity,-Infinity,-Infinity];
  list.forEach(p => { const b = C.solidBounds(p); for (let k=0;k<3;k++){ mn[k] = Math.min(mn[k], b.mn[k]); mx[k] = Math.max(mx[k], b.mx[k]); } });
  return { mn, mx, size:[mx[0]-mn[0], mx[1]-mn[1], mx[2]-mn[2]] };
}
// the brim: one first-layer ring in the colour that has the most plastic on the bed
function brimPart(){
  const w = state.model.brim || 0;
  if (!w || !modelParts.length) return null;
  const c = cacheOf.brim, key = frameKey() + "|" + state.printer.layer;
  if (c.key === key) return c.part;
  const list = printedParts(), contact = new Map();
  list.forEach(p => contact.set(p.slot, (contact.get(p.slot)||0) + C.bedContact(p, 0.05)));
  let slot = list[0].slot, best = -1;
  contact.forEach((a, k) => { if (a > best){ best = a; slot = k; } });
  const thick = Math.max(0.2, state.printer.layer||0.2);
  const solid = C.brimSolid(list, list.map(p => p.slot === slot), w, thick, Math.min(0.1, thick/2));
  c.key = key; c.part = solid ? { name:"Brim", slot, solid } : null;
  return c.part;
}
function exportParts(){
  const bySlot = new Map();
  printedParts().forEach(p => {
    if (!bySlot.has(p.slot)) bySlot.set(p.slot, []);
    bySlot.get(p.slot).push(p);
  });
  const brim = brimPart();
  if (brim){ if (!bySlot.has(brim.slot)) bySlot.set(brim.slot, []); bySlot.get(brim.slot).push(brim.solid); }
  return [...bySlot.entries()].sort((a,b)=>a[0]-b[0]).map(([slot,list])=>{
    const m = C.mergeSolids(list);
    return { name:state.slots[slot].name, slot, pos:m.pos, idx:m.idx, paint:m.paint || null };
  });
}

/* ---- printability: overhangs, bridges, thin walls and bed contact, worked out in the background
   after each build so dragging a slider never waits for it ---- */
let printInfo = null, printTimer = 0, printJob = 0, optimizeUndo = null;
const WARPS = new Set(["ABS","ASA"]);
function printKey(){
  const P = state.printer, mats = [...new Set(modelParts.map(p => (state.slots[p.slot]||{}).mat))].sort().join(",");
  return [frameKey(), P.nozzle, P.layer, P.overhang, P.bridge, mats].join("|");
}
const printFresh = () => printInfo && printInfo.key === printKey();
function schedulePrintability(){ clearTimeout(printTimer); printTimer = setTimeout(runPrintability, 450); }
async function runPrintability(){
  if (busy || queued){ schedulePrintability(); return; }
  const key = printKey(), job = ++printJob, P = state.printer;
  const parts = printedParts();
  const tris = parts.reduce((a,p)=>a+p.idx.length/3, 0);
  if (!parts.length || tris > 800000){ printInfo = { key, skipped:parts.length ? tris : 0 }; runChecks(); return; }
  const it = C.analyzePrintSteps(parts, { nozzle:P.nozzle||0.4, layer:P.layer||0.2, angle:P.overhang||45, bridge:P.bridge ?? 10,
    warpProne: parts.some(p => WARPS.has((state.slots[p.slot]||{}).mat)) });
  let r, t0 = performance.now();
  try {
    for (;;){
      r = it.next(); if (r.done) break;
      if (performance.now() - t0 > 25){
        await new Promise(res => setTimeout(res, 0)); t0 = performance.now();
        if (job !== printJob || busy || printKey() !== key) return;     // a newer build or setting took over
      }
    }
  } catch (err){ console.error(err); printInfo = { key, failed:err.message }; runChecks(); return; }
  printInfo = Object.assign(r.value, { key, slots:parts.map(p=>p.slot) });
  runChecks(); refreshOverlay();

const mm1 = v => v < 10 ? v.toFixed(1) : v.toFixed(0);
function printChecks(info){
  const out = [], P = state.printer;
  if (info.skipped) return [{ k:"ok", t:"Printability not checked", s:`${info.skipped.toLocaleString()} triangles is more than the in-browser check handles. Your slicer's preview will show overhangs.` }];
  if (info.failed || info.empty) return out;
  if (info.floating > 0.01) out.push({ k:"bad", t:`Floats ${info.floating.toFixed(2)} mm above the bed`, s:"Nothing touches the bed, so the first layer has nothing to stick to." });
  const oh = info.overhang, bridges = info.flats.filter(f=>f.kind==="bridge"), longest = bridges.reduce((a,f)=>Math.max(a,f.span||0),0);
  const bridgeNote = bridges.length ? `${bridges.length} bridge${bridges.length===1?"":"s"}, the longest ${mm1(longest)} mm, print without support.` : "";
  if (oh.area >= 3){
    const worst = oh.perPart.map((a,i)=>[a,i]).sort((a,b)=>b[0]-a[0])[0];
    const where = info.parts.length > 1 && worst[0] > 0 ? ` Most of it is under “${info.parts[worst[1]]}”.` : "";
    const long = info.flats.filter(f=>f.kind==="support" && f.span > (P.bridge??10) && f.span != null);
    out.push({ k:"warn", t:`Needs support under about ${mm1(oh.area)} mm²`,
      s:`Overhangs steeper than ${oh.angle}° from upright${oh.lowest!=null?`, the lowest at ${oh.lowest.toFixed(1)} mm`:""}.${where}` +
        (long.length ? ` A ${mm1(long[0].span)} mm gap is too long to bridge.` : "") +
        ` Turn on supports in your slicer, or try Optimize under Export → Printability.` });
  } else out.push({ k:"ok", t:"No overhangs need support", s: bridgeNote || `Nothing is steeper than ${oh.angle}° from upright.` });
  if (info.thin.length){
    const t = info.thin[0], n = info.thin.length;
    out.push({ k:"warn", t:`${n} wall${n===1?" is":"s are"} thinner than the nozzle`,
      s:`The thinnest is about ${t.width.toFixed(2)} mm, in “${t.name}” at ${t.y.toFixed(1)} mm height. Slicers may leave out walls under ${P.nozzle} mm: make them thicker or use a finer nozzle.` });
  } else out.push({ k:"ok", t:"No walls thinner than the nozzle", s:`Checked in slices at ${info.thinCell.toFixed(2)} mm detail.` });
  const ct = info.contact, brim = state.model.brim;
  if (ct.area < 1) out.push({ k:"bad", t:"Barely touches the bed", s:"Less than 1 mm² of the first layer is on the bed. Turn it with Optimize, or add a flat base." });
  else if (ct.brimWhy && !brim){
    const why = { tall:[`Tall for its footprint`, `${info.height.toFixed(0)} mm tall on ${mm1(ct.area)} mm² of bed.`],
      small:[`Small contact with the bed`, `Only ${mm1(ct.area)} mm² of the first layer touches the bed.`],
      warp:[`Large print in a material that warps`, `ABS and ASA lift at the corners on long parts.`] }[ct.brimWhy];
    out.push({ k:"warn", t:why[0], s:why[1] + " A brim helps it stay down: set one under Export → Printability." });
  } else out.push({ k:"ok", t:"Sits well on the bed", s:`${mm1(ct.area)} mm² on the bed${brim ? `, plus a ${brim} mm brim` : ""}.` });
  return out;
}
// red: needs support, blue: bridges and small ledges that print without it, orange: thin walls
const overlay = new THREE.Group();
let overlayMats = null;
function refreshOverlay(){
  if (!overlay.parent) scene.add(overlay);
  overlay.children.forEach(m => { if (m.geometry) m.geometry.dispose(); });
  overlay.clear();
  if (!overlayMats){
    const mk = hex => new THREE.MeshBasicMaterial({ color:hex, transparent:true, opacity:0.85, depthWrite:false,
      polygonOffset:true, polygonOffsetFactor:-2, polygonOffsetUnits:-4, side:THREE.DoubleSide });
    overlayMats = { support:mk(0xe5484d), fine:mk(0x3e9bff), thin:new THREE.MeshBasicMaterial({ color:0xff8a00 }) };
  }
  const shifted = viewOpts.explode || (viewOpts.layout && modelParts.some(p=>p.layout));   // the view no longer matches the print frame
  const brim = brimPart();
  if (brim && !shifted) overlay.add(new THREE.Mesh(solidToGeometry(brim.solid), slotMat(brim.slot)));
  if (!viewOpts.showPrint || !printFresh() || shifted || !printInfo.marks) return;
  for (const k of ["support","fine"]){
    const a = printInfo.marks[k]; if (!a.length) continue;
    const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(a, 3));
    overlay.add(new THREE.Mesh(g, overlayMats[k]));
  }
  const r = Math.max(0.8, (lastSize ? Math.max(lastSize.x, lastSize.z) : 60) / 80);
  printInfo.thin.forEach(t => { const m = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 8), overlayMats.thin); m.position.set(t.x, t.y, t.z); overlay.add(m); });
}
// Optimize: lie the model on whichever side needs the least support, then add a brim if it still stands poorly
let optimizing = false;
async function optimizePrint(){
  if (!modelParts.length || optimizing || busy) return;
  const P = state.printer, before = { orient:state.model.orient, brim:state.model.brim }, ver0 = partsVer;
  const sc = (state.model.scale||100)/100, S = [state.model.mirror ? -sc : sc,0,0, 0,sc,0, 0,0,sc];
  const flat = modelParts.map(p => { const off = p.layout || [0,0,0]; return Object.assign(C.affineSolid(p.solid, S, [S[0]*off[0], S[4]*off[1], S[8]*off[2]]), { name:p.name }); });
  const cur = state.model.orient;               // the current "down", in the unturned frame
  const prefer = cur ? [-cur[3], -cur[4], -cur[5]] : [0,-1,0];
  optimizing = true; setBusy(true, "Finding the best way up…");
  let r;
  try {
    const it = C.bestOrientationSteps(flat, { angle:P.overhang||45, layer:P.layer||0.2, bed:P.bed, prefer });
    for (;;){ const s2 = it.next(); if (s2.done){ r = s2.value; break; } await new Promise(res => setTimeout(res, 0)); }
  } catch (err){ console.error(err); notify("Could not work out an orientation: "+err.message); }
  optimizing = false; setBusy(false);
  if (!r) return;
  if (partsVer !== ver0){ notify("The model changed while turning it. Press Optimize again."); return; }
  const same = r.dir[0]*prefer[0] + r.dir[1]*prefer[1] + r.dir[2]*prefer[2] > 0.999;
  const R = r.R, identity = Math.abs(R[0]-1) + Math.abs(R[4]-1) + Math.abs(R[8]-1) < 1e-9;
  if (!same) state.model.orient = identity ? null : R.map(v => Math.abs(v) < 1e-12 ? 0 : v);
  // judge the footing in the new orientation straight away
  const parts = printedParts();
  const a = C.analyzePrint(parts, { nozzle:P.nozzle||0.4, layer:P.layer||0.2, angle:P.overhang||45, bridge:P.bridge ?? 10, maxSlices:1,
    warpProne: parts.some(p => WARPS.has((state.slots[p.slot]||{}).mat)) });
  const addBrim = !state.model.brim && (a.contact.brimWhy || a.contact.area < 1);
  if (addBrim) state.model.brim = 5;
  optimizeUndo = before;
  const turned = same ? "The model already lies the best way." :
    `Turned it to need about ${mm1(r.best.support)} mm² of support instead of ${mm1(r.current.support)} mm².`;
  notify(turned + (addBrim ? " Added a 5 mm brim for a better hold." : ""));
  logLine("Optimize: " + turned + (addBrim ? " Brim 5 mm." : ""));
  userMoved = false; refreshScene(); runChecks(); pushHistory(); renderTab();
}
function revertOptimize(){
  if (!optimizeUndo) return;
  Object.assign(state.model, optimizeUndo); optimizeUndo = null;
  userMoved = false; refreshScene(); runChecks(); pushHistory(); renderTab();
  notify("Back to how it was before Optimize.");
}
function runChecks(){
  state.slots.forEach(s => { if (!s.mat || !MATERIALS[s.mat]) s.mat = "PLA"; if (s.price == null) s.price = MATERIALS[s.mat].p; });
  const list = [], P = state.printer, bed = P.bed || [256,256,256], sc = (state.model.scale||100)/100;
  const box = new THREE.Box3();
  modelParts.forEach((p,i)=>{
    p.geom.computeBoundingBox();
    const off = partOffset(p,i);
    box.union(p.geom.boundingBox.clone().translate(new THREE.Vector3(off[0],off[1],off[2])));
  });
  const pb = state.model.orient ? printBounds() : null;
  const size = box.isEmpty() ? new THREE.Vector3() : pb ? new THREE.Vector3(pb.size[0], pb.size[1], pb.size[2]) : box.getSize(new THREE.Vector3()).multiplyScalar(sc);
  const vols = state.slots.map(()=>0);
  let open = 0, tris = 0;
  for (const p of modelParts){
    const r = C.checkMesh(p.solid);

  }
  const brim = brimPart();
  if (brim && vols[brim.slot] != null) vols[brim.slot] += C.checkMesh(brim.solid).volume;

    ? { k:"ok", t:"Every part is a closed mesh", s:`${tris.toLocaleString()} triangles in ${modelParts.length} part${modelParts.length===1?"":"s"}` }
    : { k:"warn", t:"Some parts have open edges", s:`${open} unpaired edges. Slicers usually repair this, but check the preview.` });
  if (size.x > bed[0] || size.z > bed[1] || size.y > bed[2])
    list.push({ k:"bad", t:"Bigger than the print bed", s:`${size.x.toFixed(0)} × ${size.z.toFixed(0)} × ${size.y.toFixed(0)} mm does not fit ${bed.join(" × ")} mm on the ${P.model}.` +
      (state.base.type === "jigsaw" && state.base.jigsaw.holder === "tray" ? " The tray prints beside the puzzle: make the puzzle smaller, or switch the tray off and export it separately." : "") });
  else list.push({ k:"ok", t:"Fits the bed", s:`${P.model}, ${bed[0]} × ${bed[1]} mm` });

  const usedSlots = new Set(modelParts.map(p=>p.slot));
  modelParts.forEach(p => { if (p.paint) for (const s of new Set(p.paint)) if (s !== PAINT_LEAVE && s < state.slots.length) usedSlots.add(s); });
  if (usedSlots.size > (P.colors||1))
    list.push({ k:"bad", t:`Uses ${usedSlots.size} colours, the ${P.model} handles ${P.colors}`,
      s: P.colors === 1 ? "Print the parts separately, or use the colour swap list below." : "Reduce the number of filaments or split the print." });

  if (state.base.type === "jigsaw" && jigsawInfo){
    const J = jigsawInfo, neck = (J.neck - J.gap)*sc;

    if (J.neck && neck < 1.5) list.push({ k: neck < 1 ? "bad" : "warn", t:"Knob necks are fragile",
      s:`The narrowest neck prints ${neck.toFixed(1)} mm wide. Use fewer pieces, a bigger puzzle or bigger knobs: 2 mm or more survives play.` });
    if (J.gap*sc < 0.15) list.push({ k:"warn", t:"Pieces may fuse together", s:`A ${(J.gap*sc).toFixed(2)} mm gap usually closes up when printed. 0.2 to 0.3 mm is safer.` });
    else if (J.gap*sc > 0.45) list.push({ k:"warn", t:"Loose fit", s:`With a ${(J.gap*sc).toFixed(2)} mm gap the puzzle falls apart when lifted.` });
    if (J.T*sc < 2) list.push({ k:"warn", t:"Thin pieces", s:`${(J.T*sc).toFixed(1)} mm pieces bend and snap easily. 3 mm feels like a real puzzle.` });
    if (J.labelsWanted && !J.labels) list.push({ k:"warn", t:"Pieces too small for labels", s:"Labels need pieces of about 11 mm or more." });
    else if (J.labels && J.unlabelled) list.push({ k:"warn", t:`${J.unlabelled} piece${J.unlabelled===1?"":"s"} without a label`,

      s:`${(I.total*sc).toFixed(1)} mm tall with the lid on. ${I.count} opening${I.count === 1 ? "" : "s"}. ${I.fastenText}` });
    I.warn.forEach(w => list.push({ k:"warn", t:w.t, s:w.s }));

  else if (state.base.type === "lithophane" && lithoInfo){

    if (L.minT*sc < Math.max(0.5, 3*lay)) list.push({ k:"warn", t:"Light areas are very thin",
      s:`${(L.minT*sc).toFixed(2)} mm is ${Math.max(1, Math.round(L.minT*sc/lay))} layer${L.minT*sc/lay < 1.5 ? "" : "s"} or ${(L.minT*sc/nz).toFixed(1)} nozzle widths: expect pinholes. 0.6 to 0.8 mm is safer.` });
    if ((L.maxT - L.minT)*sc < 1.2) list.push({ k:"warn", t:"A faint picture", s:`Only ${((L.maxT-L.minT)*sc).toFixed(1)} mm between the lightest and darkest parts. About 2 mm gives real shadows.` });
    list.push({ k:"ok", t:"Print it at 100% infill", s:"Infill patterns show through a lithophane. White or natural PLA gives the most even glow." });

      : { k:"ok", t:plateInfo.count ? `${plateInfo.count} name plates, each one solid piece` : "Plate is one solid piece", s:"The letters and the plate print as a single object." });

    const after = C.labelMask(C.erodeMask(all, d._cm.gx, d._cm.gy, (P.nozzle/2)/cell), d._cm.gx, d._cm.gy).comps.length;
    if (after < before) list.push({ k:"warn", t:`Fine detail in “${d.name}” is thinner than the nozzle`,
      s:`${before-after} area${before-after===1?"":"s"} narrower than ${P.nozzle} mm. Make it bigger or raise “clean up specks”.` });
  }
  const thin = [];
  state.items.forEach(d => { if (d.mode !== "relief") thin.push(d.height); });
  if (state.base.type === "nameplate"){ const np = state.base.nameplate; thin.push(np.nameH); if (np.accent && !np.engrave) thin.push(np.accentH); }
  if (state.base.type === "jigsaw" && jigsawInfo && jigsawInfo.P) thin.push(jigsawInfo.P);
  if (thin.some(h=>h < P.layer*2))
    list.push({ k:"warn", t:"A colour layer is under two layers thick", s:`At ${P.layer} mm layers, colours thinner than ${(P.layer*2).toFixed(2)} mm look patchy.` });
  if (modelParts.length){ if (printFresh()) list.push(...printChecks(printInfo)); else schedulePrintability(); }
  const unused = state.slots.map((s,i)=>i).filter(i=>!usedSlots.has(i));
  if (unused.length) list.push({ k:"warn", t:"Unused filaments", s:`Slot${unused.length>1?"s":""} ${unused.map(i=>i+1).join(", ")} are not used. Remove them to avoid pointless filament changes.` });

  const rows = state.slots.map((s,i)=>{
    const matd = (MATERIALS[s.mat]||MATERIALS.PLA).d, cm3 = vols[i]/1000, grams = cm3*matd;
    return { i, name:s.name, hex:s.hex, cm3, grams, metres: vols[i]/(Math.PI*Math.pow(1.75/2,2))/1000, cost: grams/1000*(s.price||22) };
  }).filter(r=>r.cm3 > 0.0001);
  const totals = rows.reduce((a,r)=>({ cm3:a.cm3+r.cm3, grams:a.grams+r.grams, metres:a.metres+r.metres, cost:a.cost+r.cost }), {cm3:0,grams:0,metres:0,cost:0});
  const layers = Math.max(1, Math.round(size.y/(P.layer||0.12)));
  const swapsCount = Math.max(0, usedSlots.size-1);
  const seconds = totals.cm3*1000/(P.flow||12) + layers*2.5 + (P.colors>1 ? layers*swapsCount*1.2 : swapsCount*30);
  totals.minutes = seconds/60;

  // colour swap list, useful on a single-colour printer
  const swaps = [];
  if (P.colors === 1){
    const zs = new Map();
    const printed = state.model.orient ? printedParts() : null;
    modelParts.forEach((p,i)=>{
      const b = C.solidBounds(printed ? printed[i] : p.solid), off = printed ? [0,0,0] : partOffset(p,i);
      const z = printed ? b.mn[1] : (b.mn[1]+off[1])*sc;
      if (!zs.has(p.slot) || z < zs.get(p.slot)) zs.set(p.slot, z);
    });
    [...zs.entries()].sort((a,b)=>a[1]-b[1]).forEach(([slot,z])=>swaps.push({ slot, z:Math.max(0,z) }));
  }
  lastChecks = { list, rows, totals, swaps };
  const worst = list.some(l=>l.k==="bad") ? "bad" : list.some(l=>l.k==="warn") ? "warn" : "ok";
  const pill = $("#checkPill");
  pill.className = "pill" + (worst === "ok" ? "" : " "+worst);
  const issues = list.filter(l=>l.k!=="ok").length;
  pill.textContent = (worst === "ok" ? "Ready to print" : `${issues} to check`) +
    ` · ${totals.grams.toFixed(1)} g · ~${totals.minutes<60 ? totals.minutes.toFixed(0)+" min" : (totals.minutes/60).toFixed(1)+" h"}`;
  fitHud();
  updateDock();
  if (tab === "export") renderTab();
}

/* The default of a setting, found without being told: each number in the likely places (this
   object's settings, the model, the printer, the selected artwork, box openings) is swapped for a
   marker for a moment; the one that makes the field's getter return the marker is the field's own.
   Its default is the same place in a fresh project. Getters that compute (a sum, a rounding) are
   not found, and those fields simply get no reset button. */
function defaultRoots(){
  const d = DEFAULTS(), b = state.base, t = b.type, roots = [];
  if (b[t] && typeof b[t] === "object") roots.push([b[t], d.base[t]]);
  roots.push([b, d.base], [state.model, d.model], [state.view, d.view]);
  const pr = encHas(PRINTERS, state.printer.model) ? PRINTERS[state.printer.model] : null;
  if (pr) roots.push([state.printer, { bed:pr.bed, nozzle:pr.nozzle, colors:pr.colors, flow:pr.flow, layer:d.printer.layer, overhang:d.printer.overhang, bridge:d.printer.bridge }]);
  const it = state.items[state.active];
  if (it && typeof newItem === "function"){ try { const c = document.createElement("canvas"); c.width = Math.round(100*(it.aspect||1)); c.height = 100; roots.push([it, newItem(it.name, c)]); } catch(e){} }
  if (t === "enclosure" && b.enclosure && Array.isArray(b.enclosure.cut)) b.enclosure.cut.forEach(c => { try { roots.push([c, newOpening(c.kind, c.face)]); } catch(e){} });
  return roots;
}
function findDefault(get){
  const MARK = 987654.321;
  let found;
  const probe = (live, def, depth) => {
    if (!live || typeof live !== "object" || depth > 3) return false;
    for (const k of Object.keys(live)){
      const v = live[k];
      if (typeof v === "number"){
        live[k] = MARK; let got; try { got = get(); } catch(e){} live[k] = v;
        if (got === MARK){ found = def && typeof def[k] === "number" ? { v:def[k] } : { v:undefined }; return true; }
      } else if (v && typeof v === "object" && !(v instanceof HTMLElement) && !ArrayBuffer.isView(v) && k !== "solids" && k !== "src" && k !== "strokes" && k !== "ops" && k !== "cut" && k !== "btn"){
        if (probe(v, def && typeof def === "object" ? def[k] : undefined, depth + 1)) return true;
      }
    }
    return false;
  };
  for (const [live, def] of defaultRoots()) if (probe(live, def, 0)) break;
  return found && typeof found.v === "number" && isFinite(found.v) ? found.v : undefined;
}
function numField(parent,o){
  const id = "f"+Math.random().toString(36).slice(2,8);
  const w = document.createElement("div"); w.className = "field";
  w.innerHTML = `<label for="${id}">${o.label}</label><input type="number" id="${id}" min="${o.min}" max="${o.max}" step="${o.step}"><input type="range" aria-label="${o.label}" min="${o.min}" max="${o.max}" step="${o.step}">${o.sub?'<div class="sub"></div>':''}`;
  const num = w.querySelector("input[type=number]"), rng = w.querySelector("input[type=range]"), sub = w.querySelector(".sub");
  const def = o.def !== undefined ? o.def : (o.noReset ? undefined : findDefault(o.get));
  let rst = null;
  if (def !== undefined && def >= o.min && def <= o.max){
    rst = document.createElement("button"); rst.type = "button"; rst.className = "reset"; rst.textContent = "↺ default";
    rst.title = `Back to the default: ${+(+def).toFixed(2)}`; rst.setAttribute("aria-label", `Set ${o.label.replace(/<[^>]*>/g,"")} back to its default, ${+(+def).toFixed(2)}`);
    rst.onclick = () => apply(def);
    w.insertBefore(rst, num);
    w._reset = () => { if (Math.abs(o.get() - def) > 1e-9){ o.set(def); sync(); return true; } return false; };
    w._resetChange = () => (o.onChange||dirty)();
  }
  const sync = ()=>{ const v = o.get(); num.value = +(+v).toFixed(2); rng.value = v; if (sub) sub.textContent = o.sub();
    if (rst) rst.hidden = Math.abs(v - def) < 1e-9; };
  w._refreshSub = ()=>{ if (sub) sub.textContent = o.sub(); };
  const apply = v => { if (isNaN(v)) return; o.set(clamp(v,o.min,o.max)); sync(); (o.onChange||dirty)(); pushHistory(); };
  rng.addEventListener("input", ()=>apply(parseFloat(rng.value)));
  num.addEventListener("change", ()=>apply(parseFloat(num.value)));
  sync(); parent.appendChild(w); return w;
}

/* Rulers along the bed's three axes in millimetres, 0 at the front-left corner like the printer's own
   coordinates, and the model's width, depth and height drawn along its edges. */
function rulerLabel(text, h, color){
  const fs = 44, pad = 8, font = `700 ${fs}px Manrope, system-ui, sans-serif`, cv = document.createElement("canvas");
  const m = cv.getContext("2d"); m.font = font;
  const tw = Math.ceil(m.measureText(text).width) + pad*2;
  cv.width = tw; cv.height = fs + pad*2;
  const x = cv.getContext("2d"); x.font = font; x.fillStyle = color; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(text, tw/2, cv.height/2);
  const tex = new THREE.CanvasTexture(cv); tex.minFilter = THREE.LinearFilter;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true, depthTest:false }));
  sp.scale.set(h*tw/cv.height, h, 1); sp.renderOrder = 5;
  return sp;
}
function makeRulers(bed, dark){
  const g = new THREE.Group(), txt = dark ? "#9fb0bf" : "#44515c", acc = dark ? "#ffb454" : "#b85600", seg = [], dimSeg = [];
  const add = (list, a, b) => list.push(a[0], a[1], a[2], b[0], b[1], b[2]);
  const X = bed[0], Y = bed[1], big = Math.max(X, Y), off = Math.max(3, big*0.014), lab = Math.max(3.4, big*0.021);
  // millimetres: a tick every 5, labels every 10/20/50; inches: a tick every quarter, labels every inch (2 on big beds)
  const inch = state.view.units === "in", minor = inch ? 25.4/4 : 5;
  const every = inch ? (big > 300 ? 8 : 4) : (big > 300 ? 50 : big > 120 ? 20 : 10)/5;          // in minor steps
  const everyZ = inch ? 4 : (every > 2 ? 4 : 2);
  const tick = n => inch ? (n % 4 === 0 ? off*1.7 : n % 2 === 0 ? off : off*0.5) : (n % 10 === 0 ? off*1.7 : n % 2 === 0 ? off : off*0.5);
  const text = n => String(inch ? n/4 : n*5);
  for (let n=0;n*minor<=X+1e-6;n++){
    const x = -X/2 + n*minor; add(seg, [x, 0, Y/2 + off*0.4], [x, 0, Y/2 + off*0.4 + tick(n)]);
    if (n % every === 0){ const s = rulerLabel(text(n), lab, txt); s.position.set(x, 0, Y/2 + off*2.4 + lab*0.6); g.add(s); }
  }
  add(seg, [-X/2, 0, Y/2 + off*0.4], [X/2, 0, Y/2 + off*0.4]);
  for (let n=0;n*minor<=Y+1e-6;n++){
    const z = Y/2 - n*minor; add(seg, [-X/2 - off*0.4, 0, z], [-X/2 - off*0.4 - tick(n), 0, z]);
    if (n % every === 0 && n > 0){ const s = rulerLabel(text(n), lab, txt); s.position.set(-X/2 - off*2.4 - lab*0.9, 0, z); g.add(s); }
  }
  add(seg, [-X/2 - off*0.4, 0, Y/2], [-X/2 - off*0.4, 0, -Y/2]);
  const top = Math.min(bed[2] || 256, Math.max(20, Math.ceil(((lastSize && lastSize.y) || 10)*1.15/10)*10));
  for (let n=0;n*minor<=top+1e-6;n++){
    const y = n*minor, t = tick(n)*0.7; add(seg, [-X/2, y, -Y/2], [-X/2 - t, y, -Y/2 - t]);
    if (n % everyZ === 0 && n > 0){ const s = rulerLabel(text(n), lab*0.9, txt); s.position.set(-X/2 - off*2.2 - lab, y, -Y/2 - off*2.2); g.add(s); }
  }
  add(seg, [-X/2, 0, -Y/2], [-X/2, top, -Y/2]);
  const unit = rulerLabel(inch ? "in" : "mm", lab*0.9, txt); unit.position.set(X/2 + off*2 + lab, 0, Y/2 + off*2.4 + lab*0.6); g.add(unit);
  g.add(new THREE.LineSegments(new THREE.BufferGeometry().setAttribute("position", new THREE.Float32BufferAttribute(seg, 3)),
    new THREE.LineBasicMaterial({ color: dark ? 0x7f8c99 : 0x5b6873 })));
  // the model's own size along its edges
  const box = new THREE.Box3().setFromObject(modelGroup);
  if (!box.isEmpty()){
    const a = box.min, b = box.max, sz = box.getSize(new THREE.Vector3()), big2 = Math.max(sz.x, sz.y, sz.z);
    const d = Math.max(2.5, big2*0.07), lh = Math.min(12, Math.max(2.6, big2*0.055)), y0 = 0.05, e = d*0.35;
    add(dimSeg, [a.x, y0, b.z + d], [b.x, y0, b.z + d]); add(dimSeg, [a.x, y0, b.z + d - e], [a.x, y0, b.z + d + e]); add(dimSeg, [b.x, y0, b.z + d - e], [b.x, y0, b.z + d + e]);
    add(dimSeg, [b.x + d, y0, a.z], [b.x + d, y0, b.z]); add(dimSeg, [b.x + d - e, y0, a.z], [b.x + d + e, y0, a.z]); add(dimSeg, [b.x + d - e, y0, b.z], [b.x + d + e, y0, b.z]);
    add(dimSeg, [b.x + d, 0, b.z + d], [b.x + d, b.y, b.z + d]); add(dimSeg, [b.x + d - e, b.y, b.z + d], [b.x + d + e, b.y, b.z + d]);
    const put = (text, x, y, z) => { const s = rulerLabel(text, lh, acc); s.position.set(x, y, z); g.add(s); };
    put(mm(sz.x), (a.x + b.x)/2, y0, b.z + d + lh*0.9);
    put(mm(sz.z), b.x + d + lh*2.2, y0, (a.z + b.z)/2);
    put(mm(sz.y), b.x + d + lh*2.2, b.y/2, b.z + d);
    g.add(new THREE.LineSegments(new THREE.BufferGeometry().setAttribute("position", new THREE.Float32BufferAttribute(dimSeg, 3)),
      new THREE.LineBasicMaterial({ color: dark ? 0xffb454 : 0xb85600, depthTest:false })));
  }
  return g;
}

  numField(p,{ label:"Height (mm)", min:1,max:250,step:0.5, get:()=>b.h, set:v=>b.h=v, onChange:baseChanged });
}
function sphereFields(p){
  numField(p,{ label:"Diameter (mm)", min:10,max:250,step:1, get:()=>state.base.sphere.dia, set:v=>state.base.sphere.dia=v, onChange:baseChanged });
}
function stlFields(p){
  buttonRow(p, [[stlData?"Open a different model":"Choose a model file", ()=>$("#stlInput").click()]]);
  note(p, stlData ? esc(state.base.stl.name) : "STL, OBJ or 3MF. Any model works, including one made from a photo by an AI service. 3mf files from Bambu Studio or PrusaSlicer keep their painting.");
  if (stlData) note(p, "Colour it on the <b>Paint</b> tab: by height, by face, from a picture, or with a brush.");
  if (stlData) numField(p,{ label:"Scale (%)", min:5,max:400,step:1, get:()=>state.base.stl.scale, set:v=>state.base.stl.scale=v, onChange:baseChanged });
}
function noneFields(p){
  note(p, "Artwork prints on its own as flat pieces. Turn on the outline in the Art tab if the pieces need something to hold them together.");
}
function nameplateFields(p){
  const np = state.base.nameplate;
  segField(p, [["one","One name"],["list","A list of names"]], ()=>np.batch ? "list" : "one", v=>{ np.batch = v === "list"; renderTab(); baseChanged(); }, "two");
  const w = document.createElement("div"); w.className = "field full";
  if (np.batch){
    w.innerHTML = `<label for="npNames">Names, one per line</label><textarea class="ta" id="npNames" rows="6" placeholder="Emma&#10;Noah&#10;Olivia">${esc(np.names || "")}</textarea><div class="sub"></div>`;
    p.appendChild(w);
    const sub = w.querySelector(".sub"), count = () => { const n = batchNames(np.names).length; sub.textContent = `${n} name${n === 1 ? "" : "s"} (up to 60). Each becomes its own plate, laid out on the bed. Pasted spreadsheet rows keep their first column.`; };
    count();
    let t0 = 0;
    w.querySelector("textarea").oninput = e => { np.names = e.target.value.slice(0, 4000); count(); clearTimeout(t0); t0 = setTimeout(()=>{ schedule(); pushHistory(); }, 500); };
  } else {
    w.innerHTML = `<label for="npText">Name</label><textarea class="ta" id="npText" rows="1" placeholder="Emma">${esc(np.text)}</textarea>`;
    p.appendChild(w);
    w.querySelector("textarea").oninput = e => { np.text = e.target.value; schedule(); pushHistory(); };
  }
  fontField(p, ()=>np.font, v=>{ np.font = v; renderTab(); baseChanged(); });
  numField(p,{ label:"Letter height (mm)", min:8,max:60,step:0.5, get:()=>np.letterHeight, set:v=>np.letterHeight=v, onChange:baseChanged });
  numField(p,{ label:"Border around letters (mm)", min:1,max:12,step:0.1, get:()=>np.border, set:v=>np.border=v, onChange:baseChanged,
    sub:()=>np.style==="traced"?"Widen this until the badge says one solid piece.":"" });
  segField(p,[["traced","Follows name"],["rect","Rounded"],["oval","Oval"]],()=>np.style, v=>{ np.style = v; renderTab(); baseChanged(); });
  numField(p,{ label:"Plate thickness (mm)", min:1,max:8,step:0.1, get:()=>np.thick, set:v=>np.thick=v, onChange:baseChanged });

  group(p,"Letters and colours", g2 => {
    segField(g2,[["raised","Raised"],["engraved","Engraved"]],()=>np.engrave?"engraved":"raised",
      v=>{ np.engrave = v==="engraved"; renderTab(); baseChanged(); }, "two");
    numField(g2,{ label: np.engrave?"Engraving depth (mm)":"Letter height above plate (mm)", min:0.3,max:5,step:0.1,
      get:()=>np.nameH, set:v=>np.nameH=v, onChange:baseChanged });
    slotField(g2, "Plate filament", ()=>String(state.base.slot), v=>{ state.base.slot = +v; baseChanged(); });
    if (!np.engrave){
      slotField(g2, "Letter filament", ()=>String(np.nameSlot), v=>{ np.nameSlot = +v; baseChanged(); });
      checkField(g2,"Third colour on top of the letters",()=>np.accent, v=>{ np.accent = v; renderTab(); baseChanged(); });
      if (np.accent){
        numField(g2,{ label:"Border left showing (mm)", min:0.2,max:4,step:0.05, get:()=>np.accentInset, set:v=>np.accentInset=v, onChange:baseChanged });
        numField(g2,{ label:"Top layer height (mm)", min:0.2,max:4,step:0.1, get:()=>np.accentH, set:v=>np.accentH=v, onChange:baseChanged });
        slotField(g2, "Top filament", ()=>String(np.accentSlot), v=>{ np.accentSlot = +v; baseChanged(); });
      }
    }
  }, true);
  group(p,"Keyring hole", g2 => {
    segField(g2,[["left","Left"],["right","Right"],["topleft","Top left"],["topright","Top right"],["none","None"]],
      ()=>np.hole, v=>{ np.hole = v; renderTab(); baseChanged(); }, "two");
    if (np.hole !== "none"){
      numField(g2,{ label:"Hole diameter (mm)", min:2,max:10,step:0.5, get:()=>np.holeDia, set:v=>np.holeDia=v, onChange:baseChanged });
      numField(g2,{ label:"Material around hole (mm)", min:1.2,max:8,step:0.1, get:()=>np.rim, set:v=>np.rim=v, onChange:baseChanged });
    }
  });
  group(p,"Charms and symbols", g2 => {
    segField(g2,[["none","None"],["left","Left"],["right","Right"],["both","Both"],["mix","Mix"]],
      ()=>np.sym.side, v=>{ np.sym.side = v; renderTab(); baseChanged(); }, "four");
    if (np.sym.side !== "none"){
      symbolField(g2, ()=>np.sym.glyph, v=>{ np.sym.glyph = v; baseChanged(); });
      if (np.sym.side === "mix"){
        note(g2, "Mix puts the first charm on the left and this one on the right.");
        symbolField(g2, ()=>np.sym.glyph2, v=>{ np.sym.glyph2 = v; baseChanged(); });
      }
      numField(g2,{ label:"Charm size", min:0.4,max:2.5,step:0.05, get:()=>np.sym.size, set:v=>np.sym.size=v, onChange:baseChanged });
      note(g2, "Emoji print as their outline, so pick bold shapes. Colour comes from the filament, not the emoji.");
    }
    selField(g2,"Dots on i and j",[["none","Leave as they are"],["heart","Heart"],["star","Star"],["flower","Flower"],["round","Round dot"]],
      ()=>np.dot, v=>{ np.dot = v; renderTab(); baseChanged(); });
    if (np.dot !== "none") numField(g2,{ label:"Dot size", min:0.8,max:3,step:0.05, get:()=>np.dotScale, set:v=>np.dotScale=v, onChange:baseChanged });
  }, true);
  group(p,"Picture beside the name", g2 => {
    if (!state.items.length){
      g2.insertAdjacentHTML("beforeend", `<div class="card empty">Add a picture or cartoon on the <b>Art</b> tab and it can sit next to the name.</div>`);
      buttonRow(g2, [["Go to the Art tab", ()=>{ tab = "art"; renderTab(); }]]);
      return;
    }
    checkField(g2,"Put a picture on the keychain",()=>np.pic.on, v=>{ np.pic.on = v; renderTab(); baseChanged(); });
    if (np.pic.on){
      selField(g2,"Which picture", state.items.map((it,i)=>[String(i), it.name]), ()=>String(clamp(np.pic.item,0,state.items.length-1)),
        v=>{ np.pic.item = +v; baseChanged(); });
      segField(g2,[["left","Left of the name"],["right","Right of the name"]],()=>np.pic.side, v=>{ np.pic.side = v; baseChanged(); }, "two");
      numField(g2,{ label:"Picture size", min:0.4,max:3,step:0.05, get:()=>np.pic.size, set:v=>np.pic.size=v, onChange:baseChanged });
      numField(g2,{ label:"Gap from the name (mm)", min:0,max:15,step:0.5, get:()=>np.pic.gap, set:v=>np.pic.gap=v, onChange:baseChanged });
      checkField(g2,"Print it in its own colours",()=>np.pic.colour, v=>{ np.pic.colour = v; baseChanged(); });
      checkField(g2,"Remove the photo's background",()=>np.pic.cutout !== false, v=>{ np.pic.cutout = v; renderTab(); baseChanged(); });
      if (np.pic.cutout !== false) numField(g2,{ label:"Background tolerance", min:4,max:90,step:1,
        get:()=>np.pic.tolerance||28, set:v=>np.pic.tolerance=v, onChange:baseChanged,
        sub:()=>"Raise it if bits of background survive, lower it if the picture gets eaten." });
      note(g2, "The plate grows around the picture, so name and picture come out as one piece.");
    }
  }, state.base.nameplate.pic.on);
  group(p,"Both sides", g2 => {
    checkField(g2,"Mirrored name on the back",()=>np.doubleSided, v=>{ np.doubleSided = v; renderTab(); baseChanged(); });
    if (np.doubleSided){
      numField(g2,{ label:"Back letter height (mm)", min:0.3,max:4,step:0.1, get:()=>np.backH, set:v=>np.backH=v, onChange:baseChanged });
      slotField(g2, "Back filament", ()=>String(np.backSlot), v=>{ np.backSlot = +v; baseChanged(); });
      note(g2, "The back layer prints first, straight onto the plate, so the tag reads correctly either way up.");
    }
  }, np.doubleSided);
  group(p,"Fine tuning", g2 => {
    numField(g2,{ label:"Letter spacing (mm)", min:-1,max:6,step:0.1, get:()=>np.spacing, set:v=>np.spacing=v, onChange:baseChanged,
      sub:()=>FONTS[np.font].joined?"Spacing breaks the joins in a handwriting font.":"" });
    if (np.style === "traced") numField(g2,{ label:"Bridge gaps (mm)", min:0,max:6,step:0.1, get:()=>np.join, set:v=>np.join=v, onChange:baseChanged,
      sub:()=>`Joins letters up to ${(np.join*2).toFixed(1)} mm further apart, without widening the plate.` });
    numField(g2,{ label:"Curve the name (°)", min:-120,max:120,step:5, get:()=>np.arc, set:v=>np.arc=v, onChange:baseChanged,
      sub:()=>np.arc?"Curved text is drawn letter by letter, so joins break.":"0 keeps it straight." });
    if (np.text.includes("\n")) numField(g2,{ label:"Line spacing", min:0.8,max:2,step:0.05, get:()=>np.lineGap, set:v=>np.lineGap=v, onChange:baseChanged });
  });
}

  numField(p,{ label:"Stitches across", min:8,max:90,step:1, get:()=>cv.cells, set:v=>cv.cells=Math.round(v), onChange:baseChanged,
    sub:()=>`Panel about ${(cv.cells*cv.pitch+cv.margin*2).toFixed(0)} mm wide` });
  numField(p,{ label:"Stitch size (mm)", min:2,max:12,step:0.1, get:()=>cv.pitch, set:v=>cv.pitch=v, onChange:baseChanged });
  numField(p,{ label:"Stitch height (mm)", min:0.3,max:4,step:0.1, get:()=>cv.tileH, set:v=>cv.tileH=v, onChange:baseChanged });
  checkField(p,"Holes at the stitch corners, like real plastic canvas",()=>cv.holes, v=>{ cv.holes = v; renderTab(); baseChanged(); });
  group(p,"Sheet", g2 => {

    numField(g2,{ label:"Border (mm)", min:0,max:20,step:0.5, get:()=>cv.margin, set:v=>cv.margin=v, onChange:baseChanged });

  });

function bobbleFields(p){

function cutterFields(p){
  const cu = state.base.cutter, d = state.items[state.active] || state.items[0];
  if (!d){
    p.insertAdjacentHTML("beforeend", `<div class="card empty">Add a logo or photo on the <b>Art</b> tab first.<br>The cutter is traced from its silhouette.</div>`);
    buttonRow(p, [["Go to the Art tab", ()=>{ tab = "art"; renderTab(); }]]);
    return;
  }
  note(p, `Traced from <b>${esc(d.name)}</b>. Change that artwork's width to resize the cutter.`);
  numField(p,{ label:"Blade height (mm)", min:6,max:40,step:1, get:()=>cu.height, set:v=>cu.height=v, onChange:baseChanged });
  numField(p,{ label:"Blade thickness (mm)", min:0.4,max:2,step:0.1, get:()=>cu.blade, set:v=>cu.blade=v, onChange:baseChanged,
    sub:()=>"0.8 to 1.0 mm cuts well and still prints as two walls." });
  group(p,"Handle rim", g2 => {
    numField(g2,{ label:"Rim width (mm)", min:0,max:15,step:0.5, get:()=>cu.rim, set:v=>cu.rim=v, onChange:baseChanged });
    numField(g2,{ label:"Rim thickness (mm)", min:0.8,max:6,step:0.2, get:()=>cu.rimH, set:v=>cu.rimH=v, onChange:baseChanged });
  });
  note(p, "Print in PETG or PP, 2 walls, no infill, and hand wash it.");
}
function tracerFields(p){
  const T = state.base.tracer, d = state.items[state.active] || state.items[0];
  const step = (n, title, body) => {
    const c = document.createElement("div"); c.className = "card step";
    c.innerHTML = `<div class="stephead"><span class="stepnum">${n}</span><b>${title}</b></div>`;
    p.appendChild(c); body(c); return c;
  };
  if (!d){
    step(1, "Take the photo", c => {
      note(c, `Lay the part flat on plain white paper, shoot from <b>straight above</b> in even light, and fill most of the frame.
        Avoid shadows: daylight from a window or two lamps from opposite sides works well.`);
      buttonRow(c, [["Add the photo on the Art tab", ()=>{ tab = "art"; renderTab(); }]]);
    });
    return;
  }
  step(1, "Photo", c => {
    note(c, `Tracing <b>${esc(d.name)}</b>. Shot from straight above, on a plain contrasting background, gives the cleanest outline.`);
    const cv = document.createElement("canvas"); cv.className = "tracepreview"; cv.id = "tracerPreview"; c.appendChild(cv);
    drawTracerPreview(cv);
    segField(c, [["photo","Photo + outline"],["mask","What was found"]], ()=>tracerView, v=>{ tracerView = v; drawTracerPreview(cv); }, "two");
  });
  step(2, "Separate the part from the background", c => {
    segField(c, [["background","Remove background"],["threshold","Brightness"]], ()=>T.method, v=>{ T.method = v; renderTab(); baseChanged(); }, "two");
    if (tracerInfo && tracerInfo.transparent) note(c, T.method === "background"
      ? "This picture has a transparent background, so everything that is not transparent is traced."
      : "This picture has a transparent background. Remove background uses it directly and is usually the better choice here.");
    if (T.method === "background" && !(tracerInfo && tracerInfo.transparent)){
      numField(c,{ label:"Minimum difference from the background", min:4,max:90,step:1, get:()=>T.tol, set:v=>T.tol=v, onChange:baseChanged,
        sub:()=>"The cut sits halfway between paper and part automatically. Raise this only for low-contrast photos where shadows get traced." });
    } else {
      segField(c, [["auto","Auto"],["dark","Part is darker"],["light","Part is lighter"]], ()=>T.polarity, v=>{ T.polarity = v; baseChanged(); });
      checkField(c, "Pick the threshold automatically", ()=>T.autoThr, v=>{ T.autoThr = v; renderTab(); baseChanged(); });
      if (!T.autoThr) numField(c,{ label:"Threshold (%)", min:2,max:98,step:1, get:()=>T.threshold, set:v=>T.threshold=v, onChange:baseChanged });
    }
  });
  step(3, "Clean up the trace", c => {
    numField(c,{ label:"Smooth away noise (mm)", min:0,max:3,step:0.05, get:()=>T.smooth, set:v=>T.smooth=v, onChange:baseChanged,
      sub:()=>T.smooth > 0 ? "Rounds rough edges, fills nicks and removes specks and short whiskers. Long thin lines and narrow gaps are kept. Shrinks round holes by about 0.05 mm: for precision parts set it to 0." : "Off: holes and edges are traced exactly as photographed." });
    checkField(c, "Keep only the main piece and what is inside it", ()=>T.largestOnly, v=>{ T.largestOnly = v; renderTab(); baseChanged(); });
    const lo = tracerInfo && tracerInfo.leftOut;
    note(c, T.largestOnly
      ? (lo ? `${lo} piece${lo === 1 ? "" : "s"} outside the main outline ${lo === 1 ? "was" : "were"} left out. Untick this to keep ${lo === 1 ? "it" : "them"} (text beside a logo, for example).`
            : "Letters or shapes inside the main outline are kept; anything outside it (a shadow, another object) is left out.")
      : "Every piece is kept, as separate islands.");
    numField(c,{ label:"Ignore pieces smaller than (mm²)", min:0,max:100,step:0.5, get:()=>T.specks, set:v=>T.specks=v, onChange:baseChanged });
    numField(c,{ label:"Thicken lines thinner than (mm)", min:0,max:3,step:0.05, get:()=>T.minLine || 0, set:v=>T.minLine=v, onChange:baseChanged,
      sub:()=>{ const a = tracerInfo && tracerInfo.thickened; return !(T.minLine > 0) ? "0 is off. About two line widths (0.8 mm for a 0.4 mm nozzle) makes a logo's hairlines print."

function drawTracerPreview(cv){
  const info = tracerInfo; if (!info || !cv) return;
  const W = info.w, H = info.h, sc = Math.min(1, 640/Math.max(W,H));
  cv.width = Math.round(W*sc); cv.height = Math.round(H*sc);
  const x = cv.getContext("2d");
  if (tracerView === "mask"){
    const im = x.createImageData(W, H);
    for (let i=0;i<info.mask.length;i++){ const o=i*4, on = info.mask[i];
      im.data[o] = on?31:236; im.data[o+1] = on?111:240; im.data[o+2] = on?139:244; im.data[o+3] = 255; }

    x.drawImage(tmp, 0, 0, cv.width, cv.height);
  } else {
    const tmp = document.createElement("canvas"); tmp.width = W; tmp.height = H;
    const t2 = tmp.getContext("2d"), id3 = t2.createImageData(W, H);
    id3.data.set(info.img.data); t2.putImageData(id3, 0, 0);
    x.drawImage(tmp, 0, 0, cv.width, cv.height);
  }

  const T = state.base.tracer;
  cv.style.cursor = T.brushMode === "off" ? "default" : "crosshair";
  let stroke = null;
  const at = ev => { const r = cv.getBoundingClientRect(); return [ (ev.clientX-r.left)/r.width, (ev.clientY-r.top)/r.height ]; };
  const dab = (u,v) => {
    x.fillStyle = T.brushMode === "add" ? "rgba(31,111,139,.55)" : "rgba(255,61,127,.55)";
    x.beginPath(); x.arc(u*cv.width, v*cv.height, Math.max(2, stroke.r*cv.width), 0, Math.PI*2); x.fill();
  };

    if (T.brushMode === "off") return;
    const rNorm = (T.brushSize/2) / (info.mmPerPx*W);         // brush radius as a fraction of image width
    stroke = { m:T.brushMode, r:rNorm, pts:[at(ev)] };
    dab(...stroke.pts[0]);
    if (cv.setPointerCapture) try { cv.setPointerCapture(ev.pointerId); } catch(e){}

    T.strokes = (T.strokes||[]).concat([stroke]); stroke = null;

// what it looks like against a light: transmission falls off exponentially with thickness
function drawLithoPreview(cv){
  cv = cv || document.getElementById("lithoPreview");
  const L = lithoInfo; if (!cv) return;
  const ctx = cv.getContext("2d");
  if (!L){ cv.width = 320; cv.height = 60; ctx.clearRect(0,0,cv.width,cv.height); return; }
  if (L.shape === "strip"){                          // each step as it should look against the light
    const n = L.steps.length, sw = Math.max(16, Math.floor(640/n)), k = 1.3, top = Math.exp(-k*L.steps[0]);
    cv.width = n*sw; cv.height = 120; ctx.fillStyle = "#2a2622"; ctx.fillRect(0,0,cv.width,cv.height);
    L.steps.forEach((t,i) => {
      const g = Math.pow(clamp(Math.exp(-k*t)/top, 0, 1), 1/2.2);
      ctx.fillStyle = `rgb(${Math.round(40+215*g)},${Math.round(30+200*g)},${Math.round(20+160*g)})`; ctx.fillRect(i*sw, 0, sw, 84);
      ctx.fillStyle = "#e9e4dc"; ctx.font = `600 ${Math.min(16, sw*0.45)}px sans-serif`; ctx.textAlign = "center";
      ctx.fillText(L.label(t), i*sw + sw/2, 108);
    });
    return;
  }
  const scale = Math.max(1, Math.ceil(Math.max(L.gx, L.gy)/420)), w = Math.ceil(L.gx/scale), h = Math.ceil(L.gy/scale);
  cv.width = w; cv.height = h;
  const img = ctx.createImageData(w, h), k = 1.3, lo = Math.exp(-k*L.maxT), hi = Math.exp(-k*L.minT);
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){
    const i = Math.min(L.gx-1, x*scale), j = Math.min(L.gy-1, (h-1-y)*scale), n = j*L.gx+i, o = (y*w+x)*4;
    if (L.sdf && L.sdf[n] > 0){ img.data[o+3] = 0; continue; }
    const g = Math.pow(clamp((Math.exp(-k*L.thick[n]) - lo)/(hi - lo), 0, 1), 1/2.2);
    img.data[o] = 40 + 215*g; img.data[o+1] = 30 + 200*g; img.data[o+2] = 20 + 160*g; img.data[o+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}
function updateLithoSummary(){
  const el = document.getElementById("lithoSummary"), L = lithoInfo; if (!el) return;
  if (!L){ el.textContent = ""; return; }

// the picture with the cut over it; the same drawing becomes the box picture
function paintJigsaw(x, w, h, opts){
  const J = jigsawInfo; if (!J) return;
  const sc = w / J.W, tx = pt => (pt[0] + J.W/2)*sc, ty = pt => (J.H/2 - pt[1])*sc;
  x.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--panel2").trim() || "#eef1f5";
  x.fillRect(0, 0, w, h);
  if (J.src){
    x.save();
    if (J.mirror){ x.translate(w, 0); x.scale(-1, 1); }
    x.drawImage(J.src, 0, 0, w, h);
    x.restore();
  }
  const path = L => { L.forEach((pt,i)=>{ i ? x.lineTo(tx(pt), ty(pt)) : x.moveTo(tx(pt), ty(pt)); }); };
  if (J.outline){                                   // everything outside a shaped puzzle is cut away
    x.beginPath(); x.rect(0, 0, w, h); path(J.outline); x.closePath();
    x.fillStyle = opts.box ? "#ffffff" : "rgba(20,27,36,.62)"; x.fill("evenodd");
  }
  const strokeAll = (width, colour) => {
    x.lineWidth = width; x.strokeStyle = colour; x.lineJoin = "round"; x.lineCap = "round";
    J.lines.forEach(L => { x.beginPath(); path(L); x.stroke(); });
    if (J.outline){ x.beginPath(); path(J.outline); x.closePath(); x.stroke(); }
  };
  if (opts.box) strokeAll(Math.max(1, w/700), "rgba(0,0,0,.18)");
  else { strokeAll(3.2, "rgba(20,27,36,.55)"); strokeAll(1.4, "#ffffff"); }
}
function drawJigsawPreview(cv){
  cv = cv || document.getElementById("jigsawPreview");
  const J = jigsawInfo; if (!cv || !J) return;
  const sc = Math.min(640/J.W, 460/J.H);
  cv.width = Math.max(8, Math.round(J.W*sc)); cv.height = Math.max(8, Math.round(J.H*sc));
  paintJigsaw(cv.getContext("2d"), cv.width, cv.height, { box:false });
}
async function exportJigsawSVG(){
  if (!jigsawInfo){ notify("Make a jigsaw puzzle first."); return; }
  await offerDownload(modelName().replace(/\s+/g,"-").toLowerCase()+"-cut-lines.svg", C.jigsawSVG(jigsawInfo.cut, modelName()), "image/svg+xml");
}
async function exportJigsawPNG(){
  const J = jigsawInfo; if (!J){ notify("Make a jigsaw puzzle first."); return; }
  const c = document.createElement("canvas"), sc = Math.min(1800/J.W, 1800/J.H);
  c.width = Math.round(J.W*sc); c.height = Math.round(J.H*sc);
  paintJigsaw(c.getContext("2d"), c.width, c.height, { box:true });
  const blob = await new Promise(r => c.toBlob(r, "image/png"));
  if (blob) await offerDownload(modelName().replace(/\s+/g,"-").toLowerCase()+"-box-picture.png", blob);
}

function toggleSkip(d,i){ d.skip = d.skip.includes(i)?d.skip.filter(x=>x!==i):[...d.skip,i]; d.solids = null; schedule(); pushHistory(); }
function dropBackground(d){
  const src = sourceCanvas(d); if (!src) return;
  const x = src.getContext("2d", { willReadFrequently:true });
  const pick = (px,py)=>{ const p = x.getImageData(px,py,1,1).data; return [p[0],p[1],p[2],p[3]]; };
  const corners = [pick(0,0), pick(src.width-1,0), pick(0,src.height-1), pick(src.width-1,src.height-1)].filter(c=>c[3]>128);
  if (!corners.length){ notify("The background is already transparent."); return; }
  const avg = [0,1,2].map(k=>corners.reduce((a,c)=>a+c[k],0)/corners.length);
  let best = 0, bd = Infinity;
  state.slots.forEach((s2,i)=>{ const dd = C.colorDist(avg, C.hexToRgb(s2.hex)); if (dd < bd){ bd = dd; best = i; } });
  if (!d.skip.includes(best)) d.skip.push(best);
  notify(`Dropped filament ${best+1} (${state.slots[best].name}) from this artwork.`);
  d.solids = null; schedule(); pushHistory(); renderTab();
}
function duplicateItem(){
  const d = state.items[state.active]; if (!d) return;
  const copy = JSON.parse(JSON.stringify({ ...d, solids:undefined, src:undefined, thumb:undefined, _img:undefined, _cm:undefined, _raw:undefined, _srcCv:undefined }));
  copy.id = uid++; copy.offU = (copy.offU||0)+4; copy.offV = (copy.offV||0)-4; copy._imgKey = ""; copy._srcSig = "";
  copy.src = d.src; copy.thumb = d.thumb;
  state.items.push(copy); state.active = state.items.length-1;
  renderTab(); schedule(); pushHistory();
}
function removeItem(){
  if (!state.items[state.active]) return;
  state.items.splice(state.active,1); state.active = Math.min(state.active, state.items.length-1);
  renderTab(); schedule(); pushHistory();
}
function moveItem(dir){
  const i = state.active, j = i+dir;
  if (i < 0 || j < 0 || j >= state.items.length) return;
  [state.items[i], state.items[j]] = [state.items[j], state.items[i]];
  state.active = j; renderTab(); schedule(); pushHistory();
}
function renameItem(){

function renderItemList(){

function drawPreview(){
  const cv = $("#preview"), d = state.items[state.active];
  if (!cv || !d || !d._cm) return;
  const { gx, gy, idx } = d._cm, zoom = d.zoom||1;
  const w = Math.min(680, Math.round(330*zoom));
  cv.width = gx; cv.height = gy; cv.style.width = w+"px"; cv.style.height = Math.round(w/d.aspect)+"px";
  const x = cv.getContext("2d");
  if (d.previewMode === "original" || d.previewMode === "split"){
    const src = sourceCanvas(d);
    if (src) x.drawImage(src, 0, 0, gx, gy);
  }
  if (d.previewMode !== "original"){
    const im = x.createImageData(gx,gy), rgb = state.slots.map(s2=>C.hexToRgb(s2.hex));
    const from = d.previewMode === "split" ? Math.floor(gx/2) : 0;
    const base = d.previewMode === "split" ? x.getImageData(0,0,gx,gy) : null;
    for (let j=0;j<gy;j++) for (let i=0;i<gx;i++){
      const k = j*gx+i, o = k*4;
      if (d.previewMode === "split" && i < from){ for (let q=0;q<4;q++) im.data[o+q] = base.data[o+q]; continue; }
      const s2 = idx[k];
      if (s2 < 0 || !rgb[s2]) continue;
      im.data[o] = rgb[s2][0]; im.data[o+1] = rgb[s2][1]; im.data[o+2] = rgb[s2][2]; im.data[o+3] = 255;
    }
    x.putImageData(im,0,0);
  }
  cv.onclick = ev => {
    if (d.forceSlot != null || !d._raw || d.previewMode === "original") return;
    const r = cv.getBoundingClientRect();
    const i = clamp(Math.floor((ev.clientX-r.left)/r.width*gx),0,gx-1), j = clamp(Math.floor((ev.clientY-r.top)/r.height*gy),0,gy-1);
    const s2 = d._raw[j*gx+i];
    if (s2 >= 0){ toggleSkip(d,s2); renderTab(); }
  };
}
function wireDrop(){
  const drop = $("#drop"), input = $("#fileInput");
  input.onchange = e => { addFiles(e.target.files); e.target.value = ""; };
  drop.addEventListener("keydown", e => { if (e.key==="Enter"||e.key===" "){ e.preventDefault(); input.click(); } });
  ["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev, e=>{ e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev, e=>{ e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => { if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });
}
async function addFiles(files){
  const imgs = [...files].filter(f=>f.type.startsWith("image/"));
  if (!imgs.length){ notify("Those files are not images."); return; }
  const drop = $("#drop"); if (drop) drop.classList.add("loading");
  setBusy(true, `Loading ${imgs.length} picture${imgs.length===1?"":"s"}…`);
  for (const file of imgs){
    try {
      const svg = /svg/i.test(file.type) || /\.svg$/i.test(file.name) ? await loadSvgFile(file) : null;
      const canvas = svg ? svg.canvas : toCanvas(await loadImageFile(file));
      const id = "a"+(uid++);
      assets[id] = { canvas, dataURL:canvas.toDataURL("image/png") };
      // switch earlier pictures off so the new one does not land on top of them
      const wereOn = state.items.filter(x=>!x.text && x.enabled !== false);
      wereOn.forEach(x=>{ x.enabled = false; x.solids = null; });
      if (wereOn.length) notify("Earlier pictures were switched off so they don't overlap. Click a thumbnail to switch one back on.");
      const it = newItem(file.name.replace(/\.[^.]+$/,""), canvas, { asset:id, enabled:true });
      if (svg && svg.mm) it.mm = svg.mm.map(v => +v.toFixed(3));        // the drawing's real size, for the tracer
      it.src = canvas; it.thumb = assets[id].dataURL;
      state.items.push(it); state.active = state.items.length-1;
    } catch (err){ notify(err.message); }
  }
  setBusy(false); logLine(`Added ${imgs.length} picture${imgs.length===1?"":"s"}`);
  renderTab(); schedule(); pushHistory();
}

function removeSlot(i){
  state.slots.splice(i,1);
  const fix = v => v >= state.slots.length ? 0 : (v > i ? v-1 : v);
  const b = state.base;
  b.slot = fix(b.slot);
  const np = b.nameplate; np.nameSlot = fix(np.nameSlot); np.accentSlot = fix(np.accentSlot); np.backSlot = fix(np.backSlot);
  const bo = b.bobble; bo.headSlot = fix(bo.headSlot); bo.bodySlot = fix(bo.bodySlot); bo.postSlot = fix(bo.postSlot);
  const lb = b.lightbox; lb.diffSlot = fix(lb.diffSlot); lb.frameSlot = fix(lb.frameSlot);
  const pb = b.pcb; pb.traceSlot = fix(pb.traceSlot); pb.textSlot = fix(pb.textSlot);
  state.items.forEach(d=>{
    d.skip = d.skip.filter(x=>x!==i).map(x=>x>i?x-1:x);
    if (d.forceSlot != null) d.forceSlot = d.forceSlot === i ? 0 : fix(d.forceSlot);
    if (d.outline) d.outline.slot = fix(d.outline.slot);
    d.solids = null;
  });
  // paint that used the removed filament goes back to the part's own colour; later numbers move down
  const pk = v => v === PAINT_LEAVE ? v : v === i ? PAINT_LEAVE : v > i ? v - 1 : v, p0 = v => Math.min(pk(v) === PAINT_LEAVE ? 0 : pk(v), state.slots.length - 1);
  (state.paint && state.paint.ops || []).forEach(o => {
    for (const k of ["slot","gap","up","side","down"]) if (typeof o[k] === "number") o[k] = pk(o[k]);
    for (const k of ["a","b","from","to"]) if (typeof o[k] === "number" && (o.k === "gradient" || o.k === "swap")) o[k] = p0(o[k]);
    if (Array.isArray(o.slots)) o.slots = o.k === "height" ? o.slots.map(pk) : o.slots.map(pk).filter(v => v !== PAINT_LEAVE);
  });
  if (paintUI.slot >= state.slots.length) paintUI.slot = state.slots.length - 1;
  renderTab(); schedule(); pushHistory();
}

const PAINT_OP_NAME = { height:"Height bands", gradient:"Colour fade", swap:"Swap a colour", stripes:"Stripes", dir:"Tops and sides", shells:"Separate pieces", regions:"Smooth areas",
  picture:"Picture", noise:"Random blobs", brush:"Brush stroke", fill:"Fill" };
function slotChoices(withKeep){ return [...(withKeep ? [["255","Keep as it is"]] : []), ...state.slots.map((s,i)=>[String(i), `${i+1}. ${s.name}`])]; }
function paintModelHeight(){ const B = modelBoundsOf(modelParts); return isFinite(B.mx[1]) ? Math.max(1, B.mx[1] - Math.min(0, B.mn[1])) : 50; }
function newPaintOp(k){
  const H = paintModelHeight(), n = Math.min(3, state.slots.length), sl = [...Array(Math.max(2, n)).keys()].map(i => Math.min(i, state.slots.length-1));
  if (k === "height") return { k, slots:sl, cuts:sl.slice(1).map((_,i) => +(H*(i+1)/sl.length).toFixed(1)) };
  if (k === "gradient") return { k, a:0, b:Math.min(1, state.slots.length-1), from:+(H*0.25).toFixed(1), to:+(H*0.75).toFixed(1), ends:true };
  if (k === "swap") return { k, from:0, to:Math.min(1, state.slots.length-1) };
  if (k === "stripes") return { k, slot:Math.min(1, state.slots.length-1), gap:PAINT_LEAVE, from:0, to:+H.toFixed(1), every:Math.max(2, +(H/8).toFixed(1)), width:Math.max(1, +(H/16).toFixed(1)) };
  if (k === "dir") return { k, up:Math.min(1, state.slots.length-1), side:0, down:PAINT_LEAVE, angle:30 };
  if (k === "shells") return { k, slots:state.slots.map((_,i)=>i) };
  if (k === "regions") return { k, angle:30, slots:state.slots.map((_,i)=>i) };
  if (k === "picture") return { k, item:Math.max(0, state.active), dir:"front", scale:100, dx:0, dy:0, facing:true };
  if (k === "noise") return { k, slots:sl, scale:12, seed:1 };
  return null;
}
function paintOpText(o){
  const nm = s => s === PAINT_LEAVE ? "keep" : ((state.slots[s]||{}).name || `filament ${s+1}`);
  if (o.k === "height") return `${o.slots.length} bands: ${o.slots.map(nm).join(", ")}`;
  if (o.k === "stripes") return `${nm(o.slot)} every ${o.every} mm`;
  if (o.k === "gradient") return `${nm(o.a)} to ${nm(o.b)}, ${o.from} to ${o.to} mm`;
  if (o.k === "swap") return `${nm(o.from)} becomes ${nm(o.to)}`;
  if (o.k === "dir") return `tops ${nm(o.up)}, sides ${nm(o.side)}, undersides ${nm(o.down)}`;
  if (o.k === "brush") return `${o.slot === PAINT_LEAVE ? "eraser" : nm(o.slot)}, ${o.r} mm, ${o.pts.length} points${o.mirror ? ", mirrored" : ""}`;
  if (o.k === "fill") return `${o.slot === PAINT_LEAVE ? "eraser" : nm(o.slot)}, ${o.same ? "same colour" : "smooth area"}`;
  if (o.k === "picture") return `${(state.items[o.item]||{}).name || "missing artwork"}, from the ${o.dir}`;
  return (o.slots||[]).map(nm).join(", ");
}
function updatePaintSummary(){
  const el = document.getElementById("paintSummary"); if (!el) return;
  const tot = Object.values(paintInfo.area).reduce((a,b)=>a+b, 0);
  if (!paintOps().length){ el.innerHTML = "Nothing painted yet."; return; }
  el.innerHTML = Object.entries(paintInfo.area).sort((a,b)=>b[1]-a[1]).map(([s,a]) =>
    `<span class="pchip"><span class="sw" style="background:${esc((state.slots[s]||{}).hex||"#888")}"></span>${esc((state.slots[s]||{}).name||"")} ${Math.round(100*a/(tot||1))}%</span>`).join("") +
    `<div class="sub">${paintInfo.tris.toLocaleString()} triangles${isFinite(paintInfo.edge) && paintInfo.edge ? `, none longer than ${paintInfo.edge.toFixed(1)} mm` : ""}${paintInfo.capped ? ". The model is big, so the detail was lowered to keep the file small." : "."}</div>`;
}
function paletteRow(parent){
  const row = document.createElement("div"); row.className = "palette"; row.setAttribute("role","radiogroup"); row.setAttribute("aria-label","Colour to paint with");
  state.slots.forEach((s,i)=>{
    const b = document.createElement("button"); b.className = "pswatch"; b.setAttribute("role","radio"); b.setAttribute("aria-checked", String(paintUI.slot === i));
    b.setAttribute("aria-label", `${i+1}: ${s.name}`); b.title = `${s.name} (key ${i+1})`;
    b.innerHTML = `<span class="sw" style="background:${esc(s.hex)}"></span><span class="num">${i+1}</span>`;
    b.onclick = () => { paintUI.slot = i; if (paintUI.tool === "erase") paintUI.tool = "brush"; renderTab(); };
    row.appendChild(b);
  });
  if (state.slots.length < MAX_SLOTS){
    const add = document.createElement("button"); add.className = "pswatch add"; add.textContent = "+"; add.setAttribute("aria-label","Add a filament"); add.title = "Add a filament";
    add.onclick = () => { const i = state.slots.length; state.slots.push({ hex:["#e8452c","#2a9d8f","#f0b429","#3a86ff","#8338ec","#ff6f91","#6a994e","#222222"][i % 8], name:`Filament ${i+1}`, mat:"PLA", price:22 }); paintUI.slot = i; renderTab(); repaint(); pushHistory(); };

}
function slotChecks(parent, o){
  const w = document.createElement("div"); w.className = "chips";
  state.slots.forEach((s,i)=>{
    const on = (o.slots||[]).includes(i), b = document.createElement("button"); b.className = "pchip toggle"; b.setAttribute("aria-pressed", String(on));
    b.innerHTML = `<span class="sw" style="background:${esc(s.hex)}"></span>${esc(s.name)}`;
    b.onclick = () => { o.slots = on ? o.slots.filter(x=>x!==i) : [...(o.slots||[]), i].sort((a,b)=>a-b); if (!o.slots.length) o.slots = [i]; renderTab(); paintChanged(); };
    w.appendChild(b);
  });

function paintOpFields(parent, o){
  const H = paintModelHeight(), ch = () => paintChanged();
  const slotSel = (label, get, set, keep) => selField(parent, label, slotChoices(keep), () => String(get()), v => { set(+v); ch(); });
  if (o.k === "height"){
    numField(parent,{ label:"Number of bands", min:2, max:8, step:1, get:()=>o.slots.length, set:v=>{
      const n = Math.round(v); while (o.slots.length < n) o.slots.push(Math.min(o.slots.length, state.slots.length-1)); o.slots.length = n;
      o.cuts = o.slots.slice(1).map((_,i) => +(H*(i+1)/n).toFixed(1)); }, onChange:()=>{ renderTab(); ch(); } });
    o.slots.forEach((s,i) => {
      slotSel(i === 0 ? "Bottom band colour" : i === o.slots.length-1 ? "Top band colour" : `Band ${i+1} colour`, () => o.slots[i], v => o.slots[i] = v, true);
      if (i > 0) numField(parent,{ label:`Band ${i+1} starts at (mm up)`, min:0, max:Math.ceil(H), step:0.1, get:()=>o.cuts[i-1], set:v=>{ o.cuts[i-1] = v; }, onChange:ch,
        sub:()=> o.cuts[i-1] < (o.cuts[i-2] ?? -Infinity) ? "This band starts below the one before it, so it is hidden." : "" });
    });
    buttonRow(parent, [["Spread the bands evenly", ()=>{ o.cuts = o.slots.slice(1).map((_,i)=>+(H*(i+1)/o.slots.length).toFixed(1)); renderTab(); ch(); }],
      ["Line up with the layers", ()=>{ const L = state.printer.layer || 0.2; o.cuts = o.cuts.map(h => +(Math.round(h/L)*L).toFixed(3)); renderTab(); ch(); }]]);
    note(parent, `The model is ${H.toFixed(1)} mm tall. Lining up with the layers (${state.printer.layer} mm) puts every colour change exactly on a layer.`);
  } else if (o.k === "gradient"){
    slotSel("Bottom colour", () => o.a, v => o.a = v, false);
    slotSel("Top colour", () => o.b, v => o.b = v, false);
    numField(parent,{ label:"Fade starts at (mm up)", min:0, max:Math.ceil(H), step:0.2, get:()=>o.from, set:v=>o.from=Math.min(v, o.to - 0.4), onChange:ch });
    numField(parent,{ label:"Fade ends at (mm up)", min:0, max:Math.ceil(H), step:0.2, get:()=>o.to, set:v=>o.to=Math.max(v, o.from + 0.4), onChange:ch });
    checkField(parent, "Solid colours below and above the fade", () => o.ends !== false, v => { o.ends = v; ch(); });
    note(parent, `Each ${state.printer.layer} mm layer in the fade is one filament or the other, so it prints with ${Math.round((o.to - o.from)/(state.printer.layer || 0.2))} colour changes. A 0.12 mm layer height makes the smoothest fade.`);
  } else if (o.k === "swap"){
    slotSel("Change this colour", () => o.from, v => o.from = v, false);
    slotSel("Into", () => o.to, v => o.to = v, false);
  } else if (o.k === "stripes"){
    slotSel("Stripe colour", () => o.slot, v => o.slot = v, false);
    slotSel("Between the stripes", () => o.gap, v => o.gap = v, true);
    numField(parent,{ label:"One stripe every (mm)", min:0.4, max:Math.max(2, Math.ceil(H)), step:0.1, get:()=>o.every, set:v=>o.every=v, onChange:ch });
    numField(parent,{ label:"Stripe height (mm)", min:0.2, max:Math.max(1, Math.ceil(H)), step:0.1, get:()=>o.width, set:v=>o.width=v, onChange:ch });
    numField(parent,{ label:"From (mm up)", min:0, max:Math.ceil(H), step:0.5, get:()=>o.from, set:v=>o.from=v, onChange:ch });
    numField(parent,{ label:"To (mm up)", min:0, max:Math.ceil(H), step:0.5, get:()=>o.to, set:v=>o.to=v, onChange:ch });
  } else if (o.k === "dir"){
    slotSel("Surfaces facing up", () => o.up, v => o.up = v, true);
    slotSel("Walls", () => o.side, v => o.side = v, true);
    slotSel("Undersides", () => o.down, v => o.down = v, true);
    numField(parent,{ label:"A surface counts as up when it tilts less than (°)", min:1, max:89, step:1, get:()=>90-o.angle, set:v=>o.angle=90-v, onChange:ch });
  } else if (o.k === "shells" || o.k === "regions"){
    note(parent, "Colours to use, in turn:");
    slotChecks(parent, o);
    if (o.k === "regions") numField(parent,{ label:"Split at edges sharper than (°)", min:5, max:89, step:1, get:()=>o.angle, set:v=>o.angle=v, onChange:ch,
      sub:()=>"Lower finds more areas; higher only splits at hard corners." });
  } else if (o.k === "noise"){
    note(parent, "Colours to use:");

    numField(parent,{ label:"Blob size (mm)", min:1, max:100, step:0.5, get:()=>o.scale, set:v=>o.scale=v, onChange:ch });
    buttonRow(parent, [["Shuffle the pattern", ()=>{ o.seed = (o.seed % 9999) + 1; ch(); }]]);
  } else if (o.k === "picture"){
    if (!state.items.length){ parent.insertAdjacentHTML("beforeend", `<div class="card empty">Add a picture on the <b>Art</b> tab first.</div>`); return; }
    selField(parent, "Picture", state.items.map((d,i)=>[String(i), d.name]), () => String(o.item), v => { o.item = +v; ch(); });
    segField(parent, [["front","Front"],["back","Back"],["left","Left"],["right","Right"],["top","Top"]], () => o.dir, v => { o.dir = v; renderTab(); ch(); }, "five");
    numField(parent,{ label:"Size (%)", min:10, max:400, step:1, get:()=>o.scale, set:v=>o.scale=v, onChange:ch });
    numField(parent,{ label:"Move across (mm)", min:-200, max:200, step:0.5, get:()=>o.dx, set:v=>o.dx=v, onChange:ch });
    numField(parent,{ label:"Move up (mm)", min:-200, max:200, step:0.5, get:()=>o.dy, set:v=>o.dy=v, onChange:ch });
    checkField(parent, "Only the side facing the picture", () => o.facing !== false, v => { o.facing = v; ch(); });
    note(parent, "Colours switched off for this picture on the Art tab are left unpainted.");
  }
}

// keys on the Paint tab: 1 to 8 pick a colour, [ and ] change the brush, B F E V pick a tool
window.addEventListener("keydown", e => {
  if (tab !== "paint" || e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target; if (t && (t.matches("input,textarea,select") || t.isContentEditable)) return;
  if (/^[1-8]$/.test(e.key) && +e.key <= state.slots.length){ paintUI.slot = +e.key - 1; if (paintUI.tool === "erase" || paintUI.tool === "view") paintUI.tool = "brush"; paintControls(); renderTab(); e.preventDefault(); }
  else if (e.key === "[" || e.key === "]"){ paintUI.r = clamp(paintUI.r + (e.key === "]" ? 0.5 : -0.5), 0.5, 30); renderTab(); e.preventDefault(); }
  else if ({ b:"brush", f:"fill", e:"erase", v:"view" }[e.key.toLowerCase()]){ paintUI.tool = { b:"brush", f:"fill", e:"erase", v:"view" }[e.key.toLowerCase()]; paintControls(); renderTab(); e.preventDefault(); }
});

// STL, OBJ or 3MF (including Bambu Studio and PrusaSlicer files, with their painting and colours)
async function importModelFile(file){
  const ext = (file.name.match(/\.(\w+)$/) || [])[1] ? file.name.match(/\.(\w+)$/)[1].toLowerCase() : "";
  if (file.size > 400e6) throw new Error("That file is over 400 MB: too big to open in a browser tab.");
  let raw, paint = null, colours = null;
  if (ext === "obj") raw = C.parseOBJ(await file.text());
  else if (ext === "3mf"){
    const zip = await JSZip.loadAsync(await file.arrayBuffer()), files = {};
    const names = Object.keys(zip.files).filter(n => /\.model$/i.test(n)).slice(0, 400);
    if (!names.length) throw new Error("That 3mf has no model inside.");
    for (const n of names) files[n] = await zip.file(n).async("string");
    const rels = zip.file("_rels/.rels") ? await zip.file("_rels/.rels").async("string") : "";
    const main = ((/Target="([^"]+\.model)"/i.exec(rels) || [])[1] || names.find(n => /3dmodel\.model$/i.test(n)) || names[0]).replace(/^\//, "");
    // which filament each part prints in (Bambu Studio / OrcaSlicer, PrusaSlicer), and the filament colours
    const text = async re => { const n = Object.keys(zip.files).find(k => re.test(k)); return n ? (await zip.file(n).async("string")).slice(0, 20e6) : null; };
    const r = C.parse3MFModel(files, main, { bambu: await text(/^\/?Metadata\/model_settings\.config$/i), prusa: await text(/^\/?Metadata\/Slic3r_PE_model\.config$/i) });
    raw = r.tris; paint = r.paint;
    const hexes = list => list.map(c => String(c).trim()).filter(c => /^#[0-9a-f]{6}/i.test(c)).map(c => c.slice(0, 7));
    const ps = await text(/^\/?Metadata\/project_settings\.config$/i), pe = !ps && await text(/^\/?Metadata\/Slic3r_PE\.config$/i);
    if (ps){ try { const j = JSON.parse(ps); if (Array.isArray(j.filament_colour)) colours = hexes(j.filament_colour); } catch(e){} }
    else if (pe){ const line = k => ((new RegExp("^; " + k + " = (.*)$", "m").exec(pe) || [])[1] || "").split(";"); const ex = hexes(line("extruder_colour")), fi = hexes(line("filament_colour")); colours = ex.length ? ex : fi; }
    if (!colours || !colours.length){ const m = files[main] || ""; colours = hexes([...m.matchAll(/<base\b[^>]*displaycolor="(#[0-9a-f]{6})/gi)].map(x => x[1])); }
  } else raw = C.parseSTL(await file.arrayBuffer());
  const y = new Float32Array(raw.length);
  for (let i=0;i<raw.length;i+=3){ y[i]=raw[i]; y[i+1]=raw[i+2]; y[i+2]=-raw[i+1]; }    // Z up (printers) to Y up (the view)
  clearPaintForNewModel();
  stlData = y; stlPaint = paint; stlCache = null; state.base.type = "stl";
  state.base.stl = { name:`${file.name} (${(raw.length/9).toLocaleString()} triangles)`, scale:100 };
  if (paint){
    // the file's filament colours; a filament it uses but gives no colour for still gets a filament here
    const spare = ["#ffffff","#161616","#c12e1f","#0a2989","#f0b429","#12633f","#7b4bd8","#8fb8c9"];
    let top = 0; for (let i=0;i<paint.length;i++) if (paint[i] > top) top = paint[i];
    const cs = colours || [], used = Math.min(MAX_SLOTS, top);
    for (let i=0;i<used;i++){
      if (!state.slots[i]) state.slots.push({ hex:cs[i] || spare[i], name:`Filament ${i+1}`, mat:"PLA", price:22 });
      else if (cs[i]) state.slots[i].hex = cs[i];
    }
  }
  state.items.forEach(d=>{ d.place = defaultPlace(); d.solids = null; });
  userMoved = false; renderTab(); await rebuildAll(false); pushHistory();
  if (paint) notify(`Opened ${file.name} with its painting. Change it on the Paint tab.`);
}
