/* A project file is untrusted input: someone may send you one. Colours end up inside style
   attributes and images inside <img>, so everything is checked before it touches the page. */
const HEX_RE = /^#[0-9a-f]{6}$/i;
function cleanStr(v, max, fallback){ return typeof v === "string" ? v.slice(0, max) : fallback; }
function cleanNum(v, fallback){ return typeof v === "number" && isFinite(v) ? v : fallback; }
/* hard limits for every setting that decides how much memory or time a build takes;
   a hostile project could otherwise ask for a billion-pixel trace and freeze the tab */
const LIMITS = {
  workRes:[200,2000], paperRes:[400,2500], cells:[8,120], res:[40,400], layers:[2,8], springTurns:[2,12],
  letterHeight:[6,80], quality:[0.06,0.4], width:[5,400], h:[1,400], w:[1,400], d:[1,400], dia:[1,400],
  size:[1,400], thick:[0.2,80], border:[0,40], join:[0,20], pitch:[1,20], headDia:[10,120], bodyH:[10,200],
  maxCells:[200,900], zoom:[0.25,4], brushSize:[0.1,30], tol:[1,120], smooth:[0,5], boreDepth:[1,60],
  brim:[0,15], overhang:[20,80], bridge:[0,60], pieces:[4,500], seed:[1,99999],
  cell:[0.1,2], minT:[0.2,10], maxT:[0.4,20], curve:[10,300], holeDia:[1,20],
  stripFrom:[0.2,3], stripTo:[0.6,8], stripStep:[0.05,1], labelH:[2,15], labelLine:[0.3,2], labelDepth:[0.2,5], footDepth:[0.4,3], minLine:[0,3]
};
// the same name means something else in these places (parent key . key): checked first
const LIMITS_AT = { "sym.size":[0.4,3], "pic.size":[0.4,3], "outline.width":[0.2,6] };
// a print orientation must be a real rotation: nine numbers, orthonormal, no mirror
function cleanRotation(m){
  if (!Array.isArray(m) || m.length !== 9 || !m.every(v => typeof v === "number" && isFinite(v))) return null;
  for (let a=0;a<3;a++) for (let b=0;b<3;b++){
    const d = m[a*3]*m[b*3] + m[a*3+1]*m[b*3+1] + m[a*3+2]*m[b*3+2];
    if (Math.abs(d - (a===b?1:0)) > 1e-3) return null;
  }
  const det = m[0]*(m[4]*m[8]-m[5]*m[7]) - m[1]*(m[3]*m[8]-m[5]*m[6]) + m[2]*(m[3]*m[7]-m[4]*m[6]);
  return det > 0.99 ? m.slice() : null;
}
function stripDangerous(o, depth, parent, free){
  if (!o || typeof o !== "object" || depth > 12) return o;
  for (const k of Object.keys(o)){
    if (k === "__proto__" || k === "constructor" || k === "prototype"){ delete o[k]; continue; }
    const v = o[k], lim = free ? null : (LIMITS_AT[parent + "." + k] || (Object.prototype.hasOwnProperty.call(LIMITS, k) ? LIMITS[k] : null));
    if (typeof v === "number"){
      if (!isFinite(v)) o[k] = 0;
      else if (lim) o[k] = Math.min(lim[1], Math.max(lim[0], v));
      else o[k] = Math.min(1e5, Math.max(-1e5, v));
    } else if (typeof v === "string" && v.length > 4000) o[k] = v.slice(0, 4000);
    // paint steps have their own checks (cleanPaint): a stripe "width" is not an object's width
    else if (v && typeof v === "object") stripDangerous(v, depth+1, Array.isArray(o) ? parent : k, free || k === "paint");
  }
  return o;
}
// a printer profile from a project file or from this browser's memory
function cleanPrinter(pr){
  const d = DEFAULTS().printer, P = pr && typeof pr === "object" ? pr : {}, num = (v, lo, hi, fb) => Math.min(hi, Math.max(lo, cleanNum(v, fb)));
  const bed = Array.isArray(P.bed) ? P.bed.slice(0,3) : d.bed;
  return { model: encHas(PRINTERS, P.model) ? P.model : "Custom",
    bed: [0,1,2].map(i => num(bed[i], 50, 1000, d.bed[i])),
    nozzle: num(P.nozzle, 0.1, 1.2, d.nozzle), layer: num(P.layer, 0.04, 0.6, d.layer),
    colors: Math.round(num(P.colors, 1, 16, d.colors)), flow: num(P.flow, 1, 60, d.flow),
    currency: cleanStr(P.currency, 4, "").replace(/[<>&"']/g, ""),
    overhang: num(P.overhang, 20, 80, d.overhang), bridge: num(P.bridge, 0, 60, d.bridge) };
}
// paint steps from a project file: known kinds only, colours as filament numbers, points capped
function cleanPaint(P0){
  const P = P0 && typeof P0 === "object" ? P0 : {}, one = (v, list) => list.includes(v) ? v : list[0];
  const num = (v, lo, hi, fb) => Math.min(hi, Math.max(lo, cleanNum(v, fb)));
  const slot = (v, keep) => Number.isInteger(v) && v >= 0 && v < MAX_SLOTS ? v : (keep ? PAINT_LEAVE : 0);
  const slotOrKeep = v => v === PAINT_LEAVE ? PAINT_LEAVE : slot(v, true);
  const slots = (a, max) => (Array.isArray(a) ? a : []).slice(0, max || 8).map(slotOrKeep);
  const v3 = a => Array.isArray(a) && a.length === 3 && a.every(x => typeof x === "number" && isFinite(x)) ? a.map(x => Math.min(1e4, Math.max(-1e4, x))) : null;
  let budget = 100000;
  const ops = (Array.isArray(P.ops) ? P.ops : []).slice(0, 400).map(o => {
    if (!o || typeof o !== "object") return null;
    switch (o.k){
      case "height": { const sl = slots(o.slots, 8); if (sl.length < 2) return null;
        return { k:"height", slots:sl, cuts:(Array.isArray(o.cuts) ? o.cuts : []).slice(0, sl.length - 1).map(h => num(h, -1000, 1000, 0)).concat(Array(Math.max(0, sl.length - 1 - (Array.isArray(o.cuts) ? o.cuts.length : 0))).fill(0)) }; }
      case "stripes": return { k:"stripes", slot:slot(o.slot), gap:slotOrKeep(o.gap), from:num(o.from, -1000, 1000, 0), to:num(o.to, -1000, 1000, 10), every:num(o.every, 0.4, 500, 5), width:num(o.width, 0.2, 500, 2) };
      case "dir": return { k:"dir", up:slotOrKeep(o.up), side:slotOrKeep(o.side), down:slotOrKeep(o.down), angle:num(o.angle, 1, 89, 30) };
      case "gradient": { const from = num(o.from, -1000, 1000, 0); return { k:"gradient", a:slot(o.a), b:slot(o.b), from, to:Math.max(from + 0.4, num(o.to, -1000, 1000, from + 10)), ends:o.ends !== false }; }
      case "swap": return { k:"swap", from:slot(o.from), to:slot(o.to) };
      case "shells": return { k:"shells", slots:slots(o.slots).filter(v => v !== PAINT_LEAVE) };
      case "regions": return { k:"regions", slots:slots(o.slots).filter(v => v !== PAINT_LEAVE), angle:num(o.angle, 1, 89, 30) };
      case "noise": return { k:"noise", slots:slots(o.slots).filter(v => v !== PAINT_LEAVE), scale:num(o.scale, 0.5, 200, 12), seed:Math.round(num(o.seed, 0, 99999, 1)) };
      case "picture": return { k:"picture", item:Math.round(num(o.item, 0, 59, 0)), dir:one(o.dir, ["front","back","left","right","top"]), scale:num(o.scale, 10, 400, 100),
        dx:num(o.dx, -1000, 1000, 0), dy:num(o.dy, -1000, 1000, 0), facing:o.facing !== false };
      case "brush": { const pts = (Array.isArray(o.pts) ? o.pts : []).slice(0, Math.min(5000, budget)).map(v3).filter(Boolean); budget -= pts.length;
        return pts.length ? { k:"brush", slot:slotOrKeep(o.slot), r:num(o.r, 0.2, 50, 3), facing:v3(o.facing), pts, mirror:o.mirror === true } : null; }
      case "fill": { const pt = v3(o.p); return pt ? { k:"fill", p:pt, slot:slotOrKeep(o.slot), same:o.same === true, angle:num(o.angle, 1, 89, 30) } : null; }
      default: return null;
    }
  }).filter(Boolean);
  return { on:P.on !== false, detail:one(P.detail, ["auto","coarse","normal","fine"]), part:Math.round(num(P.part, -1, 200, -1)), ops };
}

    if (el.matches(".field")){
      const lab = el.querySelector("label"), num = el.querySelector("input[type=number]"), sel = el.querySelector("select"), txt = el.querySelector("input.txt");
      bits.push((lab ? lab.textContent : "") + ": " + (num ? num.value : sel ? (sel.selectedOptions[0] || {}).textContent || "" : txt ? txt.value : "") + ".");
      const sub = el.querySelector(".sub"); if (sub && sub.textContent) bits.push(sub.textContent);
    } else if (el.matches(".check")) bits.push(el.textContent.trim() + (el.querySelector("input").checked ? ": on." : ": off."));
    else bits.push(el.textContent.trim());
  });
  speak(bits.join(" "));
}
function openEasyReading(){
  openModal("Easy reading", b => {
    note(b, "Make the app bigger and clearer. These settings stay in this browser for every project.");

    segField(b, [["1","Normal"],["1.15","Large"],["1.3","Larger"],["1.5","Huge"],["1.75","Biggest"]], () => String(prefs.ui), v => { prefs.ui = +v; savePrefs(); applyPrefs(); openEasyReading(); }, "five");
    b.insertAdjacentHTML("beforeend", `<h2>Contrast</h2>`);
    segField(b, [["normal","Normal"],["high","High contrast"]], () => prefs.contrast, v => { prefs.contrast = v; savePrefs(); applyPrefs(); makeBed(); openEasyReading(); }, "two");
    b.insertAdjacentHTML("beforeend", `<h2>Letters</h2>`);
    segField(b, [["normal","Normal"],["clear","Extra clear letters"]], () => prefs.font, v => { prefs.font = v; savePrefs(); applyPrefs(); openEasyReading(); }, "two");
    note(b, "Extra clear letters use Atkinson Hyperlegible, a font drawn for people with low vision (loaded from Google Fonts).");
    b.insertAdjacentHTML("beforeend", `<h2>Messages</h2>`);
    segField(b, [["1","Normal time"],["2","Twice as long"],["4","Until I click"]], () => String(prefs.notice), v => { prefs.notice = +v; savePrefs(); openEasyReading(); });
    checkField(b, "Read messages aloud", () => prefs.speak, v => { prefs.speak = v; savePrefs(); });
    checkField(b, "Less movement (no animations)", () => prefs.motion === "reduce", v => { prefs.motion = v ? "reduce" : "auto"; savePrefs(); applyPrefs(); });
    buttonRow(b, [["🔊 Read this page aloud", () => { $("#modal").hidden = true; speakPage(); }], ["Back to normal", () => { prefs = Object.assign({}, PREFS_DEFAULT); savePrefs(); applyPrefs(); openEasyReading(); }]]);
    note(b, "Your browser's own zoom (Ctrl and +) makes everything bigger too, including the 3D view.");
  });
}
$("#easyBtn").onclick = openEasyReading;
$("#readBtn").onclick = () => { if ("speechSynthesis" in window && speechSynthesis.speaking){ speechSynthesis.cancel(); return; } speakPage(); };
$("#notice").addEventListener("click", () => $("#notice").classList.remove("show"));

function applyTheme(){
  const t = state.view.theme;
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  makeBed();
}
$("#themeBtn").onclick = ()=>{
  state.view.theme = state.view.theme === "auto" ? "light" : state.view.theme === "light" ? "dark" : "auto";
  applyTheme(); notify("Theme: "+state.view.theme); pushHistory();
};
document.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  const k = e.key.toLowerCase();
  if ((e.ctrlKey||e.metaKey) && k === "z"){ if (typing) return; e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if ((e.ctrlKey||e.metaKey) && k === "y"){ if (typing) return; e.preventDefault(); redo(); }
  else if ((e.ctrlKey||e.metaKey) && k === "s"){ e.preventDefault(); saveProjectFile(); }
  else if (!typing && (k === "delete" || k === "backspace")){ if (state.items[state.active]){ e.preventDefault(); removeItem(); } }
  else if (!typing && ["arrowleft","arrowright","arrowup","arrowdown"].includes(k)){
    const d = state.items[state.active]; if (!d) return;
    e.preventDefault();
    const step = e.shiftKey ? 2 : 0.5;
    if (k === "arrowleft") d.offU -= step; else if (k === "arrowright") d.offU += step;
    else if (k === "arrowup") d.offV += step; else d.offV -= step;
    d.solids = null; schedule(); pushHistory();
    if (tab === "art") renderTab();
  }
});
$("#undoBtn").onclick = undo; $("#redoBtn").onclick = redo;
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", ()=>makeBed());

/* automation handle: used by tools-smoke-test.js, handy in the console too */
window.MakerForge = {
  get state(){ return state; },
  get parts(){ return modelParts; },
  get checks(){ return lastChecks; },
  get rev(){ return buildRev; },
  get busy(){ return busy || queued; },
  get tracer(){ return tracerInfo; },
  get enclosure(){ return enclosureInfo; },
  get cutouts(){ return CUTOUTS; }, newOpening, openingRings, lensMinHole, buildEnclosure, get bedHelper(){ return bedHelper; },
  get jigsaw(){ return jigsawInfo; },
  get lithophane(){ return lithoInfo; },
  get print(){ return printFresh() ? printInfo : null; },
  printNow: runPrintability, optimize: optimizePrint, revertOptimize, exportParts,
  // the painter, for the tests: its tool settings, a repaint now, the last result, a model import and the zip
  paint: { ui: paintUI, repaint: () => repaint(true), get info(){ return paintInfo; }, importModel: importModelFile, buildZip,
    hit: paintHit, get prefs(){ return prefs; }, applyPrefs, findDefault, cleanPaint },
  phone: { spec: phoneSpec, get info(){ return phoneInfo; }, list: PHONES },
  get overlay(){ return overlay.children.length; },
  rebuild: rebuildAll,
  get camera(){ return camera; }, get controls(){ return controls; }, shareLink: makeShareLink,
  get measure(){ return measurePts.map(q => q.toArray().map(v => +v.toFixed(3))); },
  get defaults(){ return DEFAULTS().base; },
  render: renderTab,
  notify,
  core: C
};

(async function init(){
  applyTheme(); renderTab(); renderStarts(); makeBed();
  logLine(`Maker Forge ${APP_VERSION} ready`);
  let restored = false;
  try {
    const raw = localStorage.getItem("makerforge.project");
    if (raw) restored = await loadProject(JSON.parse(raw));
  } catch(e){}
  if (!restored){ applyPrinterPref(state); makeBed(); await rebuildAll(true); }
  history.past.push(serialize()); updateHistoryButtons();
  // a share link opens on top of what was there, which Undo brings back
  const shared = await readShareLink();
  if (shared && await loadProject(shared)){
    history.past.push(serialize()); updateHistoryButtons(); saveLocal();
    try { window.history.replaceState(null, "", location.pathname + location.search); } catch(e){}
    notify("Opened a shared project. Undo takes you back to what you had before.");
  }
})();
})();
