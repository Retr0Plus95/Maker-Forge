<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maker Forge — multi-colour 3D print studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Pacifico&family=Great+Vibes&family=Caveat:wght@700&family=Satisfy&family=Sacramento&family=Parisienne&family=Gloria+Hallelujah&family=Shadows+Into+Light&family=Permanent+Marker&family=Rock+Salt&family=Kalam:wght@700&family=Amatic+SC:wght@700&family=Chewy&family=Luckiest+Guy&family=Titan+One&family=Bungee&family=Righteous&family=Baloo+2:wght@800&family=Fredoka:wght@600&family=Comfortaa:wght@700&family=Nunito:wght@800&family=Poppins:wght@800&family=Manrope:wght@800&family=Lobster&family=Alfa+Slab+One&family=Anton&family=Oswald:wght@700&family=Bebas+Neue&family=Secular+One&family=Playfair+Display:wght@700&family=Cinzel:wght@700&family=Orbitron:wght@800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f5; --panel:#ffffff; --panel2:#f4f6f9; --ink:#141b24; --muted:#63707f; --line:#e2e7ee;
  --accent:#1f6f8b; --accent-ink:#ffffff; --accent-soft:#e6f1f5;
  --stage-top:#e6eaef; --stage-bot:#ccd4dd; --field:#ffffff;
  --danger:#b2402b; --warn:#8a6100; --good:#1f7a55;
  --r:12px; --shadow:0 1px 2px rgba(16,24,32,.06), 0 8px 24px rgba(16,24,32,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1319; --panel:#161d25; --panel2:#1b232c; --ink:#e8eef4; --muted:#93a2b1; --line:#27313b;
    --accent:#6dbcd6; --accent-ink:#0a1015; --accent-soft:#1b2b33;
    --stage-top:#19212a; --stage-bot:#0b1014; --field:#121921;
    --danger:#f08a72; --warn:#ddb45f; --good:#77c9a3;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 26px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1319; --panel:#161d25; --panel2:#1b232c; --ink:#e8eef4; --muted:#93a2b1; --line:#27313b;
  --accent:#6dbcd6; --accent-ink:#0a1015; --accent-soft:#1b2b33;
  --stage-top:#19212a; --stage-bot:#0b1014; --field:#121921;
  --danger:#f08a72; --warn:#ddb45f; --good:#77c9a3;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 26px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Manrope","Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:388px 1fr;height:100vh}

/* shell: top bar with the section tabs, options on the left, model in the middle, "start from" on the right */
.app{display:grid;grid-template-columns:60px 340px 1fr 262px;grid-template-rows:56px 1fr;height:100vh;background:var(--bg)}
.app.no-left{grid-template-columns:60px 0 1fr 262px}
.app.no-right{grid-template-columns:60px 340px 1fr 0}
.app.no-left.no-right{grid-template-columns:60px 0 1fr 0}
/* icon rail: one small icon per group of settings; the pop-up panel shows that group */
.secrail{grid-row:2;grid-column:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;
  background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;z-index:3}
.secrail button{position:relative;width:42px;height:42px;border:none;background:none;border-radius:12px;cursor:pointer;
  color:var(--muted);font-size:16px;font-weight:800;display:grid;place-items:center;transition:background .12s,color .12s}
.secrail button:hover{background:var(--panel2);color:var(--ink)}
.secrail button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.secrail button .tip{position:absolute;left:50px;top:50%;transform:translateY(-50%);white-space:nowrap;pointer-events:none;
  background:var(--ink);color:var(--panel);font-size:12px;font-weight:600;padding:5px 9px;border-radius:7px;opacity:0;
  transition:opacity .12s;z-index:20}
.secrail button:hover .tip,.secrail button:focus-visible .tip{opacity:1}
.secrail .sep{width:26px;height:1px;background:var(--line);margin:4px 0}
.sechelp{margin:0 16px 6px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--ink);font-size:12.5px;line-height:1.45}
.sechelp b{display:block;margin-bottom:2px}
.section[hidden]{display:none}
.appbar{grid-column:1/-1;position:relative;display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--panel);
  border-bottom:1px solid var(--line);z-index:5}
.appbar .grow{flex:1}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;letter-spacing:-0.01em;margin-right:10px}
.logo svg{display:block}
.ver{font-size:10.5px;font-weight:700;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
.toptabs{display:flex;gap:3px;padding:4px;background:var(--panel2);border-radius:12px}
.toptabs button{border:none;background:none;border-radius:9px;padding:7px 14px;cursor:pointer;color:var(--muted);
  font-weight:700;font-size:13px;display:flex;align-items:center;gap:7px}
.toptabs button .ico{font-size:14px}
.toptabs button:hover{color:var(--ink)}
.toptabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.rail-icon{width:32px;height:32px;border:1px solid var(--line);background:var(--field);border-radius:9px;cursor:pointer;
  color:var(--muted);display:grid;place-items:center;font-size:14px;flex:none}
.rail-icon:hover:not(:disabled){color:var(--ink);border-color:var(--muted)}
.rail-icon:disabled{opacity:.3;cursor:default}
.progress{position:absolute;left:0;right:0;bottom:-2px;height:3px;overflow:hidden;opacity:0;transition:opacity .2s}
.progress.on{opacity:1}
.progress span{position:absolute;top:0;bottom:0;width:30%;background:var(--accent);border-radius:3px;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{left:-30%}100%{left:100%}}
.sheet{grid-row:2;grid-column:2;display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);
  border-right:1px solid var(--line);overflow:hidden}
.starts{grid-row:2;grid-column:4;display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);
  border-left:1px solid var(--line);overflow:hidden}
#startsBody{flex:1;overflow-y:auto;padding:4px 12px 16px}
.sheet-head{display:flex;align-items:flex-start;gap:8px;padding:14px 16px 6px}
.sheet-head > div{flex:1;min-width:0}
.sheet-head h2{margin:0;font-size:16px;font-weight:800;text-transform:none;color:var(--ink)}
.sheet-head p{margin:2px 0 0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#panel{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 16px 18px}
.sheet-foot{padding:9px 14px;border-top:1px solid var(--line);background:var(--panel2)}
.dock-status{font-size:12.5px;color:var(--muted)}
.dock-status b{color:var(--ink);font-variant-numeric:tabular-nums}
.dock-status.warn b,.dock-status.warn{color:var(--warn)}
.dock-status.bad b,.dock-status.bad{color:var(--danger)}
.stage{grid-row:2;grid-column:3;position:relative;background:radial-gradient(120% 90% at 55% 0%, var(--stage-top), var(--stage-bot));min-width:0;overflow:hidden}
#view{position:absolute;inset:0}
#view canvas{display:block;touch-action:none}
.edgebtn{position:absolute;top:14px;z-index:3}
.hudpills{position:absolute;left:14px;top:14px;display:flex;flex-wrap:wrap;gap:6px;z-index:2;max-width:calc(100% - 28px)}
.hudpills.below{top:60px}
.pill{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:999px;padding:5px 12px;
  font-size:12px;font-weight:600;white-space:nowrap;box-shadow:var(--shadow)}
.pill b{font-variant-numeric:tabular-nums}
.pill.warn{color:var(--warn);border-color:var(--warn)} .pill.bad{color:var(--danger);border-color:var(--danger)}
.viewtools{position:absolute;right:14px;top:14px;display:flex;gap:2px;align-items:center;
  background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:999px;padding:4px;
  box-shadow:var(--shadow);backdrop-filter:blur(8px);z-index:2}
.viewtools button{border:none;background:none;border-radius:999px;width:32px;height:30px;cursor:pointer;color:var(--muted);font-size:14px}
.viewtools button:hover{color:var(--ink);background:var(--panel2)}
.viewtools button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.viewtools .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
.explode{position:absolute;right:14px;bottom:48px;display:flex;align-items:center;gap:9px;
  background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:999px;padding:7px 14px;
  font-size:12.5px;font-weight:600;box-shadow:var(--shadow);z-index:2}
.explode input{accent-color:var(--accent);width:92px}
.explode.section{right:auto;left:14px}
.explode.section b{font-variant-numeric:tabular-nums;min-width:58px;text-align:right}
.notice{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);max-width:min(520px,calc(100% - 80px));
  background:var(--ink);color:var(--panel);padding:11px 16px;border-radius:12px;font-weight:600;font-size:13px;
  opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:var(--shadow);z-index:4}
.notice.show{opacity:1;pointer-events:auto;cursor:pointer}
.statusbar{position:absolute;left:0;right:0;bottom:0;z-index:3}
.statusline{display:block;width:100%;text-align:left;border:none;border-top:1px solid var(--line);
  background:color-mix(in srgb,var(--panel) 94%,transparent);padding:7px 14px;font-size:12px;color:var(--muted);cursor:pointer;
  font-family:ui-monospace,Menlo,Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statusline::before{content:"●";color:var(--good);margin-right:8px}
.statusline.busy::before{color:var(--accent);animation:pulse 0.9s ease-in-out infinite}
@keyframes pulse{50%{opacity:.2}}
.log{max-height:180px;overflow-y:auto;background:var(--panel);border-top:1px solid var(--line);padding:6px 14px;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:var(--muted)}
.log div{padding:2px 0;border-bottom:1px dashed var(--line)}
.log time{color:var(--accent);margin-right:8px}
.objcat{margin:14px 0 6px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.objgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.objcard{border:1px solid var(--line);background:var(--field);border-radius:11px;padding:9px 6px;cursor:pointer;
  display:grid;gap:4px;justify-items:center;text-align:center;font-weight:600;font-size:11.5px;line-height:1.2;color:var(--ink);
  transition:transform .12s, border-color .12s}
.objcard:hover{border-color:var(--accent);transform:translateY(-1px)}
.objcard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.objcard .em{font-size:20px}
.modal{position:fixed;inset:0;background:rgba(10,14,18,.45);display:grid;place-items:center;z-index:50;padding:20px}
.modal[hidden]{display:none}
.modal-card{width:min(520px,100%);max-height:85vh;overflow:auto;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;box-shadow:var(--shadow);padding:16px 18px 18px;animation:pop .16s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.modal-card header{display:flex;align-items:center;margin-bottom:6px}
.modal-card header h2{flex:1;margin:0;font-size:17px;text-transform:none;color:var(--ink)}
.drop.loading{pointer-events:none}
.drop.loading strong::after{content:"";display:inline-block;width:12px;height:12px;margin-left:8px;border-radius:50%;
  border:2px solid var(--accent);border-right-color:transparent;animation:spin .7s linear infinite;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}

/* colour chips, font list, charm picker */
.slotchips{display:flex;flex-wrap:wrap;gap:6px}
.slotchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--field);
  border-radius:999px;padding:5px 11px 5px 6px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted)}
.slotchip .dot{width:15px;height:15px;border-radius:50%;border:1px solid rgba(0,0,0,.25);flex:none}
.slotchip .nm{max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slotchip[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.fontlist{max-height:230px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;background:var(--field);padding:4px}
.fontrow{display:block;width:100%;text-align:left;border:none;background:none;border-radius:8px;padding:7px 10px;
  cursor:pointer;font-size:21px;line-height:1.25;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fontrow:hover{background:var(--panel2)}
.fontrow[aria-pressed="true"]{background:var(--accent-soft);outline:1px solid var(--accent)}
.symtabs{display:flex;gap:4px;margin-bottom:6px}
.symtab{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:4px 10px;cursor:pointer;
  font-size:11.5px;font-weight:700;color:var(--muted)}
.symtab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.symgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:7px}
.sym{border:1px solid var(--line);background:var(--field);border-radius:9px;padding:6px 0;cursor:pointer;font-size:19px;line-height:1}
.sym[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.symin{font-size:15px}
.card.step{background:var(--panel);padding:12px 13px 10px}
.stephead{display:flex;align-items:center;gap:9px;margin-bottom:2px}
.stepnum{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;
  font-size:12px;font-weight:800;flex:none}
.tracepreview{display:block;width:100%;height:auto;border-radius:9px;border:1px solid var(--line);margin-top:8px;
  background:repeating-conic-gradient(var(--panel2) 0% 25%,var(--panel) 0% 50%) 0 0/14px 14px}

/* content blocks */
h2{margin:18px 0 6px;font-size:13px;font-weight:800;color:var(--ink)}
h2:first-child{margin-top:10px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;margin:8px 0}
details.group{border:1px solid var(--line);border-radius:var(--r);margin:10px 0;background:var(--panel2);overflow:hidden}
details.group>summary{cursor:pointer;padding:10px 13px;font-weight:700;font-size:13px;list-style:none;display:flex;align-items:center;gap:8px}
details.group>summary::-webkit-details-marker{display:none}
details.group>summary::after{content:"▾";margin-left:auto;color:var(--muted);font-size:11px;transition:transform .15s}
details.group[open]>summary::after{transform:rotate(180deg)}
details.group>summary:hover{color:var(--accent)}
details.group .body{padding:2px 13px 12px}
.field{display:grid;grid-template-columns:1fr auto auto;gap:2px 8px;align-items:center;margin:11px 0}
.field>label{grid-column:1}
.field>input[type=number]{grid-column:3;grid-row:1}
.field:first-child{margin-top:4px}
.field.full{grid-template-columns:1fr}
.field label{font-weight:600;font-size:13px;color:var(--ink)}
.field input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent);margin:2px 0 0;height:18px}
.field input[type=number]{width:66px;padding:3px 6px;border:1px solid var(--line);border-radius:7px;background:var(--field);
  text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px}
.field .sub{grid-column:1/-1;color:var(--muted);font-size:12.5px;margin-top:0}
select.sel,input.txt,textarea.ta{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--field)}
select.sel{cursor:pointer}
textarea.ta{resize:vertical;min-height:52px;font-size:13px}
.btn{appearance:none;border:1px solid var(--line);background:var(--field);border-radius:9px;padding:8px 13px;cursor:pointer;
  font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow)}
.btn.primary:hover:not(:disabled){filter:brightness(1.07)}
.btn.wide{width:100%}
.btn.small{padding:6px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:8px 0}
.gallery button{border:1px solid var(--line);background:var(--field);border-radius:10px;padding:10px 6px;cursor:pointer;
  font-weight:600;font-size:12px;display:grid;gap:4px;justify-items:center;text-align:center;line-height:1.25}
.gallery button:hover{border-color:var(--accent);background:var(--accent-soft)}
.gallery .em{font-size:19px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:9px 0;padding:4px;background:var(--panel);
  border:1px solid var(--line);border-radius:10px}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg.four{grid-template-columns:repeat(4,1fr)}
.seg button{border:none;background:none;border-radius:7px;padding:7px 4px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.check{display:flex;gap:9px;align-items:center;margin:11px 0;font-weight:600;font-size:13px;cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}
.drop{display:flex;align-items:center;justify-content:center;border:1.5px dashed var(--line);border-radius:var(--r);
  padding:18px 14px;cursor:pointer;color:var(--muted);text-align:center;background:var(--panel2);margin-top:10px}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.drop strong{color:var(--ink);display:block;font-size:13.5px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.items{list-style:none;margin:10px 0 0;padding:0;display:flex;gap:8px;flex-wrap:wrap}
.items button.thumb{width:52px;height:52px;border-radius:10px;border:2px solid var(--line);padding:0;overflow:hidden;
  background:var(--field);cursor:pointer;display:block}
.items button.thumb[aria-pressed="true"]{border-color:var(--accent);box-shadow:var(--shadow)}
.items img{width:100%;height:100%;object-fit:contain;display:block}
.items button.thumb{position:relative}
.items button.thumb.off img{opacity:.3;filter:grayscale(1)}
.items .badge{position:absolute;right:3px;bottom:3px;font-size:9.5px;font-weight:800;padding:1px 5px;border-radius:999px;
  background:var(--accent);color:var(--accent-ink);text-transform:uppercase;letter-spacing:.03em}
.items button.thumb.off .badge{background:var(--muted);color:var(--panel)}
.preview-wrap{border-radius:var(--r);overflow:auto;border:1px solid var(--line);margin-top:8px;max-height:320px;text-align:center;
  background:repeating-conic-gradient(var(--panel2) 0% 25%,var(--panel) 0% 50%) 0 0/16px 16px}
.preview-wrap canvas{display:inline-block;cursor:crosshair;max-width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 11px 5px 6px;
  background:var(--field);cursor:pointer;font-size:12.5px;font-weight:600}
.chip .sw{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.25)}
.chip[aria-pressed="true"]{text-decoration:line-through;opacity:.45}
.slot{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);
  border-radius:10px;background:var(--field);margin-bottom:7px}
.slot input[type=color]{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--field);cursor:pointer}
.slot .meta{display:grid;gap:4px;min-width:0}
.slot input[type=text]{width:100%;padding:4px 6px;border:1px solid transparent;border-radius:6px;background:none;font-weight:700;font-size:13px}
.slot input[type=text]:hover,.slot input[type=text]:focus{border-color:var(--line);background:var(--panel2)}
.slot .sub{display:flex;gap:5px;align-items:center}
.slot select{padding:3px 5px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);font-size:11.5px}
.slot input[type=number]{width:54px;padding:3px 5px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);
  text-align:right;font-size:11.5px}
.swatches{display:flex;gap:4px;align-items:center}
.pal{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--field);
  margin-bottom:6px;cursor:pointer;width:100%;text-align:left;font-weight:600;font-size:12.5px}
.pal:hover{border-color:var(--accent)}
.pal .sw{width:18px;height:18px;border-radius:5px;border:1px solid rgba(0,0,0,.2)}
.pal .grow{flex:1}
.result{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  margin-bottom:6px;background:var(--field);font-size:13px}
.result .dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px}
.result.ok .dot{background:var(--good)} .result.warn .dot{background:var(--warn)} .result.bad .dot{background:var(--danger)}
.result b{display:block;font-size:13px}
.result span.s{color:var(--muted);font-size:12.5px}
table.stats{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
table.stats th{text-align:left;padding:5px 6px;color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em}
table.stats td{text-align:left;padding:6px;border-top:1px solid var(--line)}
table.stats td.n{text-align:right;font-variant-numeric:tabular-nums}
table.stats tr.total td{font-weight:800}
.sw-inline{display:inline-block;width:10px;height:10px;border-radius:3px;border:1px solid rgba(0,0,0,.25);margin-right:6px}
.hint{color:var(--muted);font-size:13px;line-height:1.5;margin:8px 0 0}
.hint b{color:var(--ink)}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:18px 10px}

code{background:var(--panel2);padding:1px 5px;border-radius:5px;font-size:12px}
kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:11.5px;font-weight:700}

/* ---- colour painter (Session 13) ---- */
.palette{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 4px}
.pswatch{position:relative;width:46px;height:46px;border-radius:12px;border:2px solid var(--line);background:var(--field);padding:4px;cursor:pointer;display:grid;place-items:center}
.pswatch .sw{width:100%;height:100%;border-radius:8px;border:1px solid rgba(0,0,0,.25)}
.pswatch .num{position:absolute;right:3px;bottom:2px;font-size:12px;font-weight:800;color:#fff;text-shadow:0 0 3px #000,0 0 2px #000}
.pswatch[aria-checked="true"]{border-color:var(--ink);box-shadow:0 0 0 3px var(--accent)}
.pswatch.add{font-size:22px;font-weight:700;color:var(--muted)}
.pchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 5px;margin:0 6px 6px 0;background:var(--field);font-size:12.5px;font-weight:700}
.pchip .sw{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.25)}
button.pchip{cursor:pointer}
button.pchip.toggle[aria-pressed="false"]{opacity:.5;text-decoration:line-through}
.psum .sub{color:var(--muted);font-size:12.5px;margin-top:4px}
.methods{display:grid;gap:6px;margin:8px 0}
.method{display:grid;gap:2px;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--field);padding:9px 11px;cursor:pointer}
.method b{font-size:13.5px}
.method span{color:var(--muted);font-size:12.5px;line-height:1.4}
.method[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.oprow{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--field);padding:8px 10px;margin:6px 0}
.oprow .grow{flex:1;min-width:0}
.oprow small{color:var(--muted)}
.seg.five{grid-template-columns:repeat(5,1fr)}
/* reset a setting to its default */
.field .reset{grid-column:2;grid-row:1;justify-self:end;border:none;background:none;color:var(--accent);cursor:pointer;font-size:12px;font-weight:700;padding:2px 4px;border-radius:6px}
.field .reset:hover{background:var(--accent-soft)}
.pagereset{margin-top:16px}
/* ---- easy reading (Session 13): bigger text and controls, stronger contrast, a clearer font ---- */
:root{--ui:1}
.app{grid-template-columns:calc(60px*var(--ui)) calc(340px*var(--ui)) 1fr calc(262px*var(--ui));grid-template-rows:calc(56px*var(--ui)) 1fr}
.app.no-left{grid-template-columns:calc(60px*var(--ui)) 0 1fr calc(262px*var(--ui))}
.app.no-right{grid-template-columns:calc(60px*var(--ui)) calc(340px*var(--ui)) 1fr 0}
.app.no-left.no-right{grid-template-columns:calc(60px*var(--ui)) 0 1fr 0}
.appbar,.secrail,.sheet,.starts,.modal-card,.stage .viewtools,.stage .hudpills,.stage .explode,.stage .notice,.stage .statusbar{zoom:var(--ui)}
:root[data-contrast="high"]{--muted:#2b3642;--line:#6b7887;--accent:#0b4f68;--accent-soft:#d8ecf4}
@media (prefers-color-scheme: dark){ :root[data-contrast="high"]:not([data-theme="light"]){--ink:#ffffff;--muted:#d4dde6;--line:#8193a5;--accent:#8fd3ea;--accent-soft:#1d3a47} }
:root[data-contrast="high"][data-theme="dark"]{--ink:#ffffff;--muted:#d4dde6;--line:#8193a5;--accent:#8fd3ea;--accent-soft:#1d3a47}
:root[data-contrast="high"] .hint,:root[data-contrast="high"] .field .sub,:root[data-contrast="high"] .method span{font-weight:600}
:root[data-contrast="high"] :focus-visible{outline:3px solid var(--accent);outline-offset:3px}
:root[data-contrast="high"] .seg button[aria-pressed="true"],:root[data-contrast="high"] .toptabs button[aria-selected="true"]{outline:2px solid var(--ink)}
:root[data-font="clear"] body,:root[data-font="clear"] button,:root[data-font="clear"] input,:root[data-font="clear"] select,:root[data-font="clear"] textarea{font-family:"Atkinson Hyperlegible","Verdana",system-ui,sans-serif;letter-spacing:.01em}
:root[data-motion="reduce"] *{transition:none!important;animation:none!important}
.readaloud{float:right;margin:-2px 0 0 8px;border:1px solid var(--line);background:var(--field);border-radius:8px;cursor:pointer;font-size:13px;padding:2px 7px}
@media (max-width:1100px){
  .app{grid-template-columns:calc(60px*var(--ui)) calc(320px*var(--ui)) 1fr 0}
  .app.no-left{grid-template-columns:calc(60px*var(--ui)) 0 1fr 0}
  .starts{display:none}
}
@media (max-width:760px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;grid-template-rows:auto 48vh auto auto}
  .appbar{flex-wrap:wrap;padding:8px 10px;gap:6px}
  .toptabs{max-width:100%;overflow-x:auto;scrollbar-width:none}
  .toptabs button{padding:7px 10px}
  .toptabs .ico{display:none}
  .stage{grid-row:2;grid-column:1}
  .secrail{grid-row:3;grid-column:1;flex-direction:row;overflow-x:auto;border-right:none;border-top:1px solid var(--line);padding:6px}
  .secrail button .tip{display:none}
  .sheet{grid-row:4;grid-column:1;border-right:none;border-top:1px solid var(--line)}
  #panel{overflow:visible}
  .explode,.hudpills{display:none}
  .viewtools{left:8px;right:8px;top:8px;justify-content:space-between;overflow-x:auto;scrollbar-width:none}
  .viewtools button{width:28px;flex:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<div class="app">
  <header class="appbar">
    <div class="logo" aria-label="Maker Forge">
      <!-- Maker Forge mark: printed layers stacking up into a tapered nozzle, with a fresh bead of filament -->
      <svg viewBox="0 0 32 32" width="28" height="28" role="img" aria-hidden="true">
        <rect x="1" y="1" width="30" height="30" rx="9" fill="var(--accent)"/>
        <rect x="6.5" y="7" width="19" height="4" rx="2" fill="var(--accent-ink)"/>
        <rect x="9" y="12.5" width="14" height="4" rx="2" fill="var(--accent-ink)" opacity=".85"/>
        <rect x="11.5" y="18" width="9" height="4" rx="2" fill="var(--accent-ink)" opacity=".7"/>
        <path d="M14 23.5h4l-2 3.2z" fill="var(--accent-ink)"/>
      </svg>
      <span>Maker&nbsp;Forge</span><span class="ver" id="verBadge">v0.17.0</span>
    </div>
    <nav class="toptabs" role="tablist" id="tabs"></nav>
    <div class="grow"></div>
    <button class="rail-icon" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
    <button class="rail-icon" id="redoBtn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">↷</button>
    <button class="rail-icon" id="easyBtn" title="Easy reading: bigger text, stronger contrast" aria-label="Easy reading: text size and contrast"><b style="font-size:15px">Aa</b></button>
    <button class="rail-icon" id="themeBtn" title="Light or dark" aria-label="Theme">◐</button>
    <button class="rail-icon" id="settingsBtn" title="Settings" aria-label="Settings">⚙</button>
    <button class="rail-icon" id="aboutBtn" title="About Maker Forge" aria-label="About">ⓘ</button>
    <button class="btn primary" id="dockExport">Download files</button>
    <div class="progress" id="progress" aria-hidden="true"><span></span></div>
  </header>

  <nav class="secrail" id="secrail" aria-label="Settings sections"></nav>
  <section class="sheet" id="sheet">
    <header class="sheet-head">
      <div><h2 id="sheetTitle">Make</h2><p id="crumb">Name plate</p></div>
      <button class="rail-icon" id="readBtn" title="Read this page aloud" aria-label="Read this page aloud">🔊</button>
      <button class="rail-icon" id="sheetToggle" title="Close this panel" aria-label="Close this panel">‹</button>
    </header>
    <div class="sechelp" id="sechelp" hidden></div>
    <div id="panel"></div>
    <footer class="sheet-foot"><div class="dock-status" id="dockStatus">Building…</div></footer>
  </section>

  <main class="stage">
    <div id="view" aria-label="3D preview. Drag to orbit, scroll to zoom, click the model to place the selected artwork."></div>
    <div class="hudpills"><div class="pill" id="sizePill">Size <b id="stSize">–</b></div><div class="pill" id="checkPill">–</div></div>
    <div class="viewtools">
      <button id="vAngle" title="Angled view">◱</button>
      <button id="vTop" title="From above">▣</button>
      <button id="vFront" title="From the front">▤</button>
      <button id="vBack" title="From behind">▥</button>
      <button id="vLeft" title="From the left">◧</button>
      <button id="vRight" title="From the right">◨</button>
      <button id="vBottom" title="From below">⊟</button>
      <span class="sep"></span>
      <button id="vWire" aria-pressed="false" title="Wireframe">◇</button>
      <button id="vLayout" aria-pressed="false" title="Lay the parts out as they print">⊞</button>
      <button id="vRuler" aria-pressed="true" title="Rulers and model size">📏</button>
      <button id="vMeasure" aria-pressed="false" title="Measure: click two points on the model">↔</button>
      <button id="vSection" aria-pressed="false" title="Section: cut the model open at a height">✂</button>
      <button id="vShot" title="Save a picture">◎</button>
    </div>
    <div class="explode" id="explodeBox" hidden><span>Explode</span><input type="range" id="explodeR" min="0" max="60" step="1" value="0" aria-label="Explode parts"></div>
    <div class="explode section" id="sectionBox" hidden><span>Cut at</span><input type="range" id="sectionR" min="0" max="100" step="1" value="50" aria-label="Height of the cut"><b id="sectionV"></b></div>
    <div class="notice" id="notice" role="status" aria-live="polite"></div>
    <div class="statusbar" id="statusbar">
      <button class="statusline" id="statusLine" title="Show the activity log">Ready</button>
      <div class="log" id="log" hidden></div>
    </div>
  </main>

  <aside class="starts" id="starts">
    <header class="sheet-head"><div><h2>Start from</h2><p>Pick what you want to make</p></div>
      <button class="rail-icon" id="startsToggle" title="Hide this sidebar" aria-label="Hide the start sidebar">›</button></header>
    <div id="startsBody"></div>
  </aside>
</div>

  <header><h2 id="modalTitle"></h2><button class="rail-icon" id="modalClose" aria-label="Close">✕</button></header>
  <div id="modalBody"></div></div></div>

<!-- Libraries are pinned by version and by Subresource Integrity hash: if a CDN ever served a
     different file, the browser refuses to run it. Hashes are of the npm package files. -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"
  integrity="sha384-CI3ELBVUz9XQO+97x6nwMDPosPR5XvsxW2ua7N1Xeygeh1IxtgqtCkGfQY9WWdHu" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"
  integrity="sha384-wagZhIFgY4hD+7awjQjR4e2E294y6J2HSnd8eTNc15ZubTeQeVRZwhQJ+W6hnBsf" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/earcut@2.2.4/dist/earcut.min.js"
  integrity="sha384-2H0pAXlHBLfkdkuPuERxxSBlz7fMZ2EqrwxccEG7J9Svyk1SbUDaknB5UCoel/ZX" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"
  integrity="sha384-+mbV2IY1Zk/X1p/nWllGySJSUN8uMs+gUAN10Or95UBH0fpj6GfKgPmgC5EXieXG" crossorigin="anonymous"></script>
<script>
(function (global) {
  "use strict";

  // ---------- colour ----------
  function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function rgbToHex(r, g, b) { return "#" + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join(""); }
  function colorDist(a, b) {
    const rm = (a[0] + b[0]) / 2, dr = a[0] - b[0], dg = a[1] - b[1], db = a[2] - b[2];
    return (2 + rm / 256) * dr * dr + 4 * dg * dg + (2 + (255 - rm) / 256) * db * db;
  }
  function luma(r, g, b) { return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255; }

  // k-means palette extraction from RGBA pixel data
  function kmeans(data, k) {
    const n = data.length / 4, step = Math.max(1, Math.floor(n / 8000)), pts = [];
    for (let i = 0; i < n; i += step) { const o = i * 4; if (data[o + 3] >= 128) pts.push([data[o], data[o + 1], data[o + 2]]); }
    if (!pts.length) return [];
    k = Math.min(k, pts.length);
    let first = pts[0], bl = Infinity;
    for (const p of pts) { const l = luma(p[0], p[1], p[2]); if (l < bl) { bl = l; first = p; } }
    const cents = [first.slice()], dmin = pts.map(p => colorDist(p, first));
    while (cents.length < k) {
      let bi = 0, bd = -1;
      for (let i = 0; i < pts.length; i++) if (dmin[i] > bd) { bd = dmin[i]; bi = i; }
      const c = pts[bi].slice(); cents.push(c);
      for (let i = 0; i < pts.length; i++) { const d = colorDist(pts[i], c); if (d < dmin[i]) dmin[i] = d; }
    }
    const asg = new Int32Array(pts.length);
    for (let it = 0; it < 16; it++) {
      for (let i = 0; i < pts.length; i++) {
        let bj = 0, bd = Infinity;
        for (let j = 0; j < k; j++) { const d = colorDist(pts[i], cents[j]); if (d < bd) { bd = d; bj = j; } }
        asg[i] = bj;
      }
      const sum = cents.map(() => [0, 0, 0, 0]);
      for (let i = 0; i < pts.length; i++) { const s = sum[asg[i]]; s[0] += pts[i][0]; s[1] += pts[i][1]; s[2] += pts[i][2]; s[3]++; }
      for (let j = 0; j < k; j++) if (sum[j][3]) cents[j] = [sum[j][0] / sum[j][3], sum[j][1] / sum[j][3], sum[j][2] / sum[j][3]];
    }
    return cents.sort((a, b) => luma(b[0], b[1], b[2]) - luma(a[0], a[1], a[2]));
  }

  // Map each grid cell to a filament slot (-1 = left out)
  function buildCellMap(img, slotsRgb, skip, smooth) {
    const gx = img.width, gy = img.height, N = gx * gy, d = img.data;
    let idx = new Int8Array(N); const lum = new Float32Array(N);
    for (let k = 0; k < N; k++) {
      const o = k * 4, px = [d[o], d[o + 1], d[o + 2]];
      lum[k] = luma(px[0], px[1], px[2]);
      if (d[o + 3] < 128) { idx[k] = -1; continue; }
      let bs = 0, bd = Infinity;
      for (let s = 0; s < slotsRgb.length; s++) { const dd = colorDist(px, slotsRgb[s]); if (dd < bd) { bd = dd; bs = s; } }
      idx[k] = skip[bs] ? -1 : bs;
    }
    for (let it = 0; it < smooth; it++) {
      const nx = new Int8Array(idx), cnt = new Int32Array(10);
      for (let j = 0; j < gy; j++) for (let i = 0; i < gx; i++) {
        cnt.fill(0); let tot = 0;
        for (let b = -1; b <= 1; b++) for (let a = -1; a <= 1; a++) {
          const x = i + a, y = j + b; if (x < 0 || y < 0 || x >= gx || y >= gy) continue;
          cnt[idx[y * gx + x] + 1]++; tot++;
        }
        let bv = 0, bc = -1; for (let v = 0; v < 10; v++) if (cnt[v] > bc) { bc = cnt[v]; bv = v; }
        if (bc >= Math.ceil(tot * 5 / 9)) nx[j * gx + i] = bv - 1;
      }
      idx = nx;
    }
    return { gx, gy, idx, lum };
  }

  // ---------- surface projection ----------
  // frame: {c,n,t,b} as [x,y,z]; soup: {pos: Float32Array tri soup, nrm: Float32Array|null}
  function makeProjector(soup, frame, halfW, halfH) {
    const { c, n, t, b } = frame;
    if (!soup) return (u, v) => ({ p: [c[0] + t[0] * u + b[0] * v, c[1] + t[1] * u + b[1] * v, c[2] + t[2] * u + b[2] * v], n: n.slice() });
    const P = soup.pos, T = P.length / 9, B = 96, e = 1e-6;
    const minU = -halfW - e, minV = -halfH - e, du = (2 * halfW + 2 * e) / B, dv = (2 * halfH + 2 * e) / B;
    const bins = new Array(B * B); for (let i = 0; i < bins.length; i++) bins[i] = [];
    const rec = [];
    for (let i = 0; i < T; i++) {
      const o = i * 9, uu = [0, 0, 0], vv = [0, 0, 0], hh = [0, 0, 0];
      for (let j = 0; j < 3; j++) {
        const x = P[o + j * 3] - c[0], y = P[o + j * 3 + 1] - c[1], z = P[o + j * 3 + 2] - c[2];
        uu[j] = x * t[0] + y * t[1] + z * t[2]; vv[j] = x * b[0] + y * b[1] + z * b[2]; hh[j] = x * n[0] + y * n[1] + z * n[2];
      }
      const mnU = Math.min(uu[0], uu[1], uu[2]), mxU = Math.max(uu[0], uu[1], uu[2]);
      const mnV = Math.min(vv[0], vv[1], vv[2]), mxV = Math.max(vv[0], vv[1], vv[2]);
      if (mxU < minU || mnU > halfW + e || mxV < minV || mnV > halfH + e) continue;
      const A = (uu[1] - uu[0]) * (vv[2] - vv[0]) - (uu[2] - uu[0]) * (vv[1] - vv[0]);
      if (Math.abs(A) < 1e-12) continue;
      const ax = P[o + 3] - P[o], ay = P[o + 4] - P[o + 1], az = P[o + 5] - P[o + 2];
      const bx = P[o + 6] - P[o], by = P[o + 7] - P[o + 1], bz = P[o + 8] - P[o + 2];
      let gxn = ay * bz - az * by, gyn = az * bx - ax * bz, gzn = ax * by - ay * bx;
      const gl = Math.hypot(gxn, gyn, gzn) || 1; gxn /= gl; gyn /= gl; gzn /= gl;
      const facing = gxn * n[0] + gyn * n[1] + gzn * n[2];
      const r = rec.length / 14;
      rec.push(uu[0], vv[0], uu[1], vv[1], uu[2], vv[2], hh[0], hh[1], hh[2], A, facing, i, 0, 0);
      const i0 = Math.max(0, Math.floor((mnU - minU) / du)), i1 = Math.min(B - 1, Math.floor((mxU - minU) / du));
      const j0 = Math.max(0, Math.floor((mnV - minV) / dv)), j1 = Math.min(B - 1, Math.floor((mxV - minV) / dv));
      for (let bj = j0; bj <= j1; bj++) for (let bi = i0; bi <= i1; bi++) bins[bj * B + bi].push(r);
    }
    const R = Float64Array.from(rec), N = soup.nrm;
    return function (u, v) {
      const bi = Math.min(B - 1, Math.max(0, Math.floor((u - minU) / du)));
      const bj = Math.min(B - 1, Math.max(0, Math.floor((v - minV) / dv)));
      const list = bins[bj * B + bi];
      let best = -Infinity, br = -1, w0b = 0, w1b = 0, w2b = 0;
      for (let q = 0; q < list.length; q++) {
        const o = list[q] * 14;

/* Share link: the project, pictures left out, deflated into the part of the address after "#p=".
   That part never reaches a server. Opening one goes through sanitizeProject like any project file. */
const b64url = bytes => { let s = ""; for (let i=0;i<bytes.length;i+=0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
const unb64url = t => Uint8Array.from(atob(t.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
async function squeeze(text, back){
  if (typeof CompressionStream === "undefined") return null;
  const st = back ? new DecompressionStream("deflate-raw") : new CompressionStream("deflate-raw");
  const reader = new Blob([text]).stream().pipeThrough(st).getReader(), chunks = []; let n = 0;
  for (;;){ const { done, value } = await reader.read(); if (done) break; n += value.length; if (n > 4e6){ reader.cancel(); throw new Error("too big"); } chunks.push(value); }
  const out = new Uint8Array(n); let o = 0; chunks.forEach(c => { out.set(c, o); o += c.length; });
  return out;
}
async function makeShareLink(){
  const st = JSON.parse(serialize()), pics = st.items.filter(it => !it.text).length;
  st.items = st.items.filter(it => it.text); st.active = st.items.length ? 0 : -1;
  const json = JSON.stringify({ app:"Maker Forge", v:5, state:st }), packed = await squeeze(json);
  const tail = packed ? "#p=" + b64url(packed) : "#j=" + b64url(new TextEncoder().encode(json));
  return { url: location.href.split("#")[0] + tail, pics };
}
async function readShareLink(){
  const h = location.hash || "";
  if (!/^#[pj]=/.test(h) || h.length > 2e6) return null;
  try {
    const bytes = unb64url(h.slice(3));
    const text = h[1] === "p" ? new TextDecoder().decode(await squeeze(bytes, true)) : new TextDecoder().decode(bytes);
    const data = JSON.parse(text);
    return data && data.state ? data : null;
  } catch (e){ notify("That share link could not be read."); return null; }
}

/* Bobble head kit: a head with a socket, a body with a matching socket, and a neck that is
   either a straight post or a printed spring. Every piece is a closed solid. */
function buildBobble(){
  const b = state.base.bobble, R = b.headDia/2, rb = b.bore/2, d = b.boreDepth;
  const parts = [];
  const shape = y => {
    const u = clamp(y/(2*R), 0, 1), circle = Math.sqrt(Math.max(0, 1-(2*u-1)*(2*u-1)));
    if (b.headShape === "egg") return R*circle*(0.82 + 0.3*(1-u));
    if (b.headShape === "squat") return R*Math.pow(circle, 0.78);
    return R*circle;
  };
  const flat = clamp(b.flatBottom, 0, R*0.6);
  const yStart = Math.max(flat, R - Math.sqrt(Math.max(0.01, R*R - rb*rb)));
  const headProf = [[Math.max(rb+0.2, shape(yStart)), yStart]];
  if (b.hat){
    const hatY = 2*R*0.72;
    for (let y=yStart+0.4; y<=hatY; y+=0.4) headProf.push([Math.max(0.01, shape(y)), y]);
    headProf.push([shape(hatY)+b.hatBrim, hatY], [shape(hatY)+b.hatBrim, hatY+1.4]);
    const crown = Math.max(2, shape(hatY)*0.86);
    for (let i=0;i<=16;i++){ const t = i/16;
      headProf.push([crown*Math.cos(t*Math.PI/2), hatY+1.4 + b.hatH*Math.sin(t*Math.PI/2)]); }
  } else {
    for (let y=yStart+0.4; y<2*R; y+=0.4) headProf.push([Math.max(0.01, shape(y)), y]);
    headProf.push([0, 2*R]);
  }
  headProf.push([0, yStart+d], [rb, yStart+d]);
  const headY = b.bodyH + b.gap;
  parts.push({ name:"Head", slot:b.headSlot, solid:C.transformSolid(C.revolveLoop(headProf, 112), 1, 0, headY, 0),
    layout:[-(R + b.baseR + 14), -(headY + yStart), 0] });

  const plinth = b.plinth ? b.plinthH : 0;
  const bodyR = y => {
    const u = clamp((y-plinth)/Math.max(1,(b.bodyH-plinth)), 0, 1);
    if (b.bodyStyle === "pedestal") return b.baseR - (b.baseR-b.neck)*Math.pow(u, 0.55);
    if (b.bodyStyle === "cylinder") return b.waist + (b.neck-b.waist)*Math.pow(u, 3);
    if (u < 0.12) return b.baseR*(1-0.25*(u/0.12));
    if (u < 0.55) return b.waist + (b.baseR*0.75-b.waist)*Math.pow(1-(u-0.12)/0.43, 1.4);
    if (u < 0.85) return b.waist + (b.shoulder-b.waist)*Math.sin((u-0.55)/0.3*Math.PI/2);
    return b.shoulder + (b.neck-b.shoulder)*Math.pow((u-0.85)/0.15, 0.8);
  };
  const bodyProf = [];
  if (b.weight || b.magnet){                       // pocket in the base for coins, shot or a magnet
    const pr2 = b.weight ? clamp(b.weightDia/2, 1, b.baseR-3) : clamp(b.magnetDia/2, 1, b.baseR-3);
    const pd = b.weight ? clamp(b.weightDepth, 1, b.bodyH*0.6) : clamp(b.magnetDepth, 0.5, b.bodyH*0.5);
    bodyProf.push([0, pd], [pr2, pd], [pr2, 0]);
  } else bodyProf.push([0, 0]);
  bodyProf.push([b.baseR, 0]);
  if (plinth) bodyProf.push([b.baseR, plinth]);
  for (let y=plinth+1; y<=b.bodyH; y+=1) bodyProf.push([Math.max(1, bodyR(y)), y]);
  const neckR = Math.max(rb+0.6, b.neck);
  if (Math.abs(bodyProf[bodyProf.length-1][0]-neckR) > 0.01) bodyProf.push([neckR, b.bodyH]);
  bodyProf.push([rb, b.bodyH], [rb, b.bodyH-d], [0, b.bodyH-d]);
  parts.push({ name:"Body", slot:b.bodySlot, solid:C.revolveLoop(bodyProf, 112), layout:[0,0,0] });

  const pr = Math.max(0.6, rb - b.fit);
  let neck = null;
  if (b.neckKind === "spring"){
    const coil = clamp(b.springCoil, b.springWire+0.6, Math.max(1.2, rb*1.6));
    const turns = clamp(b.springTurns, 2, 12), H = b.gap + d*0.8;
    const path = [[0, 0, coil*0]], steps = Math.round(turns*40);
    path.length = 0;
    for (let i=0;i<=steps;i++){ const t = i/steps, a = t*turns*Math.PI*2;
      path.push([Math.cos(a)*coil, b.springWire + t*H, Math.sin(a)*coil]); }
    const spring = C.sweepTube(path, b.springWire, 12);
    const plug = C.revolveLoop([[0,0],[pr,0],[pr,d*0.8],[0,d*0.8]], 48);
    neck = C.mergeSolids([spring, C.transformSolid(plug, 1, coil, -d*0.8+b.springWire, 0),
      C.transformSolid(plug, 1, Math.cos(turns*Math.PI*2)*coil, b.springWire+H, Math.sin(turns*Math.PI*2)*coil)]);
  } else {
    neck = C.revolveLoop([[0,0],[pr,0],[pr,b.postH],[0,b.postH]], 64);
  }
  if (neck) parts.push({ name: b.neckKind === "spring" ? "Spring neck" : "Post", slot:b.postSlot,
    solid:C.transformSolid(neck, 1, b.baseR + R + 14, d*0.8, 0), layout:[0,0,0] });
  return parts.filter(p=>p.solid);
}

/* grow a mask by p pixels of empty border, so shapes can be grown past the edge of the picture */
function padMask(mask, w, h, p){
  const W2 = w + p*2, H2 = h + p*2, out = new Uint8Array(W2*H2);
  for (let y=0;y<h;y++) out.set(mask.subarray(y*w, y*w+w), (y+p)*W2 + p);
  return { mask:out, w:W2, h:H2 };
}
/* the artwork's silhouette: transparent pixels, left-out filaments and a plain background are all "outside" */
function silhouetteMask(d, gx, gy){
  const src = sourceCanvas(d);
  const img = resample(src, gx, gy, d.mirror);
  const cm = C.buildCellMap(img, state.slots.map(sl=>C.hexToRgb(sl.hex)), state.slots.map((_,i)=>d.skip.includes(i)), Math.max(1,d.smooth));
  const mask = new Uint8Array(gx*gy);
  for (let i=0;i<mask.length;i++) mask[i] = cm.idx[i] >= 0 ? 1 : 0;
  // a plain background that was not left out: key it away against the border colour
  const border = [];
  for (let x=0;x<gx;x++) border.push(x, (gy-1)*gx+x);
  for (let y=1;y<gy-1;y++) border.push(y*gx, y*gx+gx-1);
  // key it only if the visible part of the border is one plain colour (a background, not a cropped subject)
  const vis = border.filter(i => img.data[i*4+3] >= 128);
  const medOf = (list, k) => { const v = list.map(i=>img.data[i*4+k]).sort((a,b)=>a-b); return v[v.length>>1]; };
  const ref = vis.length ? [medOf(vis,0), medOf(vis,1), medOf(vis,2)] : null;
  const uniform = ref && vis.filter(i => { const o=i*4; return Math.abs(img.data[o]-ref[0]) + Math.abs(img.data[o+1]-ref[1]) + Math.abs(img.data[o+2]-ref[2]) < 60; }).length >= vis.length*0.75;

    const med = k => medOf(vis, k);
    const bg = [med(0),med(1),med(2)], dist = new Float32Array(gx*gy), strong = [];
    for (let i=0;i<mask.length;i++){ const o=i*4, a=img.data[o]-bg[0], b=img.data[o+1]-bg[1], c=img.data[o+2]-bg[2];
      dist[i] = Math.sqrt(a*a+b*b+c*c); if (dist[i] > 30 && i % 3 === 0) strong.push(dist[i]); }
    strong.sort((a,b)=>a-b);
    const cut = Math.max(30, (strong[strong.length>>1] || 60)/2);
    for (let i=0;i<mask.length;i++) if (dist[i] <= cut) mask[i] = 0;
  }
  return mask;
}
function buildCutter(){
  const d = state.items[state.active] || state.items[0];
  const src = d && sourceCanvas(d);
  if (!src){ notify("The cookie cutter is traced from artwork: add a logo or photo on the Art tab."); return []; }
  const cut = state.base.cutter;
  const gx = clamp(Math.round(d.width/0.15), 80, 900), gy = Math.max(4, Math.round(gx/d.aspect));
  const W = d.width, px = gx/W;
  let mask = silhouetteMask(d, gx, gy);
  const lab = C.labelMask(mask, gx, gy);
  if (!lab.comps.length){ notify("The cutter found no shape in this artwork. Leave out its background colour on the Art tab."); return []; }
  // keep the main shape only: a cutter is one closed wall
  const main = lab.comps.slice().sort((a,b)=>b.area-a.area)[0].id;
  for (let i=0;i<mask.length;i++) mask[i] = lab.lab[i] === main ? 1 : 0;

    return C.maskToPolys(m, P.w, P.h, { mmPerPx });
  };
  const blade = band(cut.blade/2, cut.blade/2);
  const parts = [C.extrudePolysAt(blade, 0, cut.height)];
  if (cut.rim > 0) parts.push(C.extrudePolysAt(band(cut.blade/2 + cut.rim, cut.blade/2), 0, cut.rimH));   // flange joined to the blade

  let mask = new Uint8Array(w*h), thrUsed = null, polarity = T.polarity;
  if (T.method === "background" && alpha){
    for (let i=0;i<mask.length;i++) mask[i] = alpha[i] >= 128 ? 1 : 0;   // half-covered edge pixels split evenly
  } else if (T.method === "background"){
    // colour key: the part is whatever differs from the background colour. Unlike a flood fill this
    // cannot leak through a noisy part, and background showing through holes is removed too.
    const samples = [];
    if (paperMmPerPx){
      for (let i=0;i<w*h;i+=7) samples.push(i);                    // the sheet dominates the straightened image
    } else {
      for (let x=0;x<w;x++) samples.push(x, (h-1)*w+x);
      for (let y=1;y<h-1;y++) samples.push(y*w, y*w+w-1);
    }
    const med = k => { const v = samples.map(i=>img.data[i*4+k]).sort((a,b)=>a-b); return v[v.length>>1]; };
    const bg = [med(0), med(1), med(2)], tolD = T.tol*Math.sqrt(3);
    const dist = new Float32Array(w*h), strong = [];
    for (let i=0;i<mask.length;i++){
      const o = i*4, dr = img.data[o]-bg[0], dg = img.data[o+1]-bg[1], db = img.data[o+2]-bg[2];
      dist[i] = img.data[o+3] < 128 ? 0 : Math.sqrt(dr*dr+dg*dg+db*db);
      if (dist[i] > tolD && (i % 5) === 0) strong.push(dist[i]);
    }
    // cut halfway between the background and the part's typical colour: an edge pixel that is half
    // part, half paper then lands on the right side, so outlines and holes keep their true size
    strong.sort((a,b)=>a-b);
    const partD = strong.length ? strong[strong.length>>1] : tolD*2;
    const cut = Math.max(tolD, partD/2);
    for (let i=0;i<mask.length;i++) mask[i] = dist[i] > cut ? 1 : 0;
  } else {
    const hist = new Uint32Array(256), lum = new Uint8Array(w*h);
    for (let i=0;i<lum.length;i++){ const o = i*4; lum[i] = Math.round(C.luma(img.data[o],img.data[o+1],img.data[o+2])*255); hist[lum[i]]++; }
    thrUsed = T.autoThr ? otsu(hist, lum.length) : Math.round(T.threshold*2.55);
    if (polarity === "auto"){                       // is the part darker or lighter than its border?
      let bsum = 0, bn = 0;
      for (let x=0;x<w;x++){ bsum += lum[x] + lum[(h-1)*w+x]; bn += 2; }
      for (let y=0;y<h;y++){ bsum += lum[y*w] + lum[y*w+w-1]; bn += 2; }
      polarity = bsum/bn > thrUsed ? "dark" : "light";
    }
    // Otsu's threshold t splits the histogram into values <= t and values > t, so a flat-coloured
    // part whose brightness is exactly t belongs to the dark side (strict < lost it entirely)
    for (let i=0;i<mask.length;i++) mask[i] = (polarity === "dark" ? lum[i] <= thrUsed : lum[i] > thrUsed) ? 1 : 0;
  }
  if (paperMmPerPx){                        // the shaved paper edge is pure white, not part (either method)
    const edge = Math.round(Math.min(w, h)*0.015);
    for (let y=0;y<h;y++) for (let x=0;x<w;x++) if (x<edge||y<edge||x>=w-edge||y>=h-edge) mask[y*w+x] = 0;
  }

  // 2. clean up: close small gaps, open away whiskers, drop specks, keep the part
  const rough = mask.slice();
  const px0 = paperMmPerPx ? 1/paperMmPerPx : Math.max(w,h)/Math.max(1,T.size);   // provisional px per mm
  // smoothing costs round holes about 0.05 mm (measured: 7.96 vs 8.00 mm); a blur-and-threshold
  // alternative was tried and measured no better, so close/open stays. Precision parts: smoothing 0.
  // Long thin strokes and long narrow gaps survive smoothing (a brush-stroke ring that thins out,
  // the space between letters): only short bits count as noise. See smoothMask in core.
  const sr = Math.round(T.smooth*px0);
  if (sr > 0) mask = C.smoothMask(mask, w, h, sr);
  let { lab, comps } = C.labelMask(mask, w, h), leftOut = 0;
  if (comps.length){
    const keep = new Set(), minArea = T.specks*px0*px0;
    if (T.largestOnly){
      // the main piece, and every piece inside its outline (letters inside a ring, the dot of an i
      // in a hole); pieces outside it are other things in the photo: shadows, a coin, the table edge
      const main = comps.reduce((a,b)=> b.area > a.area ? b : a).id;
      const out = new Uint8Array(w*h);
      for (let i=0;i<out.length;i++) out[i] = lab[i] === main ? 0 : 1;
      const ol = C.labelMask(out, w, h), open = new Set();
      ol.comps.forEach(c => { if (c.minX === 0 || c.minY === 0 || c.maxX === w-1 || c.maxY === h-1) open.add(c.id); });
      const seen = new Set();
      keep.add(main);
      for (let i=0;i<lab.length;i++){ const id = lab[i];
        if (id < 0 || id === main || seen.has(id)) continue;
        seen.add(id);
        if (comps[id].area < minArea) continue;
        if (open.has(ol.lab[i])) leftOut++; else keep.add(id);
      }
    }
    else comps.forEach(c => { if (c.area >= minArea) keep.add(c.id); });
    for (let i=0;i<mask.length;i++) mask[i] = mask[i] && keep.has(lab[i]) ? 1 : 0;
  }

  // hand edits: brush strokes stored in 0..1 image coordinates, so they survive resolution changes
  (T.strokes||[]).forEach(st => {
    const r = Math.max(1, st.r*w), r2 = r*r, val = st.m === "add" ? 1 : 0;
    st.pts.forEach(([u,v]) => {
      const cx = u*w, cy = v*h;
      for (let y=Math.max(0,Math.floor(cy-r)); y<Math.min(h,Math.ceil(cy+r)); y++)
        for (let x=Math.max(0,Math.floor(cx-r)); x<Math.min(w,Math.ceil(cx+r)); x++)
          if ((x+0.5-cx)*(x+0.5-cx)+(y+0.5-cy)*(y+0.5-cy) <= r2) mask[y*w+x] = val;
    });
  });

  // 3. scale: from the paper when we straightened it, otherwise from the one real measurement
  const bb = maskBounds(mask, w, h);
  if (bb.maxX < 0){ notify("Nothing was traced. Try the other separation method or adjust the threshold."); return []; }
  {
    // most of the picture's edge counted as part: the background was picked, not the part
    // (the tracing closes shapes along the picture's edge, so this would otherwise print a frame)
    let edgeOn = 0, edgeN = 0;
    for (let x=0;x<w;x++){ edgeOn += mask[x] + mask[(h-1)*w+x]; edgeN += 2; }
    for (let y=0;y<h;y++){ edgeOn += mask[y*w] + mask[y*w+w-1]; edgeN += 2; }
    if (edgeOn > edgeN*0.5){
      notify("The trace picked the background instead of the part. In step 2, switch between 'Part is darker' and 'Part is lighter', or try the other separation method.");
      const mpp = paperMmPerPx || T.size/Math.max(1, bb.maxX-bb.minX+1);   // keeps the brush a sensible size
      tracerInfo = { w, h, img:shown, transparent:!!alpha, leftOut, finished:null, rough, mask, polys:[], mmPerPx:mpp, thrUsed, polarity,
        outerW:(bb.maxX-bb.minX+1)*mpp, outerH:(bb.maxY-bb.minY+1)*mpp, dims:null, holes:[], src:src0,
        paper: paperMmPerPx ? T.paper : null, quad: paperQuad };
      return [];
    }
  }
  const pxW = bb.maxX-bb.minX+1, pxH = bb.maxY-bb.minY+1;
  // measure the way calipers do: between lines fitted to the part's flat sides (a bounding box
  // is set by the few outermost edge pixels and reads large on noisy or tilted edges)
  let pxSize = T.sizeAxis === "height" ? pxH : pxW;
  if (!paperMmPerPx){
    const fp = C.fitDimensions(largestOuter(C.maskToPolys(mask, w, h, { mmPerPx:1 })), { res:1 });
    const v = fp && (T.sizeAxis === "height" ? fp.height : fp.width);
    if (v > 2) pxSize = v;
  }
  let mmPerPx = paperMmPerPx || T.size / pxSize;
  const fromFile = !paperMmPerPx && T.scaleFrom === "file" && d.mm && d.src;
  if (fromFile) mmPerPx = d.mm[0]/d.src.width * src0.width/w;          // a drawing that states its own size (SVG in mm)
  if (!paperMmPerPx && !fromFile && T.extra === "plate" && T.sizeOf === "whole"){      // the typed size is the whole plate
    const grow = Math.max(0, +T.plateMargin || 0) + (+T.offset || 0);
    mmPerPx = T.plateShape === "circle" ? (T.size/2 - grow)/maskRadiusPx(mask, w, h)
      : (T.size - 2*grow)/(T.plateShape === "rect" ? (T.sizeAxis === "height" ? pxH : pxW) : pxSize);
    mmPerPx = Math.max(1e-4, mmPerPx);
  }
  const pxPerMm = 1/mmPerPx;

  // fill holes that are too small to be real features
  const inv = new Uint8Array(w*h);
  for (let i=0;i<inv.length;i++) inv[i] = mask[i] ? 0 : 1;
  const holesLab = C.labelMask(inv, w, h);
  const minHoleArea = Math.PI*Math.pow(T.minHole/2*pxPerMm, 2);
  holesLab.comps.forEach(c => {
    const touches = c.minX === 0 || c.minY === 0 || c.maxX === w-1 || c.maxY === h-1;
    if (touches) return;
    if (T.fillHoles || c.area < minHoleArea)
      for (let i=0;i<mask.length;i++) if (holesLab.lab[i] === c.id) mask[i] = 1;
  });

  // thin lines (a logo's hairlines) grown to a printable width: only strokes narrower than the minimum
  // change; their centre lines are widened to it, the rest of the shape stays as traced
  let thickened = 0;
  if (T.minLine > 0){
    const r = Math.max(1, T.minLine/2*pxPerMm), wide = openMask(mask, w, h, r), inv = new Uint8Array(w*h);
    for (let i=0;i<inv.length;i++) inv[i] = mask[i] ? 0 : 1;
    const dIn = C.edt(inv, w, h), ridge = new Uint8Array(w*h); let any = false;
    for (let y=1;y<h-1;y++) for (let x=1;x<w-1;x++){
      const i = y*w + x; if (!mask[i] || wide[i]) continue;
      const v = dIn[i];
      if (v >= dIn[i-1] && v >= dIn[i+1] && v >= dIn[i-w] && v >= dIn[i+w]){ ridge[i] = 1; any = true; }
    }
    if (any){
      const grown = C.dilateMask(ridge, w, h, r);
      for (let i=0;i<mask.length;i++) if (grown[i] && !mask[i]){ mask[i] = 1; thickened++; }
    }
  }
  // 4. trace smoothly (with an optional fit offset), then true up round holes
  const polys = T.offset
    ? C.fieldToPolys(C.signedDistanceField(mask, w, h), w, h, { mmPerPx, iso: -T.offset*pxPerMm, eps: mmPerPx*0.3, minSeg: mmPerPx*0.4, closeEdges:true })
    : C.maskToPolys(mask, w, h, { mmPerPx, eps: mmPerPx*0.3, closeEdges:true });
  const holeReport = [];
  const perim = L => L.reduce((a,p,i)=>a+Math.hypot(p[0]-L[(i+1)%L.length][0], p[1]-L[(i+1)%L.length][1]), 0);
  polys.forEach(poly => {
    poly.holes = poly.holes.map(hl => {
      const A = Math.abs(C.area2(hl)), P = perim(hl), circ = 4*Math.PI*A/(P*P);
      const cx = hl.reduce((a,p)=>a+p[0],0)/hl.length, cy = hl.reduce((a,p)=>a+p[1],0)/hl.length;
      const dia = 2*Math.sqrt(A/Math.PI);
      if (T.roundHoles && circ >= T.circularity){
        const snapped = T.snap > 0 ? Math.round(dia/T.snap)*T.snap : dia;
        const r = Math.max(0.3, snapped/2 + T.holeClear/2);
        holeReport.push({ x:cx, y:cy, measured:dia, made:r*2, round:true });
        return C.ringCircle(r, Math.max(32, Math.round(r*12)), true).map(q=>[q[0]+cx, q[1]+cy]);
      }
      holeReport.push({ x:cx, y:cy, measured:dia, made:dia, round:false });
      return hl;
    });
  });
  const solid = polys.length ? C.extrudePolys(polys, T.thick) : null;
  if (!solid){
    // say why instead of showing an empty bed: usually the background was picked as the part
    let edgeOn = 0, edgeN = 0;
    for (let x=0;x<w;x++){ edgeOn += mask[x] + mask[(h-1)*w+x]; edgeN += 2; }
    for (let y=0;y<h;y++){ edgeOn += mask[y*w] + mask[y*w+w-1]; edgeN += 2; }
    notify(edgeOn > edgeN*0.5
      ? "The trace picked the background instead of the part. In step 2, switch between 'Part is darker' and 'Part is lighter', or try the other separation method."
      : "The trace came out empty. Try the other separation method in step 2, or paint the part in with the Add brush.");
  }
  const outerW = pxW*mmPerPx + T.offset*2, outerH = pxH*mmPerPx + T.offset*2;
  const dims = C.fitDimensions(largestOuter(polys), { res:Math.max(mmPerPx, photoMmPerPx) });   // traced outline, offset included
  const extra = solid ? tracerExtras(T, mask, w, h, mmPerPx, polys, solid) : { parts:[], size:null };
  // keep the picture's colours: the traced shape becomes a body in the object filament with a face
  // in the picture's colours, each colour clipped to the traced outline (so they meet it exactly)
  let colourCount = 0;
  const colourable = !T.extra || T.extra === "none" || (T.extra === "plate" && (T.plateMode || "raised") === "raised");
  if (solid && T.colours === "keep" && colourable){
    const bodySlot = clamp(state.base.slot, 0, state.slots.length - 1), N = w*h;
    const cm = C.buildCellMap(img, state.slots.map(sl => C.hexToRgb(sl.hex)), state.slots.map((_, i) => (d.skip || []).includes(i)), 1);
    const sdf = C.signedDistanceField(mask, w, h), offPx = (+T.offset || 0)*pxPerMm, F = new Float32Array(N);
    for (let i=0;i<N;i++) F[i] = sdf[i] + offPx;
    const rOpen = Math.max(0, Math.round((state.printer.nozzle || 0.4)*0.5*pxPerMm)), anyCol = new Float32Array(N).fill(-1e9), cols = [];
    const fopt = { mmPerPx, iso:0, eps:mmPerPx*0.3, minSeg:mmPerPx*0.4, closeEdges:true };
    state.slots.forEach((_, k) => {
      if (k === bodySlot) return;
      let m = new Uint8Array(N), n = 0;
      for (let i=0;i<N;i++) if (mask[i] && cm.idx[i] === k){ m[i] = 1; n++; }
      if (n*mmPerPx*mmPerPx < 0.5) return;
      if (rOpen > 0) m = openMask(m, w, h, rOpen);          // nothing narrower than a nozzle
      const b = C.blurMask(m, w, h, 1), G = new Float32Array(N);
      for (let i=0;i<N;i++){ const g = Math.min((b[i] - 0.5)*4, F[i]); G[i] = g; if (g > anyCol[i]) anyCol[i] = g; }
      const cp = C.fieldToPolys(G, w, h, fopt);
      if (cp.length) cols.push({ slot:k, polys:cp });
    });
    const tp = extra.parts.find(q => q.name === "Traced part");
    if (cols.length && tp){
      const ch = clamp(+T.colourH || 0.6, 0.2, Math.max(0.2, T.thick - 0.4)), top = new Float32Array(N);
      for (let i=0;i<N;i++) top[i] = Math.min(F[i], -anyCol[i]);
      const topPolys = C.fieldToPolys(top, w, h, fopt), z0 = C.solidBounds(tp.solid).mn[1], z1 = z0 + T.thick;
      tp.solid = C.mergeSolids([C.extrudePolysAt(polys, z0, z1 - ch), topPolys.length ? C.extrudePolysAt(topPolys, z1 - ch, z1) : null].filter(Boolean));
      cols.forEach(c => extra.parts.push({ name:`Traced part (${state.slots[c.slot].name})`, slot:c.slot, solid:C.extrudePolysAt(c.polys, z1 - ch, z1) }));
      colourCount = cols.length;
    }
  }
  tracerInfo = { w, h, img:shown, transparent:!!alpha, leftOut, finished:extra.size, rough, mask, polys, mmPerPx, thrUsed, polarity, outerW, outerH, dims, holes:holeReport, src:src0,
    thickened: thickened*mmPerPx*mmPerPx, colours: colourCount, plateHoles,
    paper: paperMmPerPx ? T.paper : null, quad: paperQuad };
  return extra.parts;
}

/* Lightbox: either a backlit multi-colour panel in a frame, or a layered paper-cut shadow box.
   Everything prints flat; the stand carries a channel for an LED strip. */
function buildLightbox(){
  const L = state.base.lightbox;
  const d = state.items[state.active] || state.items[0];
  const src = d && sourceCanvas(d);
  if (!src){ notify("The lightbox is built from artwork: add a photo or a silhouette on the Art tab."); return []; }
  const inW = Math.max(20, L.width - L.frame*2), inH = inW/d.aspect;
  const outW = L.width, outH = inH + L.frame*2;
  const cell = 0.2, gx = clamp(Math.round(inW/cell), 60, 900), gy = Math.max(6, Math.round(gx/d.aspect));
  const img = resample(src, gx, gy, d.mirror);
  const opt = { mmPerPx:inW/gx, smooth:2, eps:0.06 };
  const parts = [];
  const diffSlot = clamp(L.diffSlot,0,state.slots.length-1), frameSlot = clamp(L.frameSlot,0,state.slots.length-1);
  const panelRect = C.ringRect(inW, inH, 1, 6);
  const nLayers = clamp(Math.round(L.layers), 2, 8);

  if (L.mode === "backlit"){
    const panel = C.extrudePolys([{ outer:panelRect, holes:[] }], L.panelThick);
    if (panel) parts.push({ name:"Diffuser panel", slot:diffSlot, solid:panel, layout:[0,0,0] });
    const cm = C.buildCellMap(img, state.slots.map(s2=>C.hexToRgb(s2.hex)),
      state.slots.map((_,i)=>d.skip.includes(i)), d.smooth);
    state.slots.forEach((sl,i)=>{
      if (i === diffSlot) return;
      const m = C.maskOfSlot(cm, i); if (!m) return;
      const polys = C.maskToPolys(m, gx, gy, opt); if (!polys.length) return;
      const rgb = C.hexToRgb(sl.hex), dark = 1 - C.luma(rgb[0], rgb[1], rgb[2]);
      const h = L.lightAware ? L.colourH*(0.5 + dark*1.5) : L.colourH;
      const s2 = C.extrudePolysAt(polys, Math.max(0,L.panelThick-0.2), L.panelThick + h);
      if (s2) parts.push({ name:sl.name, slot:i, solid:s2, layout:[0,0,0] });
    });
  } else {
    const lum = new Float32Array(gx*gy);
    for (let i=0;i<lum.length;i++){ const o = i*4;
      lum[i] = img.data[o+3] < 128 ? 1 : C.luma(img.data[o], img.data[o+1], img.data[o+2]); }
    for (let k=0;k<nLayers;k++){
      const t = (k+1)/(nLayers+1)*L.spread + (1-L.spread)/2;
      const open = new Uint8Array(gx*gy);
      for (let i=0;i<lum.length;i++) open[i] = lum[i] > t ? 1 : 0;
      const holes = C.maskToPolys(open, gx, gy, opt).map(q=>q.outer);
      const plate = C.extrudePolys([{ outer:panelRect, holes }], L.layerThick);
      const y = k*(L.layerThick + L.layerGap);
      if (plate) parts.push({ name:`Layer ${k+1}`, slot: k === nLayers-1 ? diffSlot : frameSlot,
        solid:C.transformSolid(plate, 1, 0, y, 0), layout:[(k-(nLayers-1)/2)*(outW+6), -y, 0] });
      if (k < nLayers-1){
        const ring = C.extrudePolys([{ outer:panelRect,
          holes:[C.ringRect(Math.max(4,inW-L.frame*0.8), Math.max(4,inH-L.frame*0.8), 1, 6)] }], L.layerGap);
        if (ring) parts.push({ name:`Spacer ${k+1}`, slot:frameSlot,
          solid:C.transformSolid(ring, 1, 0, y+L.layerThick, 0),
          layout:[(k-(nLayers-1)/2)*(outW+6), -(y+L.layerThick), outH*0.8] });
      }
    }
  }

  const frameHoles = [C.ringRect(inW+0.4, inH+0.4, 1, 6)];
  if (L.hang) frameHoles.push(C.ringCircle(L.hangDia/2, 32).map(q=>[q[0], q[1] + outH/2 - L.frame/2]));
  const frame = C.extrudePolys([{ outer:C.ringRect(outW, outH, Math.min(6,L.frame), 8), holes:frameHoles }], L.frameThick);
  if (frame) parts.push({ name:"Frame", slot:frameSlot, solid:frame, layout:[0, 0, outH + 10] });

  if (L.stand){
    const stackT = L.mode === "backlit" ? L.frameThick + 1.2
      : nLayers*L.layerThick + (nLayers-1)*L.layerGap + L.frameThick + 1;
    const slotW = stackT + 0.6;
    const holes = [rectPoly(0, 0, outW*0.86, slotW)];
    if (L.led) holes.push(rectPoly(0, -slotW/2 - L.ledW/2 - 1.5, outW*0.8, L.ledW));
    const stand = C.extrudePolys([{ outer:C.ringRect(outW*0.94, L.standDepth, 3, 8), holes }], L.standH);
    if (stand) parts.push({ name:"Stand", slot:frameSlot, solid:stand, layout:[0, 0, -(outH/2 + L.standDepth/2 + 8)] });
  }
  return parts;
}

/* Lithophane: the picture as thickness, so it appears when light shines through it. Thin plastic
   glows, thick plastic stays dark. Flat (standing on a foot or lying down), curved, or a cylinder
   to put over an LED tea light. The sheet is one solid: a thickness grid clipped to the outline. */
let lithoInfo = null;
const LITHO_MAX_NODES = 380000;          // about 780k triangles: small enough for the printability check
const LITHO_OUTLINES = [["rect","Rectangle"],["arch","Arch window"],["oval","Oval"],["heart","Heart"]];
function lithoOutline(kind, W, H, r, squareBottom){
  if (kind === "oval") return C.ringCircle(1, 240).map(p=>[p[0]*W/2, p[1]*H/2]);
  if (kind === "heart"){
    const ring = C.ringHeart(1, 320); let x0=Infinity, x1=-Infinity, y0=Infinity, y1=-Infinity;
    ring.forEach(p=>{ x0=Math.min(x0,p[0]); x1=Math.max(x1,p[0]); y0=Math.min(y0,p[1]); y1=Math.max(y1,p[1]); });
    return ring.map(p=>[(p[0]-(x0+x1)/2)/(x1-x0)*W, (p[1]-(y0+y1)/2)/(y1-y0)*H]);
  }
  if (kind === "arch"){
    const ry = Math.min(W/2, H*0.6), L = [], rr = Math.max(0, Math.min(r, W/4, (H-ry)/2));
    const corner = (cx, cy, a0) => { for (let i=0;i<=8;i++){ const a = a0 + i/8*Math.PI/2; L.push([cx+Math.cos(a)*rr, cy+Math.sin(a)*rr]); } };
    if (rr > 0.01 && !squareBottom){ corner(-W/2+rr, -H/2+rr, Math.PI); corner(W/2-rr, -H/2+rr, -Math.PI/2); }
    else L.push([-W/2,-H/2],[W/2,-H/2]);
    for (let i=0;i<=96;i++){ const a = i/96*Math.PI; L.push([Math.cos(a)*W/2, H/2-ry+Math.sin(a)*ry]); }
    return L;
  }
  if (squareBottom && r > 0.01){                      // rounded at the top only

/* Circuit board art: a screenshot of a schematic or a PCB layout becomes raised copper
   on a solder-mask coloured plate, with mounting holes, edge fingers and a hatched pour. */
function buildPCB(){
  const d = state.items[state.active] || state.items[0];
  const src = d && sourceCanvas(d);
  const p = state.base.pcb;
  if (!src){ notify("The circuit board is traced from artwork: add a screenshot of a schematic on the Art tab."); return []; }

  const artW = Math.max(10, p.width - p.margin*2), artH = artW/d.aspect;
  const boardW = p.width, boardH = artH + p.margin*2;
  const cell = clamp(p.quality, 0.06, 0.4);
  const gx = clamp(Math.round(artW/cell), 60, 1100), gy = Math.max(6, Math.round(gx/d.aspect));
  const img = resample(src, gx, gy, d.mirror);

  // ink: the dark lines of a schematic (or the light ones, inverted)
  const ink = new Uint8Array(gx*gy), thr = p.thr/100;
  for (let i=0;i<ink.length;i++){
    const o = i*4;
    if (img.data[o+3] < 128){ ink[i] = 0; continue; }
    const l = C.luma(img.data[o], img.data[o+1], img.data[o+2]);
    ink[i] = (p.invert ? l > thr : l < thr) ? 1 : 0;
  }
  const px = gx/artW;
  let mask = p.thicken > 0 ? C.dilateMask(ink, gx, gy, p.thicken/2*px) : ink;
  if (p.despeckle > 0){                       // drop dust that would print as blobs
    const { lab, comps } = C.labelMask(mask, gx, gy);
    const minPx = p.despeckle*px*px;
    const drop = new Set(comps.filter(c=>c.area < minPx).map(c=>c.id));
    if (drop.size){ const m2 = new Uint8Array(mask); for (let i=0;i<m2.length;i++) if (drop.has(lab[i])) m2[i] = 0; mask = m2; }
  }
  // labels and small marks can print in the silkscreen colour instead
  let textMask = null;
  if (p.textOn){
    const { lab, comps } = C.labelMask(mask, gx, gy);
    const maxPx = p.textMax*px*px;
    const small = new Set(comps.filter(c=>c.area <= maxPx).map(c=>c.id));
    if (small.size){
      textMask = new Uint8Array(mask.length);
      const big = new Uint8Array(mask);
      for (let i=0;i<mask.length;i++) if (small.has(lab[i])){ textMask[i] = 1; big[i] = 0; }

    }
  }

  const opt = { mmPerPx:artW/gx, smooth:2, eps:Math.max(0.03, cell*0.4) };
  const boardSlot = clamp(state.base.slot,0,state.slots.length-1);
  const traceSlot = clamp(p.traceSlot,0,state.slots.length-1);
  const parts = [];

  // the board itself, with mounting holes

  // copper, raised or engraved into the board

      holes:[...holes, ...traces.map(t=>t.outer)] }], p.thick-depth-0.01, p.thick);

  } else {
    const tSolid = traces.length ? C.extrudePolysAt(traces, Math.max(0,p.thick-0.2), p.thick+p.traceH) : null;
    if (tSolid) parts.push({ name:"Copper", slot:traceSlot, solid:tSolid });
  }

    const tp = C.maskToPolys(textMask, gx, gy, opt);
    const s2 = tp.length ? C.extrudePolysAt(tp, Math.max(0,p.thick-0.2), p.thick+p.traceH) : null;
    if (s2) parts.push({ name:"Silkscreen", slot:clamp(p.textSlot,0,state.slots.length-1), solid:s2 });

      if (Math.abs(x) > boardW/2-inset || Math.abs(y) > boardH/2-inset) continue;
      if (p.holes){
        const hx = boardW/2-p.holeInset, hy = boardH/2-p.holeInset;
        if (Math.min(Math.hypot(Math.abs(x)-hx, Math.abs(y)-hy)) < p.holeDia/2+inset) continue;
      }

/* Jigsaw puzzle: a picture cut into interlocking pieces that print assembled, face up, with a
   small gap all round so they come apart. The cut is drawn from a seed: Shuffle picks a new one

let jigsawInfo = null;
const JIGSAW_SHAPES = [["rect","Rectangle"],["rounded","Rounded corners"],["oval","Oval"],["heart","Heart"],["hex","Hexagon"]];

    const sol = polys.length ? C.extrudePolysAt(polys, Math.max(0,np.thick-0.3), np.thick+np.nameH) : null;

function frameFor(d){
  const back = d.side === "back";
  const n = back ? new THREE.Vector3(0,-1,0) : new THREE.Vector3().fromArray(d.place.n).normalize();
  const c0 = back ? new THREE.Vector3(d.place.c[0], 0, d.place.c[2]) : new THREE.Vector3().fromArray(d.place.c);
  const ref = Math.abs(n.y) < 0.9 ? new THREE.Vector3(0,1,0) : new THREE.Vector3(0,0,-1);
  const bv = ref.clone().sub(n.clone().multiplyScalar(ref.dot(n))).normalize();
  const tv = new THREE.Vector3().crossVectors(bv,n).normalize();
  const a = d.rotation*Math.PI/180, ca = Math.cos(a), sa = Math.sin(a);
  const t = tv.clone().multiplyScalar(ca).add(bv.clone().multiplyScalar(sa));
  const b = tv.clone().multiplyScalar(-sa).add(bv.clone().multiplyScalar(ca));
  const c = c0.add(t.clone().multiplyScalar(d.offU||0)).add(b.clone().multiplyScalar(d.offV||0));
  return { c:c.toArray(), n:n.toArray(), t:t.toArray(), b:b.toArray() };
}

}
function cellMapFor(d){

}

  const hit = ray.intersectObjects(modelGroup.children, false)[0];
  if (!hit){ notify("Click on the model itself."); return; }
  // snap to the corner of the part nearest the click when it is within 12 px on screen and close to
  // the surface that was hit (so a corner hidden behind the model is never taken)

/* ---------- colour painter (Session 13) ----------
